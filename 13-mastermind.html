<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PuzzleX - mastermind</title>
    <style>
        @font-face {
            font-family: 'font';
            src: url('font.ttf') format('truetype');
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'font', 'Courier New', monospace;
            background: #111;
            margin-left: 12.5px;
        }

        h3 {
            text-align: left;
            color: lime;
            letter-spacing: 1.25px;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #000;
            border-left: 2px solid lime;
            border-right: 2px solid lime;
            border-bottom: 2px solid lime;
            border-radius: 7.5px;
            padding: 20px 7.5px 10px 7.5px;
            gap: 17.5px;
            height: 475px;
            width: 275px;
        }

        .game-board {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .guess-cells {
            display: flex;
            gap: 5px;
        }

        .cell {
            width: 35px;
            height: 35px;
            border: 2.5px solid #333;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17.5px;
            font-weight: bold;
            cursor: pointer;
            background: #000;
            color: #eee;
        }

        .cell:hover {
            border-color: lime;
        }

        .cell.active {
            border-color: lime;
            color: #fff;
        }

        .cell.disabled {
            opacity: 0.35;
            cursor: not-allowed;
            border-color: #333;
        }

        .cell.disabled:hover {
            border-color: #333;
        }

        .hints {
            display: flex;
            gap: 3.75px;
            margin-left: 5px;
        }

        .hint {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17.5px;
            font-weight: bold;
            color: #000;
        }

        .hint.disabled {
            background: transparent;
            border: 2.5px solid #333;
        }

        .hint.green {
            background: #39ff14;
        }

        .hint.yellow {
            background: #fff600;
        }

        .hint.red {
            background: #ff2079;
        }

        button {
            font-family: 'font', 'Courier New', monospace;
            cursor: pointer;
            border-radius: 4px;
        }

        .enter-btn {
            background: #000;
            color: lime;
            border: 2px solid lime;
            padding: 7.5px 5px;
            font-size: 20px;
            width: 40%;
        }

        .enter-btn:hover:not(:disabled) {
            background: lime;
            color: #000;
        }

        .enter-btn:disabled {
            color: #333;
            border-color: #333;
            cursor: not-allowed;
        }

        .counters {
            text-align: center;
            width: 100%;
        }

        .counter {
            margin: 5px 0;
            font-size: 18.75px;
            letter-spacing: 0.625px;
            white-space: nowrap;
        }

        .counter.wins {
            color: #39ff14;
        }

        .counter.losses {
            color: #ff2079;
        }

        @media (max-width: 600px) {
            body {
                font-size: 20px;
                transform: scale(1.0);
                transform-origin: top left;
            }
        }
    </style>
</head>
<body>
<h3>PuzzleX by Carlos Sivila</h3>
    <div class="game-container">
        <div class="game-board" id="gameBoard"></div>
        <button class="enter-btn" id="enterBtn" onclick="submitGuess()" disabled>ENVIAR</button>
        <div class="counters">
            <div class="counter wins" id="winsCounter">0 aciertos de 16</div>
            <div class="counter losses" id="lossesCounter">0 fallos de 8</div>
        </div>
    </div>

    <script>
        let secretCode = [];
        let currentRow = 0;
        let currentGuess = [0, 0, 0];
        let gameActive = true;
        let wins = 0;
        let losses = 0;
        let audioCtx = null;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playAcierto() {
            initAudio();
            const notas = [523.25, 587.33, 659.25, 783.99];
            const tiempos = [0, 0.15, 0.3, 0.45];
            
            notas.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime + tiempos[i]);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + tiempos[i] + 0.15);
                
                osc.start(audioCtx.currentTime + tiempos[i]);
                osc.stop(audioCtx.currentTime + tiempos[i] + 0.15);
            });
        }

        function playFallo() {
            initAudio();
            const now = audioCtx.currentTime;
            [440, 392, 349.23, 293.66].forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.12, now + i * 0.15);
                gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.4);
                osc.start(now + i * 0.15);
                osc.stop(now + i * 0.15 + 0.45);
            });
        }

        function playVictoria() {
            initAudio();
            const now = audioCtx.currentTime;
            
            const notasIniciales = [523.25, 587.33, 659.25, 783.99];
            notasIniciales.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.frequency.setValueAtTime(freq, now + i * 0.15);
                gainNode.gain.setValueAtTime(0.2, now + i * 0.15);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.15);
                
                osc.start(now + i * 0.15);
                osc.stop(now + i * 0.15 + 0.15);
            });

            const notasFinales = [880, 1046.5];
            notasFinales.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                const startTime = now + 0.75 + i * 0.15;
                osc.frequency.setValueAtTime(freq, startTime);
                gainNode.gain.setValueAtTime(0.25, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + 0.2);
                
                osc.start(startTime);
                osc.stop(startTime + 0.2);
            });
        }

        function generateSecretCode() {
            secretCode = [];
            for (let i = 0; i < 3; i++) {
                secretCode.push(Math.floor(Math.random() * 3) + 1);
            }
            console.log('Código secreto:', secretCode);
        }

        function createGameBoard() {
            const gameBoard = document.getElementById('gameBoard');
            gameBoard.innerHTML = '';

            for (let row = 0; row < 8; row++) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'row';
                rowDiv.innerHTML = `
                    <div class="guess-cells">
                        <div class="cell ${row === 0 ? 'active' : 'disabled'}" 
                             onclick="cycleCellValue(${row}, 0)" 
                             id="cell-${row}-0"></div>
                        <div class="cell ${row === 0 ? 'active' : 'disabled'}" 
                             onclick="cycleCellValue(${row}, 1)" 
                             id="cell-${row}-1"></div>
                        <div class="cell ${row === 0 ? 'active' : 'disabled'}" 
                             onclick="cycleCellValue(${row}, 2)" 
                             id="cell-${row}-2"></div>
                    </div>
                    <div class="hints" id="hints-${row}">
                        <div class="hint disabled" id="hint-${row}-0"></div>
                        <div class="hint disabled" id="hint-${row}-1"></div>
                        <div class="hint disabled" id="hint-${row}-2"></div>
                    </div>
                `;
                gameBoard.appendChild(rowDiv);
            }
        }

        function cycleCellValue(row, col) {
            if (row !== currentRow || !gameActive) return;

            currentGuess[col] = (currentGuess[col] % 3) + 1;
            const cell = document.getElementById(`cell-${row}-${col}`);
            cell.textContent = currentGuess[col];

            updateEnterButton();
        }

        function updateEnterButton() {
            const allFilled = currentGuess.every(val => val > 0);
            document.getElementById('enterBtn').disabled = !allFilled;
        }

        function submitGuess() {
            if (!gameActive) return;

            const hints = calculateHints(currentGuess, secretCode);
            displayHints(currentRow, hints);

            if (hints.green === 3) {
                endGame(true);
                return;
            }

            currentRow++;
            
            if (currentRow >= 8) {
                endGame(false);
                return;
            }

            activateRow(currentRow);
            currentGuess = [0, 0, 0];
            updateEnterButton();
        }

        function calculateHints(guess, secret) {
            let green = 0;
            let yellow = 0;
            let red = 0;

            let guessCopy = [...guess];
            let secretCopy = [...secret];

            for (let i = 0; i < 3; i++) {
                if (guessCopy[i] === secretCopy[i]) {
                    green++;
                    guessCopy[i] = -1;
                    secretCopy[i] = -1;
                }
            }

            for (let i = 0; i < 3; i++) {
                if (guessCopy[i] !== -1) {
                    const foundIndex = secretCopy.indexOf(guessCopy[i]);
                    if (foundIndex !== -1) {
                        yellow++;
                        secretCopy[foundIndex] = -1;
                    } else {
                        red++;
                    }
                }
            }

            return { green, yellow, red };
        }

        function displayHints(row, hints) {
            const values = [
                { count: hints.green, cls: 'green' },
                { count: hints.yellow, cls: 'yellow' },
                { count: hints.red, cls: 'red' }
            ];

            values.forEach((v, i) => {
                const circle = document.getElementById(`hint-${row}-${i}`);
                circle.className = `hint ${v.cls}`;
                circle.textContent = v.count;
            });
        }

        function activateRow(row) {
            if (row > 0) {
                for (let col = 0; col < 3; col++) {
                    const prevCell = document.getElementById(`cell-${row-1}-${col}`);
                    prevCell.classList.remove('active');
                    prevCell.classList.add('disabled');
                }
            }

            for (let col = 0; col < 3; col++) {
                const cell = document.getElementById(`cell-${row}-${col}`);
                cell.classList.remove('disabled');
                cell.classList.add('active');
                cell.textContent = '';
            }
        }

        function endGame(won) {
            gameActive = false;

            if (won) {
                wins++;
            } else {
                losses++;
            }
            
            updateCounters();
            document.getElementById('enterBtn').disabled = true;

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 3; col++) {
                    const cell = document.getElementById(`cell-${row}-${col}`);
                    cell.classList.remove('active');
                    cell.classList.add('disabled');
                }
            }

            setTimeout(() => {
                if (won) {
                    playAcierto();
                } else {
                    playFallo();
                }

                setTimeout(() => {
                    if (wins >= 16) {
                        playVictoria();
                        setTimeout(() => {
                            alert('Ganaste');
                            resetCounters();
                            newGame();
                        }, 2500);
                    } else if (losses >= 8) {
                        alert('Perdiste');
                        resetCounters();
                        newGame();
                    } else {
                        newGame();
                    }
                }, 1500);
            }, 1500);
        }

        function newGame() {
            currentRow = 0;
            currentGuess = [0, 0, 0];
            gameActive = true;
            
            generateSecretCode();
            createGameBoard();
            
            document.getElementById('enterBtn').disabled = true;
        }

        function updateCounters() {
            document.getElementById('winsCounter').textContent = `${wins} aciertos de 16`;
            document.getElementById('lossesCounter').textContent = `${losses} fallos de 8`;
        }

        function resetCounters() {
            wins = 0;
            losses = 0;
            updateCounters();
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' && !document.getElementById('enterBtn').disabled) {
                submitGuess();
            }
        });

        newGame();
    </script>

<script>
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });
</script>

</body>
</html>
