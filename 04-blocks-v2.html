<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PuzzleX - Blocks-v2</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            height: 100vh;
            background-color: #111;
            color: #ffffff;
            font-family: 'Roboto', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #main {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 610px;
            width: 400px;
            border: 1px solid #e2e2e2;
            border-radius: 8px;
        }

        #main h2 {
            font-size: 28px;
            font-weight: 300;
            position: absolute;
            bottom: -10px;
            left: 15px;
        }

        #main-infobar {
            height: 60px;
            position: relative;
            cursor: default;
        }

        .btn {
            position: relative;
            background-color: #3063ec;
            text-align: center;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
        }

        .bonus {
            display: inline-block;
            vertical-align: middle;
            height: 40px;
            width: 40px;
            border-radius: 20px;
            margin-right: 5px;
            box-sizing: border-box;
            border: 2px solid #e2e2e2;
            background-color: #ffffff;
            font-size: 14px;
            color: #e2e2e2;
            transition: 0.1s ease-out;
            cursor: default;
        }

        .bonus-active {
            border: 2px solid #3063ec;
            cursor: pointer;
        }

        .bonus-active:hover {
            width: 70px;
        }

        .inactive {
            filter: grayscale(1);
            opacity: 0.3;
        }

        .info-bubble {
            position: absolute;
            bottom: -4px;
            right: -4px;
            width: 16px;
            height: 15px;
            background-color: #2956cf;
            border-radius: 8px;
            font-size: 10px;
            padding-top: 1px;
            text-align: center;
            display: none;
        }

        .bonus-active .info-bubble {
            display: block;
        }

        #buttons-container {
            position: absolute;
            top: 10px;
            right: 10px;
        }

        .bonus-icon {
            height: 24px;
            width: 24px;
            margin-left: 6px;
            margin-top: 6px;
            font-size: 20px;
            line-height: 24px;
            text-align: center;
        }

        .bonus-text {
            position: absolute;
            width: calc(100% - 15px);
            left: 0;
            top: 0;
            text-align: right;
            padding-right: 15px;
            padding-top: 10px;
        }

        #rotate-btn:hover.bonus-active .bonus-text::after {
            content: "A";
            color: #3063ec;
        }

        #flip-btn:hover.bonus-active .bonus-text::after {
            content: "B";
            color: #3063ec;
        }

        .bonus-active .bonus-icon {
            color: #3063ec;
        }

        #reset-btn {
            display: inline-block;
            height: 40px;
            width: 100px;
            border-radius: 20px;
            font-weight: 500;
            box-sizing: border-box;
        }

        #reset-icon {
            height: 18px;
            width: 18px;
            float: left;
            margin-right: 10px;
            font-size: 18px;
            line-height: 18px;
        }

        #reset-btn-content {
            text-align: left;
            width: 70px;
            display: block;
            margin: 0 auto;
            margin-top: 10px;
        }

        #reset-btn-content::after {
            content: "reset";
        }

        #reset-btn:hover {
            border: 2px solid #3063ec;
            color: #3063ec;
            background-color: #ffffff;
        }

        #reset-btn:hover #reset-btn-content {
            margin-top: 8px;
        }

        #render_canvas {
            width: 400px;
            height: 550px;
            background-color: #333333;
            border-radius: 8px;
            cursor: default;
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes zoom-in {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        #dialog {
            display: none;
            position: absolute;
            height: 400px;
            width: 400px;
            border-radius: 8px;
            bottom: 150px;
            background-color: rgba(23,23,23,0.5);
            backdrop-filter: blur(4px);
            animation: fade-in 0.5s;
        }

        .dialog-box {
            position: relative;
            display: none;
            opacity: 0;
            transform: translate(-50%, -50%);
            top: 50%;
            left: 50%;
            animation: zoom-in 0.5s forwards;
            animation-delay: 0.25s;
        }

        .dialog-box h3, .dialog-box h4 {
            text-align: center;
            font-weight: 500;
            color: #ffffff;
            margin-top: 0;
        }

        .dialog-box h3 {
            font-size: 32px;
            height: 30px;
        }

        .dialog-box h4 {
            font-size: 20px;
        }

        .dialog-box .btn {
            height: 30px;
            width: 120px;
            border-radius: 20px;
            padding-top: 10px;
            margin: 0 auto;
            display: block;
            transition: 0.1s ease-out;
            margin-top: -10px;
        }

        .cancel {
            background-color: #ffffff;
            color: #333333;
        }

        .cancel:hover {
            background-color: #e2e2e2 !important;
        }

        .confirm:hover {
            background-color: #2c59d4;
        }

        .btn-wrapper {
            display: block;
            width: 260px;
            margin: 0 auto;
        }

        .btn-wrapper .btn {
            margin-left: 5px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="main-infobar">
            <h2 id="score">0</h2>
            <div id="buttons-container">
                <div class="btn bonus" id="rotate-btn">
                    <div class="bonus-icon">🔄</div>
                    <div class="bonus-text"></div>
                    <div class="info-bubble" id="rotate-bubble"></div>
                </div>
                <div class="btn bonus" id="flip-btn">
                    <div class="bonus-icon">↔️</div>
                    <div class="bonus-text"></div>
                    <div class="info-bubble" id="flip-bubble"></div>
                </div>
                <div class="btn" id="reset-btn">
                    <div id="reset-btn-content">
                        <div id="reset-icon">↻</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="dialog">
            <div id="end-box" class="dialog-box">
                <h4>No hay más movimientos posibles</h4>
                <div class="btn confirm" id="tryagain-btn">¿Desea intentarlo otra vez?</div>
            </div>
            <div id="reset-box" class="dialog-box">
                <h3>¿Está seguro?</h3>
                <div class="btn-wrapper">
                    <div class="btn confirm" id="reset-confirm-btn">Sí, reiniciar</div>
                    <div class="btn cancel" id="reset-cancel-btn">No, regresar</div>
                </div>
            </div>
        </div>

        <canvas id="render_canvas"></canvas>
    </div>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());

        const canvas = document.querySelector("#render_canvas");
        const context = canvas.getContext("2d");
        const canvas_size = { width: 400, height: 550 };
        canvas.width = canvas_size.width;
        canvas.height = canvas_size.height;

        const tiles = {
            1: { map: [[1,1,1],[1,0,0]], count: 4, background: "#FF6201" },
            2: { map: [[1,1],[1,0]], count: 3, background: "#D33F49" },
            3: { map: [[1,1],[1,1]], count: 4, background: "#2667FF" },
            4: { map: [[1],[1]], count: 2, background: "#28AFB0" },
            5: { map: [[0,1],[1,1]], count: 3, background: "#F9C80E" },
            6: { map: [[1,1,1]], count: 3, background: "#A2D729" },
            7: { map: [[1],[1],[1]], count: 3, background: "#A01A7D" },
            8: { map: [[1]], count: 1, background: "#04724D" },
            9: { map: [[1,1],[1,0],[1,0]], count: 4, background: "#52489C" },
            10: { map: [[0,1,1],[1,1,0]], count: 4, background: "#FFE66D" },
            11: { map: [[0,1,0],[1,1,1]], count: 4, background: "#EF798A" },
            12: { map: [[1,0,0],[1,1,1]], count: 4, background: "#60992D" }
        };

        const tileImages = {};
        
        const rotateTileMap = (map) => {
            const rows = map.length;
            const cols = map[0].length;
            const rotated = [];
            
            for (let x = cols - 1; x >= 0; x--) {
                const newRow = [];
                for (let y = 0; y < rows; y++) {
                    newRow.push(map[y][x]);
                }
                rotated.push(newRow);
            }
            
            return rotated;
        };

        const flipTileMap = (map) => {
            return map.map(row => [...row].reverse());
        };

        const generateTileImage = (id, isShadow = false) => {
            const tile = tiles[id];
            const cellSize = 30;
            const tmpCanvas = document.createElement('canvas');
            tmpCanvas.width = tile.map[0].length * cellSize;
            tmpCanvas.height = tile.map.length * cellSize;
            const tmpCtx = tmpCanvas.getContext('2d');

            for (let y = 0; y < tile.map.length; y++) {
                for (let x = 0; x < tile.map[0].length; x++) {
                    if (tile.map[y][x] === 1) {
                        if (isShadow) {
                            tmpCtx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                        } else {
                            tmpCtx.fillStyle = tile.background;
                        }
                        tmpCtx.fillRect(x * cellSize, y * cellSize, cellSize - 2, cellSize - 2);
                    }
                }
            }
            return tmpCanvas;
        };

        Object.keys(tiles).forEach(id => {
            tileImages[id] = generateTileImage(id);
            tileImages[`${id}-shadow`] = generateTileImage(id, true);
        });

        let objects = {
            "background": { x: 0, y: 0, width: canvas.width, height: 550, background: "#333333" },
            "deck": { x: 0, y: 400, width: canvas.width, height: 150, background: "#FFFFFF" }
        };

        const drawBoard = () => {
            context.strokeStyle = "#444444";
            context.lineWidth = 1;
            for (let i = 0; i <= 8; i++) {
                context.beginPath();
                context.moveTo(i * 50, 0);
                context.lineTo(i * 50, 400);
                context.stroke();
                context.beginPath();
                context.moveTo(0, i * 50);
                context.lineTo(400, i * 50);
                context.stroke();
            }
        };

        let end = false;
        let score = 0;
        const map_size = 8;
        let map = Array(map_size).fill().map(() => Array(map_size).fill(0));
        let tilesprops = { deck: [0,0,0], total: 0, type: 0, focused: "", can_place: false };
        let bonuses = { total: { rotate: 0, flip: 0 }, uses: { rotate: 0, flip: 0 }, get: 100 };
        let cursor = { x: 0, y: 0 };
        let hover = { id: 0, name: "" };
        let place_location = { x: 0, y: 0 };
        let reset_dialogue = false;

        // Audio Context para los sonidos
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        const playSound = (type) => {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            if (type === 'place') {
                // Sonido suave de colocación
                oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                oscillator.type = 'sine';
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            } else if (type === 'fill') {
                // Sonido brillante de completar línea
                oscillator.frequency.setValueAtTime(600, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1200, audioContext.currentTime + 0.15);
                gainNode.gain.setValueAtTime(0.4, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
                oscillator.type = 'triangle';
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.15);
            }
        };

        let animations = {
            tile: {
                stack: [],
                duration: 0.2,
                fps: 60,
                from: { opacity: 1 },
                to: { opacity: 0 },
                after: (object) => {
                    let {x,y} = objects[object];
                    x /= 50;
                    y /= 50;
                    map[y][x] = 0;
                    delete objects[object];
                }
            },
            decktile: {
                stack: [],
                duration: 0.25,
                fps: 60,
                from: { opacity: 0, scale: 0 },
                to: { opacity: 1, scale: 1 },
                after: () => {}
            }
        };

        const animate = (animation, object) => {
            animations[animation].stack.push(object);
        };

        const animation_done = (animation) => {
            return animations[animation].stack.length == 0;
        };

        Object.keys(animations).forEach((type) => {
            const animation = animations[type];
            const frames = animation.duration * animation.fps;
            setInterval(() => {
                if (animation.stack.length > 0) {
                    Object.keys(animation.from).forEach((property) => {
                        const change = Math.abs(animation.from[property] - animation.to[property]) / frames;
                        for (let object of animation.stack) {
                            if (!Object.keys(objects[object]).includes(property)) {
                                objects[object][property] = animation.from[property];
                            }

                            if (animation.from[property] >= animation.to[property]) {
                                if (objects[object][property] > animation.to[property] + change) {
                                    objects[object][property] -= change;
                                } else {
                                    animation.stack = animation.stack.filter((o) => o != object);
                                    animation.after(object);
                                }
                            } else {
                                if (objects[object][property] < animation.to[property] - change) {
                                    objects[object][property] += change;
                                } else {
                                    animation.stack = animation.stack.filter((o) => o != object);
                                    animation.after(object);
                                }
                            }
                        }
                    });
                }
            }, (animation.duration / frames) * 1000);
        });

        const update_bonuses = () => {
            for (let bonus of Object.keys(bonuses.total)) {
                const condition = !end;
                document.querySelector(`#${bonus}-bubble`).style.display = "none";
                document.querySelector(`#${bonus}-btn`).classList.toggle("bonus-active", condition);
            }
        };

        const update_score = () => {
            document.querySelector("#score").innerHTML = score;
            update_bonuses();
            if (score >= 1500 && !end) {
            setTimeout(() => alert("¡Ganaste!"), 100);
            }
        };

        const generate_tile_type = (index) => {
            let type = Math.floor(Math.random() * Object.keys(tiles).length) + 1;
            if (tilesprops.deck.includes(type)) {
                generate_tile_type(index);
            } else {
                tilesprops.deck[index] = type;
            }
        };

        const generate_tiles = () => {
            while (tilesprops.deck.indexOf(0) != -1) {
                let index = tilesprops.deck.indexOf(0);
                generate_tile_type(index);

                tilesprops.total += 1;
                let name = {
                    tile: `tile${tilesprops.total}`,
                    shadow: `tile${tilesprops.total}-shadow`
                };

                objects[name.shadow] = {
                    x: (125 * index) + 30,
                    y: 425,
                    width: tiles[tilesprops.deck[index]].map[0].length * 50,
                    height: tiles[tilesprops.deck[index]].map.length * 50,
                    tileId: `${tilesprops.deck[index]}-shadow`,
                    hide: true
                };

                objects[name.tile] = {
                    x: (125 * index) + 30,
                    y: 425,
                    default_x: (125 * index) + 30,
                    default_y: 425,
                    width: tiles[tilesprops.deck[index]].map[0].length * 30,
                    height: tiles[tilesprops.deck[index]].map.length * 30,
                    tileId: tilesprops.deck[index],
                    opacity: 0,
                    scale: 0,
                    mousedown: () => {
                        if (!end && !reset_dialogue) {
                            tilesprops.focused = hover.name;
                            tilesprops.type = tilesprops.deck[index];
                            canvas.style.cursor = "none";
                            Object.assign(objects[name.tile], {
                                width: tiles[tilesprops.deck[index]].map[0].length * 50,
                                height: tiles[tilesprops.deck[index]].map.length * 50,
                                top: true
                            });
                        }
                    }
                };

                animate("decktile", name.tile);
            }
        };

        const check_full = () => {
            for (let y = 0; y < map_size; y++) {
                let row_count = 0;
                let column_count = 0;

                for (let x = 0; x < map_size; x++) {
                    if (map[y][x] != 0) row_count++;
                    if (map[x][y] != 0) column_count++;
                }

                let stack = [];
                if (map_size == row_count) {
                    score += 10;
                    playSound('fill');
                    for (let x = 0; x < map_size; x++) {
                        if (!animations.tile.stack.some((object) => object.x == x && object.y == y)) {
                            stack.push({x: x, y: y});
                        }
                    }
                }
                if (map_size == column_count) {
                    score += 10;
                    if (stack.length === 0) playSound('fill'); // Solo reproducir si no se reprodujo antes
                    for (let x = 0; x < map_size; x++) {
                        if (!animations.tile.stack.some((object) => object.x == y && object.y == x)) {
                            stack.push({x: y, y: x});
                        }
                    }
                }

                stack.forEach((tile) => {
                    animate("tile", `placed-tile${tile.x}x${tile.y}`);
                });
            }
        };

        const check_moves = () => {
            let possible_moves = 0;
            for (let tile of tilesprops.deck) {
                const tilemap = tiles[tile].map;
                for (let y = 0; y < map_size; y++) {
                    for (let x = 0; x < map_size; x++) {
                        if (x <= map_size - tilemap[0].length && y <= map_size - tilemap.length) {
                            let pass = 0;
                            for (let tx = 0; tx < tilemap[0].length; tx++) {
                                for (let ty = 0; ty < tilemap.length; ty++) {
                                    if (tilemap[ty][tx] != 0 && map[y + ty][x + tx] == 0) {
                                        pass += 1;
                                    }
                                }
                            }
                            if (pass == tiles[tile].count) {
                                possible_moves += 1;
                            }
                        }
                    }
                }
            }
            return possible_moves;
        };

        const getCursorPosition = (e) => {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            return {
                x: Math.round(clientX - rect.left),
                y: Math.round(clientY - rect.top)
            };
        };

        const handleMove = (e) => {
            e.preventDefault();
            cursor = getCursorPosition(e);

            let objects_hover = [];
            const visible_objects = Object.entries(objects).filter(([key, obj]) => obj.hide != true);

            for (let [key, obj] of visible_objects) {
                const { x, y, width, height } = obj;
                if (x < cursor.x && cursor.x < x + width && y < cursor.y && cursor.y < y + height) {
                    objects_hover.push(Object.keys(objects).indexOf(key));
                    hover = {
                        id: Math.max(...objects_hover),
                        name: Object.keys(objects)[Math.max(...objects_hover)]
                    };
                }
            }

            if (objects[tilesprops.focused] !== undefined) {
                Object.assign(objects[tilesprops.focused], { x: cursor.x, y: cursor.y });

                if (cursor.y < 450 - objects[tilesprops.focused].height && cursor.x < 450 - objects[tilesprops.focused].width) {
                    place_location = {
                        x: Math.floor(cursor.x / 50),
                        y: Math.floor(cursor.y / 50)
                    };

                    let tilemap = tiles[tilesprops.type].map;
                    let pass = 0;
                    for (let x = 0; x < tilemap[0].length; x++) {
                        for (let y = 0; y < tilemap.length; y++) {
                            if (tilemap[y][x] != 0 && map[y + place_location.y][x + place_location.x] == 0) {
                                pass += 1;
                            }
                        }
                    }

                    if (pass == tiles[tilesprops.type].count) {
                        tilesprops.can_place = true;
                        Object.assign(objects[`${tilesprops.focused}-shadow`], {
                            x: place_location.x * 50,
                            y: place_location.y * 50,
                            hide: false
                        });
                    } else {
                        tilesprops.can_place = false;
                        objects[`${tilesprops.focused}-shadow`].hide = true;
                    }
                } else {
                    tilesprops.can_place = false;
                    objects[`${tilesprops.focused}-shadow`].hide = true;
                }
            }
        };

        const handleStart = (e) => {
            if (objects[hover.name] && objects[hover.name].mousedown) {
                objects[hover.name].mousedown();
            }
        };

        const handleEnd = (e) => {
            if (tilesprops.focused !== "") {
                canvas.style.cursor = "default";
                if (tilesprops.can_place == true) {
                    playSound('place');
                    const objects_to_delete = [tilesprops.focused, tilesprops.focused + "-shadow"];
                    for (let obj of objects_to_delete) {
                        delete objects[obj];
                    }

                    score += tiles[tilesprops.type].count;
                    let tilemap = tiles[tilesprops.type].map;
                    for (let x = 0; x < tilemap[0].length; x++) {
                        for (let y = 0; y < tilemap.length; y++) {
                            if (tilemap[y][x] != 0) {
                                map[place_location.y + y][place_location.x + x] = tilesprops.type;
                                objects[`placed-tile${place_location.x + x}x${place_location.y + y}`] = {
                                    x: (place_location.x + x) * 50,
                                    y: (place_location.y + y) * 50,
                                    width: 50,
                                    height: 50,
                                    background: tiles[tilesprops.type].background,
                                    opacity: 1
                                };
                            }
                        }
                    }

                    tilesprops.can_place = false;
                    tilesprops.deck[tilesprops.deck.indexOf(tilesprops.type)] = 0;

                    check_full();
                    update_score();
                    generate_tiles();

                    setTimeout(() => {
                        if (check_moves() == 0 && animation_done("tile")) {
                            ["#dialog", "#end-box"].forEach((id) => {
                                document.querySelector(id).style.display = "block";
                            });
                            document.querySelector("#reset-box").style.display = "none";
                            document.querySelector("#reset-btn").classList.add("inactive");
                            end = true;
                        }
                    }, (animations.tile.duration + 0.05) * 1000);
                } else {
                    Object.assign(objects[tilesprops.focused], {
                        x: objects[tilesprops.focused].default_x,
                        y: objects[tilesprops.focused].default_y,
                        width: tiles[tilesprops.type].map[0].length * 30,
                        height: tiles[tilesprops.type].map.length * 30,
                        top: false
                    });
                }
                tilesprops.focused = "";
            }
        };

        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mouseup', handleEnd);

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            cursor = getCursorPosition(e);
            
            let objects_hover = [];
            const visible_objects = Object.entries(objects).filter(([key, obj]) => obj.hide != true);

            for (let [key, obj] of visible_objects) {
                const { x, y, width, height } = obj;
                if (x < cursor.x && cursor.x < x + width && y < cursor.y && cursor.y < y + height) {
                    objects_hover.push(Object.keys(objects).indexOf(key));
                    hover = {
                        id: Math.max(...objects_hover),
                        name: Object.keys(objects)[Math.max(...objects_hover)]
                    };
                }
            }
            
            handleStart(e);
        }, { passive: false });

        canvas.addEventListener('touchmove', handleMove, { passive: false });
        canvas.addEventListener('touchend', handleEnd, { passive: false });

        const render_rectangle = (x, y, width, height, color, opacity = 1, scale = 1) => {
            context.globalAlpha = opacity;
            context.fillStyle = color;
            context.fillRect(x + ((width - width * scale) / 2), y + ((height - height * scale) / 2), width * scale, height * scale);
        };

        const render_tile = (x, y, width, height, tileId, opacity = 1, scale = 1) => {
            const img = tileImages[tileId];
            if (img) {
                context.globalAlpha = opacity;
                context.drawImage(img, x + ((width - width * scale) / 2), y + ((height - height * scale) / 2), width * scale, height * scale);
            }
        };

        const render_canvas = () => {
            context.clearRect(0, 0, canvas.width, canvas.height);

            const priority_divide = {
                usual: Object.entries(objects).filter(([key, obj]) => obj.top != true),
                top: Object.entries(objects).filter(([key, obj]) => obj.top == true)
            };

            for (let type of Object.keys(priority_divide)) {
                for (let [key, obj] of priority_divide[type]) {
                    const { x, y, width, height, background, opacity = 1, scale = 1, tileId } = obj;
                    if (obj.hide != true) {
                        if (tileId) {
                            render_tile(x, y, width, height, tileId, opacity, scale);
                        } else if (background) {
                            render_rectangle(x, y, width, height, background, opacity, scale);
                        }
                    }
                }
            }

            drawBoard();
            window.requestAnimationFrame(render_canvas);
        };

        const reset_buttons = ["#tryagain-btn", "#reset-confirm-btn"];
        reset_buttons.forEach((btn) => {
            document.querySelector(btn).onclick = () => {
                if (animation_done("tile") && animation_done("decktile")) {
                    map = Array(map_size).fill().map(() => Array(map_size).fill(0));
                    objects = Object.fromEntries(Object.entries(objects).filter(([key]) => !key.includes("tile")));
                    score = 0;
                    end = false;
                    tilesprops.deck = [0, 0, 0];
                    Object.keys(bonuses.uses).forEach((bonus) => {
                        bonuses.uses[bonus] = 0;
                    });
                    update_score();
                    generate_tiles();
                    document.querySelector("#dialog").style.display = "none";
                    document.querySelector("#end-box").style.display = "none";
                    document.querySelector("#reset-btn").classList.remove("inactive");
                    reset_dialogue = false;
                }
            };
        });

        for (let btn of ["#reset-btn", "#reset-cancel-btn"]) {
            document.querySelector(btn).onclick = () => {
                if (!end) {
                    document.querySelector("#end-box").style.display = "none";
                    for (let id of ["#dialog", "#reset-box"]) {
                        document.querySelector(id).style.display = reset_dialogue ? "none" : "block";
                    }
                    reset_dialogue = !reset_dialogue;
                }
            };
        }

        document.querySelector("#rotate-btn").addEventListener("click", () => {
            if (!end) {
                
                // Rotar cada pieza en el deck
                for (let i = 0; i < tilesprops.deck.length; i++) {
                    if (tilesprops.deck[i] !== 0) {
                        const tileId = tilesprops.deck[i];
                        tiles[tileId].map = rotateTileMap(tiles[tileId].map);
                        
                        // Regenerar imágenes de la pieza rotada
                        tileImages[tileId] = generateTileImage(tileId);
                        tileImages[`${tileId}-shadow`] = generateTileImage(tileId, true);
                        
                        // Actualizar dimensiones de los objetos
                        const tileName = `tile${tilesprops.total - (2 - i)}`;
                        if (objects[tileName]) {
                            objects[tileName].width = tiles[tileId].map[0].length * 30;
                            objects[tileName].height = tiles[tileId].map.length * 30;
                        }
                        if (objects[`${tileName}-shadow`]) {
                            objects[`${tileName}-shadow`].width = tiles[tileId].map[0].length * 50;
                            objects[`${tileName}-shadow`].height = tiles[tileId].map.length * 50;
                        }
                    }
                }
                
                update_bonuses();
            }
        });

        document.querySelector("#flip-btn").addEventListener("click", () => {
            if (!end) {
                
                // Reflejar cada pieza en el deck
                for (let i = 0; i < tilesprops.deck.length; i++) {
                    if (tilesprops.deck[i] !== 0) {
                        const tileId = tilesprops.deck[i];
                        tiles[tileId].map = flipTileMap(tiles[tileId].map);
                        
                        // Regenerar imágenes de la pieza reflejada
                        tileImages[tileId] = generateTileImage(tileId);
                        tileImages[`${tileId}-shadow`] = generateTileImage(tileId, true);
                    }
                }
                
                update_bonuses();
            }
        });

        update_score();
        generate_tiles();
        window.requestAnimationFrame(render_canvas);
    </script>
</body>
</html>
