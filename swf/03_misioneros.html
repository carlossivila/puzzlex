<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Juego SWF con Mouse Virtual</title>
<style>
  * { 
    margin: 0; 
    padding: 0; 
    user-select: none; 
    -webkit-touch-callout: none;
    -webkit-user-select: none;
  }
  
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1a1a2e;
    touch-action: none;
  }
  
  body {
    display: flex;
    justify-content: center;
    align-items: center;
  }
  
  .game-container {
    position: relative;
    width: 800px;
    max-width: 100vw;
    max-height: 100vh;
    aspect-ratio: 4/3;
    background: #000;
    border: 3px solid #e94560;
    border-radius: 10px;
    overflow: hidden;
    touch-action: none;
  }
  
  /* SWF - AHORA CON pointer-events: none PARA QUE NO BLOQUEE */
  #gameSwf {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none !important; /* ¡CRUCIAL! */
    z-index: 1;
  }
  
  /* CAPA TRANSPARENTE - CAPTURA TODOS LOS TOQUES */
  #touchOverlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    background: transparent;
    touch-action: none;
    cursor: none;
  }
  
  /* CURSOR VIRTUAL */
  #virtualCursor {
    position: absolute;
    width: 40px;
    height: 40px;
    z-index: 20;
    pointer-events: none;
    transform: translate(-50%, -50%);
    display: none;
    filter: drop-shadow(0 0 8px rgba(255,255,255,0.8));
  }
  
  #virtualCursor svg {
    width: 100%;
    height: 100%;
  }
  
  /* EFECTO DE CLIC */
  .click-effect {
    position: absolute;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(233,69,96,0.8), rgba(233,69,96,0));
    pointer-events: none;
    z-index: 15;
    transform: translate(-50%, -50%);
    animation: clickAnim 0.5s ease-out forwards;
  }
  
  @keyframes clickAnim {
    0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
  }
  
  /* INFORMACIÓN */
  .status {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.5);
    font-family: Arial, sans-serif;
    font-size: 12px;
    z-index: 5;
    background: rgba(0,0,0,0.7);
    padding: 5px 15px;
    border-radius: 20px;
    pointer-events: none;
    white-space: nowrap;
    text-align: center;
  }
</style>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

<div class="game-container" id="gameContainer">
  
  <!-- SWF DEL JUEGO -->
  <object id="gameSwf" type="application/x-shockwave-flash" data="03_misioneros.swf">
    <param name="movie" value="03_misioneros.swf">
    <param name="quality" value="high">
    <param name="bgcolor" value="#000000">
    <param name="allowScriptAccess" value="always">
    <param name="wmode" value="transparent"> <!-- CAMBIADO A transparent -->
    <param name="menu" value="false">
    <param name="scale" value="exactfit">
    <param name="salign" value="tl">
    <p>Tu navegador no soporta Flash</p>
  </object>
  
  <!-- CAPA TRANSPARENTE (captura toques) -->
  <div id="touchOverlay"></div>
  
  <!-- CURSOR VIRTUAL -->
  <div id="virtualCursor">
    <svg viewBox="0 0 24 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 0L22 18L14 19L22 31L18 32L10 20L0 22V0Z" fill="white" stroke="black" stroke-width="1.5"/>
      <path d="M2 2L18 16L12 17L18 26.5L16 27.5L10 18L2 19.5V2Z" fill="white" stroke="black" stroke-width="1"/>
    </svg>
  </div>
  
  <div class="status" id="status">👆 Toca para mover el cursor | Toca de nuevo para hacer clic</div>
</div>

<script>
// ================================================
//  CONTROLADOR COMPLETO PARA SWF
// ================================================

const container = document.getElementById('gameContainer');
const overlay = document.getElementById('touchOverlay');
const cursor = document.getElementById('virtualCursor');
const swf = document.getElementById('gameSwf');
const status = document.getElementById('status');

let cursorActive = false;
let cursorX = 0;
let cursorY = 0;

// --- MOVER CURSOR ---
function moveCursor(clientX, clientY) {
  const rect = container.getBoundingClientRect();
  
  let x = clientX - rect.left;
  let y = clientY - rect.top;
  
  // Limitar dentro del contenedor
  x = Math.max(0, Math.min(rect.width, x));
  y = Math.max(0, Math.min(rect.height, y));
  
  cursor.style.left = x + 'px';
  cursor.style.top = y + 'px';
  
  cursorX = clientX;
  cursorY = clientY;
  
  if (!cursorActive) {
    cursor.style.display = 'block';
    cursorActive = true;
    status.textContent = '🖱️ Cursor listo | Toca para hacer clic';
  }
}

// --- HACER CLIC (MÚLTIPLES ESTRATEGIAS) ---
function doClick(clientX, clientY) {
  const rect = container.getBoundingClientRect();
  
  // 1. EFECTO VISUAL
  const effect = document.createElement('div');
  effect.className = 'click-effect';
  effect.style.left = (clientX - rect.left) + 'px';
  effect.style.top = (clientY - rect.top) + 'px';
  container.appendChild(effect);
  setTimeout(() => effect.remove(), 500);
  
  // 2. ENVIAR EVENTOS AL SWF (MÚLTIPLES ESTRATEGIAS)
  
  // Estrategia 1: click directo
  try {
    const clickEvent = new MouseEvent('click', {
      clientX: clientX,
      clientY: clientY,
      screenX: clientX,
      screenY: clientY,
      bubbles: true,
      cancelable: true,
      view: window,
      button: 0,
      buttons: 1
    });
    swf.dispatchEvent(clickEvent);
  } catch(e) { console.log('Click directo falló', e); }
  
  // Estrategia 2: mousedown + mouseup (más realista)
  try {
    const downEvent = new MouseEvent('mousedown', {
      clientX: clientX,
      clientY: clientY,
      bubbles: true,
      button: 0,
      buttons: 1
    });
    swf.dispatchEvent(downEvent);
    
    setTimeout(() => {
      const upEvent = new MouseEvent('mouseup', {
        clientX: clientX,
        clientY: clientY,
        bubbles: true,
        button: 0,
        buttons: 0
      });
      swf.dispatchEvent(upEvent);
    }, 50);
  } catch(e) { console.log('Mousedown/up falló', e); }
  
  // Estrategia 3: Evento en el documento (para SWF que escuchan global)
  try {
    const docClick = new MouseEvent('click', {
      clientX: clientX,
      clientY: clientY,
      bubbles: true
    });
    document.dispatchEvent(docClick);
  } catch(e) { console.log('Click en documento falló', e); }
  
  // Estrategia 4: Focus + click
  try {
    swf.focus();
    if (typeof swf.click === 'function') {
      swf.click();
    }
  } catch(e) { console.log('Focus/click falló', e); }
  
  status.textContent = `✅ Clic en (${Math.round(clientX - rect.left)}, ${Math.round(clientY - rect.top)})`;
  console.log(`🖱️ Click en (${clientX}, ${clientY})`);
}

// --- EVENTOS TÁCTILES ---
overlay.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  if (!touch) return;
  
  if (!cursorActive) {
    // Primer toque: mover cursor
    moveCursor(touch.clientX, touch.clientY);
  } else {
    // Segundo toque: hacer clic
    doClick(cursorX, cursorY);
  }
}, { passive: false });

overlay.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  if (touch && cursorActive) {
    moveCursor(touch.clientX, touch.clientY);
  }
}, { passive: false });

// --- EVENTOS DE RATÓN (para PC) ---
overlay.addEventListener('mousemove', (e) => {
  if (!cursorActive) {
    moveCursor(e.clientX, e.clientY);
  } else {
    moveCursor(e.clientX, e.clientY);
  }
});

overlay.addEventListener('click', (e) => {
  if (cursorActive) {
    doClick(e.clientX, e.clientY);
  } else {
    moveCursor(e.clientX, e.clientY);
  }
});

// --- REINICIAR CURSOR CON DOBLE TAP (OPCIONAL) ---
let lastTapTime = 0;
overlay.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTapTime < 300) {
    // Doble tap: reiniciar cursor (ocultar y empezar de nuevo)
    cursor.style.display = 'none';
    cursorActive = false;
    status.textContent = '👆 Toca para mover el cursor';
    lastTapTime = 0;
  } else {
    lastTapTime = now;
  }
});

console.log('🖱️ Mouse Virtual ACTIVADO');
console.log('👆 Toca para mover cursor | Toca de nuevo para clic');
console.log('💡 Doble tap para reiniciar');

// --- FUNCIÓN DE PRUEBA EN CONSOLA ---
window.testClick = function(x, y) {
  const rect = container.getBoundingClientRect();
  const clickX = rect.left + x;
  const clickY = rect.top + y;
  moveCursor(clickX, clickY);
  setTimeout(() => doClick(clickX, clickY), 200);
};
console.log('💡 Usa testClick(100, 200) para probar');
</script>

</body>
</html>
