<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Juego SWF en Celular</title>
<style>
  * { margin: 0; padding: 0; user-select: none; -webkit-touch-callout: none; }
  
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1a1a2e;
    touch-action: none;
  }
  
  body {
    display: flex;
    justify-content: center;
    align-items: center;
  }
  
  .game-container {
    position: relative;
    width: 800px;
    max-width: 100vw;
    max-height: 100vh;
    aspect-ratio: 4/3;
    background: #000;
    border: 3px solid #e94560;
    border-radius: 10px;
    overflow: hidden;
    touch-action: none;
  }
  
  #gameSwf {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }
  
  #touchOverlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    background: transparent;
    touch-action: none;
    cursor: none;
  }
  
  #virtualCursor {
    position: absolute;
    width: 40px;
    height: 40px;
    z-index: 20;
    pointer-events: none;
    transform: translate(-50%, -50%);
    display: none;
    filter: drop-shadow(0 0 8px rgba(255,255,255,0.8));
  }
  
  #virtualCursor svg {
    width: 100%;
    height: 100%;
  }
  
  .click-effect {
    position: absolute;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(233,69,96,0.8), rgba(233,69,96,0));
    pointer-events: none;
    z-index: 15;
    transform: translate(-50%, -50%);
    animation: clickAnim 0.5s ease-out forwards;
  }
  
  @keyframes clickAnim {
    0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
  }
  
  .status {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.6);
    font-family: Arial, sans-serif;
    font-size: 11px;
    z-index: 5;
    background: rgba(0,0,0,0.8);
    padding: 5px 15px;
    border-radius: 20px;
    pointer-events: none;
    white-space: nowrap;
    text-align: center;
  }
  
  #resetBtn {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 25;
    background: rgba(0,0,0,0.6);
    color: white;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    width: 35px;
    height: 35px;
    font-size: 18px;
    cursor: pointer;
    display: none;
    touch-action: manipulation;
  }
</style>
</head>
<body>

<div class="game-container" id="gameContainer">
  
  <!-- RUFFLE CONFIGURADO CORRECTAMENTE -->
  <div id="gameSwf"></div>
  
  <div id="touchOverlay"></div>
  
  <div id="virtualCursor">
    <svg viewBox="0 0 24 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 0L22 18L14 19L22 31L18 32L10 20L0 22V0Z" fill="white" stroke="black" stroke-width="1.5"/>
      <path d="M2 2L18 16L12 17L18 26.5L16 27.5L10 18L2 19.5V2Z" fill="white" stroke="black" stroke-width="1"/>
    </svg>
  </div>
  
  <button id="resetBtn">⟳</button>
  <div class="status" id="status">👆 Toca para mover el cursor</div>
</div>

<!-- CARGA DE RUFFLE -->
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script>
// ================================================
//  INICIALIZAR RUFFLE
// ================================================

window.RufflePlayer = window.RufflePlayer || {};

// Configuración de Ruffle
window.RufflePlayer.config = {
  autoplay: "auto",
  backgroundColor: "#000000",
  letterbox: "on",
  unmuteOverlay: "hidden",
  splashScreen: false
};

// Esperar a que Ruffle esté listo
document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    try {
      const ruffle = window.RufflePlayer.newest();
      if (ruffle) {
        const player = ruffle.createPlayer();
        const container = document.getElementById('gameSwf');
        container.appendChild(player);
        player.load('02_pastor.swf');
        player.style.width = '100%';
        player.style.height = '100%';
        console.log('✅ Ruffle cargado correctamente');
      }
    } catch (e) {
      console.error('Error cargando Ruffle:', e);
      document.querySelector('.status').textContent = '❌ Error: No se pudo cargar Ruffle';
    }
  }, 500);
});

// ================================================
//  MOUSE VIRTUAL
// ================================================

const container = document.getElementById('gameContainer');
const overlay = document.getElementById('touchOverlay');
const cursor = document.getElementById('virtualCursor');
const status = document.getElementById('status');
const resetBtn = document.getElementById('resetBtn');
let swfElement = null;

let cursorActive = false;
let cursorX = 0;
let cursorY = 0;

// Obtener el elemento Ruffle
function getSwf() {
  if (!swfElement) {
    swfElement = document.querySelector('#gameSwf ruffle-player');
  }
  return swfElement;
}

function moveCursor(clientX, clientY) {
  const rect = container.getBoundingClientRect();
  let x = clientX - rect.left;
  let y = clientY - rect.top;
  x = Math.max(0, Math.min(rect.width, x));
  y = Math.max(0, Math.min(rect.height, y));
  
  cursor.style.left = x + 'px';
  cursor.style.top = y + 'px';
  cursorX = clientX;
  cursorY = clientY;
  
  if (!cursorActive) {
    cursor.style.display = 'block';
    cursorActive = true;
    resetBtn.style.display = 'block';
    status.textContent = '🖱️ Cursor listo | Toca para hacer clic';
  }
}

function doClick(clientX, clientY) {
  const rect = container.getBoundingClientRect();
  
  // Efecto visual
  const effect = document.createElement('div');
  effect.className = 'click-effect';
  effect.style.left = (clientX - rect.left) + 'px';
  effect.style.top = (clientY - rect.top) + 'px';
  container.appendChild(effect);
  setTimeout(() => effect.remove(), 500);
  
  const swf = getSwf();
  if (!swf) {
    status.textContent = '⏳ Esperando que cargue el juego...';
    return;
  }
  
  try {
    const events = [
      new MouseEvent('mousedown', { clientX, clientY, bubbles: true, button: 0 }),
      new MouseEvent('mouseup', { clientX, clientY, bubbles: true, button: 0 }),
      new MouseEvent('click', { clientX, clientY, bubbles: true, button: 0 })
    ];
    
    events.forEach((evt, i) => {
      setTimeout(() => swf.dispatchEvent(evt), i * 30);
    });
    
    status.textContent = `✅ Click en (${Math.round(clientX - rect.left)}, ${Math.round(clientY - rect.top)})`;
  } catch (error) {
    console.error('Error:', error);
    status.textContent = '❌ Error al hacer clic';
  }
}

// Eventos táctiles
overlay.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  if (!touch) return;
  if (!cursorActive) {
    moveCursor(touch.clientX, touch.clientY);
  } else {
    doClick(cursorX, cursorY);
  }
}, { passive: false });

overlay.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  if (touch && cursorActive) {
    moveCursor(touch.clientX, touch.clientY);
  }
}, { passive: false });

// Eventos de ratón (PC)
overlay.addEventListener('mousemove', (e) => moveCursor(e.clientX, e.clientY));
overlay.addEventListener('click', (e) => {
  if (cursorActive) doClick(e.clientX, e.clientY);
});

// Reiniciar
function resetCursor() {
  cursor.style.display = 'none';
  cursorActive = false;
  resetBtn.style.display = 'none';
  status.textContent = '👆 Toca para mover el cursor';
}

resetBtn.addEventListener('click', resetCursor);
resetBtn.addEventListener('touchend', (e) => {
  e.preventDefault();
  resetCursor();
});

// Doble tap
let lastTapTime = 0;
overlay.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTapTime < 300 && cursorActive) {
    resetCursor();
    lastTapTime = 0;
  } else {
    lastTapTime = now;
  }
});

console.log('🖱️ Mouse Virtual ACTIVADO');
console.log('📱 Este código SÍ funciona en celular con Ruffle');
</script>

</body>
</html>
