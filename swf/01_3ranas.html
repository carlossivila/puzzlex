<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Juego SWF con Mouse Virtual</title>
<style>
  * { margin: 0; padding: 0; user-select: none; -webkit-touch-callout: none; }
  
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    touch-action: none;
  }
  
  .game-container {
    position: relative;
    width: 800px;
    max-width: 100vw;
    aspect-ratio: 4/3;
    background: #000;
    border: 3px solid #e94560;
    border-radius: 10px;
    overflow: hidden;
    touch-action: none;
  }
  
  /* CAPA TRANSPARENTE CON CURSOR */
  #touchOverlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    background: transparent;
    touch-action: none;
    cursor: none; /* Ocultamos el cursor del sistema */
  }
  
  /* CURSOR VIRTUAL (el puntero del mouse) */
  #virtualCursor {
    position: absolute;
    width: 32px;
    height: 32px;
    z-index: 20;
    pointer-events: none; /* No bloquea los toques */
    transform: translate(-50%, -50%);
    transition: left 0.15s ease-out, top 0.15s ease-out;
    filter: drop-shadow(0 0 5px rgba(255,255,255,0.5));
    display: none; /* Oculto hasta que toques */
  }
  
  /* SVG del cursor (diseño clásico de mouse) */
  #virtualCursor svg {
    width: 100%;
    height: 100%;
  }
  
  /* SWF embebido */
  #gameSwf {
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
  }
  
  /* Indicador de estado */
  .status {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.4);
    font-family: Arial, sans-serif;
    font-size: 12px;
    z-index: 5;
    background: rgba(0,0,0,0.6);
    padding: 6px 16px;
    border-radius: 20px;
    pointer-events: none;
    white-space: nowrap;
  }
  
  /* Punto de clic (feedback visual) */
  .click-feedback {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: rgba(233, 69, 96, 0.6);
    border: 2px solid #e94560;
    pointer-events: none;
    z-index: 15;
    transform: translate(-50%, -50%);
    animation: clickPulse 0.4s ease-out forwards;
  }
  
  @keyframes clickPulse {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
  }
</style>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

<div class="game-container" id="gameContainer">
  
  <!-- SWF del juego -->
  <object id="gameSwf" type="application/x-shockwave-flash" data="01_3ranas.swf">
    <param name="movie" value="01_3ranas.swf">
    <param name="quality" value="high">
    <param name="bgcolor" value="#000000">
    <param name="allowScriptAccess" value="always">
    <param name="wmode" value="window">
    <param name="menu" value="false">
    <param name="scale" value="exactfit">
    <p>Tu navegador no soporta Flash</p>
  </object>
  
  <!-- CURSOR VIRTUAL -->
  <div id="virtualCursor">
    <svg viewBox="0 0 24 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 0L22 18L14 19L22 31L18 32L10 20L0 22V0Z" fill="white" stroke="black" stroke-width="1.5"/>
      <path d="M2 2L18 16L12 17L18 26.5L16 27.5L10 18L2 19.5V2Z" fill="white"/>
      <circle cx="5" cy="7" r="2" fill="rgba(0,0,0,0.3)"/>
    </svg>
  </div>
  
  <div class="status" id="status">👆 Toca para mover el cursor | Toca de nuevo para hacer clic</div>
</div>

<script>
// ================================================
//  MOUSE VIRTUAL PARA SWF
// ================================================

const overlay = document.getElementById('touchOverlay');
const cursor = document.getElementById('virtualCursor');
const swf = document.getElementById('gameSwf');
const container = document.getElementById('gameContainer');
const status = document.getElementById('status');

let cursorVisible = false;
let cursorX = 0;
let cursorY = 0;
let isClickMode = false; // false = mover cursor, true = hacer clic

// --- FUNCIÓN PARA MOVER EL CURSOR ---
function moveCursor(clientX, clientY) {
  const rect = container.getBoundingClientRect();
  
  // Calcular posición relativa al contenedor
  const x = clientX - rect.left;
  const y = clientY - rect.top;
  
  // Limitar al contenedor
  const clampedX = Math.max(0, Math.min(rect.width, x));
  const clampedY = Math.max(0, Math.min(rect.height, y));
  
  // Actualizar posición del cursor
  cursor.style.left = clampedX + 'px';
  cursor.style.top = clampedY + 'px';
  
  // Guardar coordenadas
  cursorX = clientX;
  cursorY = clientY;
  
  // Mostrar cursor si estaba oculto
  if (!cursorVisible) {
    cursor.style.display = 'block';
    cursorVisible = true;
    status.textContent = '🖱️ Cursor activo | Toca para hacer clic';
  }
}

// --- FUNCIÓN PARA HACER CLIC ---
function doClick(clientX, clientY) {
  // 1. Feedback visual (efecto de clic)
  const clickEffect = document.createElement('div');
  clickEffect.className = 'click-feedback';
  const rect = container.getBoundingClientRect();
  clickEffect.style.left = (clientX - rect.left) + 'px';
  clickEffect.style.top = (clientY - rect.top) + 'px';
  container.appendChild(clickEffect);
  
  // Eliminar el efecto después de la animación
  setTimeout(() => clickEffect.remove(), 400);
  
  // 2. Enviar evento de clic al SWF
  try {
    // Opción A: Evento de mouse directo
    const clickEvent = new MouseEvent('click', {
      clientX: clientX,
      clientY: clientY,
      bubbles: true,
      cancelable: true,
      view: window
    });
    swf.dispatchEvent(clickEvent);
    
    // Opción B: Enfocar y enviar
    swf.focus();
    
    // Opción C: Simular mousedown + mouseup (más realista)
    const downEvent = new MouseEvent('mousedown', {
      clientX: clientX,
      clientY: clientY,
      bubbles: true,
      button: 0
    });
    swf.dispatchEvent(downEvent);
    
    setTimeout(() => {
      const upEvent = new MouseEvent('mouseup', {
        clientX: clientX,
        clientY: clientY,
        bubbles: true,
        button: 0
      });
      swf.dispatchEvent(upEvent);
    }, 50);
    
    status.textContent = `✅ Clic en (${Math.round(clientX - rect.left)}, ${Math.round(clientY - rect.top)})`;
    console.log(`🖱️ Click en (${clientX}, ${clientY})`);
    
  } catch (error) {
    console.error('Error al hacer clic:', error);
    status.textContent = '❌ Error: Revisa la consola';
  }
}

// --- MANEJAR TOQUES ---
let touchAction = false;

overlay.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  
  if (!touch) return;
  
  // SI EL CURSOR NO ESTÁ VISIBLE: moverlo
  if (!cursorVisible) {
    moveCursor(touch.clientX, touch.clientY);
    return;
  }
  
  // SI EL CURSOR YA ESTÁ VISIBLE: hacer clic donde está el cursor
  doClick(cursorX, cursorY);
  
}, { passive: false });

// Mover cursor mientras el dedo se desliza
overlay.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  if (touch && cursorVisible) {
    moveCursor(touch.clientX, touch.clientY);
  }
}, { passive: false });

// --- SOPORTE PARA RATÓN EN PC (pruebas) ---
let mouseMoved = false;

overlay.addEventListener('mousemove', (e) => {
  if (!mouseMoved) {
    // Solo para mostrar que funciona en PC
    moveCursor(e.clientX, e.clientY);
    mouseMoved = true;
  }
});

overlay.addEventListener('click', (e) => {
  if (cursorVisible) {
    doClick(e.clientX, e.clientY);
  } else {
    moveCursor(e.clientX, e.clientY);
  }
});

// --- INFORMACIÓN ---
console.log('🖱️ Mouse Virtual para SWF activado');
console.log('👆 Toca una vez → Mueve el cursor');
console.log('👆 Toca de nuevo → Hace clic en esa posición');
console.log('👆 Desliza el dedo → Mueve el cursor en tiempo real');

// --- FUNCIÓN DE AYUDA PARA DEPURACIÓN ---
window.debugClick = function(x, y) {
  const rect = container.getBoundingClientRect();
  const clickX = rect.left + x;
  const clickY = rect.top + y;
  moveCursor(clickX, clickY);
  setTimeout(() => doClick(clickX, clickY), 200);
};
console.log('💡 Usa debugClick(100, 200) en consola para probar');
</script>

</body>
</html>
