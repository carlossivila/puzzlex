<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>3line</title>
<style>
  * { margin: 0; padding: 0; user-select: none; -webkit-touch-callout: none; }
  
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    touch-action: none;
  }

  .game-container {
    position: relative;
    width: 800px;
    max-width: 100vw;
    aspect-ratio: 4/3;
    background: #000;
    border: 3px solid #e94560;
    border-radius: 10px;
    overflow: hidden;
    touch-action: none;
  }

  #touchOverlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    background: transparent;
    touch-action: none;
    cursor: pointer;
  }

  #gameSwf {
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
  }

  .controls-hint {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.3);
    font-family: Arial;
    font-size: 14px;
    z-index: 5;
    background: rgba(0,0,0,0.5);
    padding: 8px 16px;
    border-radius: 20px;
    pointer-events: none;
  }

  .virtual-btn {
    position: absolute;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    color: rgba(255,255,255,0.6);
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 5;
  }
  
  #btnUp { bottom: 140px; left: 50%; transform: translateX(-50%); }
  #btnDown { bottom: 20px; left: 50%; transform: translateX(-50%); }
  #btnLeft { bottom: 80px; left: 20px; }
  #btnRight { bottom: 80px; right: 20px; }
  #btnAction { bottom: 80px; left: 50%; transform: translateX(-50%); width: 70px; height: 70px; background: rgba(233,69,96,0.3); border-color: #e94560; }
</style>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

<div class="game-container" id="gameContainer">

  <object id="gameSwf" type="application/x-shockwave-flash" data="03line.swf">
    <param name="movie" value="03line.swf">
    <param name="quality" value="high">
    <param name="bgcolor" value="#000000">
    <param name="allowScriptAccess" value="always">
    <param name="wmode" value="window">
    <param name="menu" value="false">
    <param name="scale" value="exactfit">
    <p>Tu navegador no soporta Flash</p>
  </object>

  <div id="touchOverlay"></div>

  <div class="virtual-btn" id="btnUp">▲</div>
  <div class="virtual-btn" id="btnDown">▼</div>
  <div class="virtual-btn" id="btnLeft">◄</div>
  <div class="virtual-btn" id="btnRight">►</div>
  <div class="virtual-btn" id="btnAction">⚡</div>
  
  <div class="controls-hint">👆 Toca la pantalla para jugar</div>
</div>

<script>
const overlay = document.getElementById('touchOverlay');
const swf = document.getElementById('gameSwf');
const container = document.getElementById('gameContainer');
function getRelativeCoords(e) {
  const rect = container.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const y = (e.clientY - rect.top) / rect.height;
  return { x: x * 100, y: y * 100 }; // Flash usa % a veces
}

function simulateClick(x, y) {

  const clickEvent = new MouseEvent('click', {
    clientX: x,
    clientY: y,
    bubbles: true,
    cancelable: true
  });

  swf.dispatchEvent(clickEvent);

  swf.focus();

  if (swf.click) {
    swf.click();
  }
  
  console.log(`🖱️ Click simulado en (${Math.round(x)}, ${Math.round(y)})`);
}

function simulateKey(key, isDown = true) {
  const keyMap = {
    'up': { code: 'ArrowUp', key: 'ArrowUp', keyCode: 38 },
    'down': { code: 'ArrowDown', key: 'ArrowDown', keyCode: 40 },
    'left': { code: 'ArrowLeft', key: 'ArrowLeft', keyCode: 37 },
    'right': { code: 'ArrowRight', key: 'ArrowRight', keyCode: 39 },
    'space': { code: 'Space', key: ' ', keyCode: 32 },
    'x': { code: 'KeyX', key: 'x', keyCode: 88 },
    'z': { code: 'KeyZ', key: 'z', keyCode: 90 }
  };
  
  const keyInfo = keyMap[key];
  if (!keyInfo) return;
  
  const eventType = isDown ? 'keydown' : 'keyup';
  const event = new KeyboardEvent(eventType, {
    code: keyInfo.code,
    key: keyInfo.key,
    keyCode: keyInfo.keyCode,
    which: keyInfo.keyCode,
    bubbles: true,
    cancelable: true,
    composed: true
  });
  
  // Enviar al SWF y al documento
  swf.dispatchEvent(event);
  document.dispatchEvent(event);
  
  console.log(`⌨️ ${isDown ? '↓' : '↑'} Tecla: ${keyInfo.key}`);
}

let activeTouches = {};

overlay.addEventListener('touchstart', (e) => {
  e.preventDefault();
  
  for (let touch of e.touches) {
    const rect = container.getBoundingClientRect();
    const x = touch.clientX - rect.left;
    const y = touch.clientY - rect.top;

    simulateClick(touch.clientX, touch.clientY);

    const relX = x / rect.width;
    const relY = y / rect.height;

    if (relY < 0.3) {
      simulateKey('up', true);
      activeTouches[touch.identifier] = 'up';
    } else if (relY > 0.7) {
      simulateKey('down', true);
      activeTouches[touch.identifier] = 'down';
    } else if (relX < 0.3) {
      simulateKey('left', true);
      activeTouches[touch.identifier] = 'left';
    } else if (relX > 0.7) {
      simulateKey('right', true);
      activeTouches[touch.identifier] = 'right';
    } else {

      simulateKey('space', true);
      activeTouches[touch.identifier] = 'space';
    }
  }
}, { passive: false });

overlay.addEventListener('touchmove', (e) => {
  e.preventDefault();

  for (let touch of e.touches) {
    const rect = container.getBoundingClientRect();
    const x = touch.clientX - rect.left;
    const y = touch.clientY - rect.top;

    const mouseMove = new MouseEvent('mousemove', {
      clientX: touch.clientX,
      clientY: touch.clientY,
      bubbles: true
    });
    swf.dispatchEvent(mouseMove);
  }
}, { passive: false });

overlay.addEventListener('touchend', (e) => {
  e.preventDefault();

  for (let touch of e.changedTouches) {
    const key = activeTouches[touch.identifier];
    if (key) {
      simulateKey(key, false);
      delete activeTouches[touch.identifier];
    }
  }
}, { passive: false });

overlay.addEventListener('click', (e) => {
  simulateClick(e.clientX, e.clientY);
});

overlay.addEventListener('mousedown', (e) => {

  const rect = container.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const y = (e.clientY - rect.top) / rect.height;
  
  if (y < 0.3) simulateKey('up', true);
  else if (y > 0.7) simulateKey('down', true);
  else if (x < 0.3) simulateKey('left', true);
  else if (x > 0.7) simulateKey('right', true);
});

overlay.addEventListener('mouseup', (e) => {
  const rect = container.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const y = (e.clientY - rect.top) / rect.height;
  
  if (y < 0.3) simulateKey('up', false);
  else if (y > 0.7) simulateKey('down', false);
  else if (x < 0.3) simulateKey('left', false);
  else if (x > 0.7) simulateKey('right', false);
});

console.log('🎮 Control táctil para SWF activado');
console.log('👆 Toca arriba/abajo/izquierda/derecha para mover');
console.log('👆 Toca el centro para acción (espacio/clic)');
</script>

</body>
</html>
