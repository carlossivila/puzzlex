<!doctype html>
<html style="margin: 0; padding: 0; border: 0; width: 100%; height: 100%;">
<meta http-equiv="content-type" content="text/html;charset=utf-8" />
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PuzzleX - colors-v2</title>
<style>
  * {
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  html, body {
    margin: 0; padding: 0; border: 0;
    width: 100%; height: 100%;
    background-color: #111;
    overscroll-behavior: none;
    overflow: hidden;
    touch-action: none;
  }
  a:link, a:visited { text-decoration: none; color: lime; }
  a:hover { text-decoration: none; color: red; }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
  var a = canvas
  var b = document.body
  a.width = window.innerWidth
  a.height = window.innerHeight
  window.onresize = function () {
    window.location.reload()
  }
  var c = a.getContext('2d')
</script>

<script>
document.addEventListener('touchstart', function(e) { e.preventDefault(); }, { passive: false });
document.addEventListener('touchmove',  function(e) { e.preventDefault(); }, { passive: false });
document.addEventListener('touchend',   function(e) { e.preventDefault(); }, { passive: false });
</script>

<script>
with(Math) {

for(i in c)c[i[x = m = n = k = 0]+(i[6]||'')]=c[i]

var META = 199
var ganaste = false

for (W = a.width,
     H = a.height,
     f = ['#ffffff', '#ff0571', '#c2ff05', '#00ff00', '#00ccff'],
     d = min(W, H) / 7,
     L = W / 2 - d * 3 + d / 2,
     R = H / 2 - d * 3,
     g = [],
     h = [],
     onmousedown = function () {
       k = 1
     }; x < 6; x++) {
  for (y = 0; y < 6; y++) {
    g.push({
      o: f[random()*5|0],
      Y: R + y * d,
      x: L + x * d,
      y: R + y * d,
      r: y,
      c: x
    })
  }
}

onmouseup = ontouchend = function () {

  if (!h[1]) {
    h = []
  }

  for (i in h) {
    p = h[i]
    if (p.r >= 0) {
      m++
      p.r -= n + 1
      p.y = R + p.r * d
      p.o = f[random()*5|0]
    }
  }

  if (!ganaste && m >= META) {
    ganaste = true
    setTimeout(function() { alert('¡Ganaste! 🎉') }, 100)
  }

  n = k = 0
  h = []
}

onmousemove = ontouchmove = function (e) {

  if (e.pageX) {
    X = e.pageX
    Y = e.pageY
  } else {
    X = e.touches[0].pageX
    k = Y = e.touches[0].pageY
  }

  if (k) {
    for (i in g) {
      p = g[i]

      if (h[0] &&
        (h[0].o != p.o |
          abs(
            abs(h[0].r - p.r) - abs(h[0].c - p.c)
          ) != 1))
        continue

      if (
        abs(X - p.x) < d / 2 &&
        abs(Y - p.y) < d / 2
      ) {
        if (!~h.indexOf(p)) {
          h.unshift(p)
          n = max(p.r, n)
        } else if (h[1] == p) {
          h.shift()
        }
      }
    }
  }
}


setInterval(function() {

  c.ce(0, 0, W, H)
  c.lineWidth = d / 6
  c.lineJoin = 'round'

  for (i in g) {
    p = g[i]

    r = 0
    for (j in g) {
      q = g[j]
      if (p.r + 1 == q.r && p.c == q.c) {
        r = 1
      }
    }
    if (!r && p.r != 5) {
      p.r++
      p.Y = R + p.r * d
    }

    if (p.y != p.Y) {
      D = p.y > p.Y ? -1 : 1
      p.y += p.T * D
      p.T *= p.s && !p.t ? 0.5 : 1.5

      if (~D && p.y >= p.Y) {
        p.y = p.Y
      } else if (!~D && p.y <= p.Y) {
        p.y = p.Y
      }

      if (!p.s && !p.t && p.y == p.Y) {
        p.s = 1
        p.Y -= d / 3
        p.T = d / 5
      } else if (p.s && !p.t && p.y == p.Y) {
        p.t = 1
        p.T = d / 15
        p.Y += d / 3
      }

    } else {
      p.T = d / 15
      p.t = p.s = 0
    }

    c.strokeStyle = p.o
    if (~h.indexOf(p)) {
      c.sR(p.x - d / 3, p.y - d / 3, d / 1.5, d / 1.5)
    }
    c.sR(p.x - d / 4, p.y - d / 4, d / 2, d / 2)
  }

  // marcador — CORREGIDO: centrado y pegado al borde inferior
  var puntajeActual = Math.min(m, META)
  c.fillStyle = 'lime'
  c.font = 'bold ' + (d / 2.2) + 'px monospace'
  c.textBaseline = 'top'
  c.textAlign = 'center'
  c.fillText('Puntaje ' + puntajeActual + ' de ' + META, W / 2, H - d * 0.8)

  if (h[0]) {
    c.strokeStyle = h[0].o
    c.ba()
    c.m(X, Y)
    for (i in h) {
      p = h[i]
      c.l(p.x, p.y)
    }
    c.s()
  }
}, 33)
}
</script>

<script>
document.addEventListener('contextmenu', function(e) {
  e.preventDefault();
});
</script>

</body>
</html>
