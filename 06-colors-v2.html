<!doctype html>
<html style="margin: 0; padding: 0; border: 0; width: 100%; height: 100%;">
<meta http-equiv="content-type" content="text/html;charset=utf-8" />
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PuzzleX - colors-v2</title>
<style>
  * {
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  html, body {
    margin: 0; padding: 0; border: 0;
    width: 100%; height: 100%;
    background-color: #111;
    overscroll-behavior: none;
    overflow: hidden;
    touch-action: none;
  }

  a:link, a:visited { text-decoration: none; color: lime; }
  a:hover { text-decoration: none; color: red; }

  #wrap {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
  }

  canvas {
    display: block;
    width: 100%;
    flex: 1 1 auto;
    touch-action: none;
  }

  .bar {
    flex: 0 0 60px;
    height: 60px;
    background-color: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  #score {
    color: lime;
    font-family: monospace;
    font-weight: bold;
    font-size: 22px;
  }

  .btn {
    display: inline-block;
    font-size: 16px;
    background-color: #009900;
    border: 1px solid gray;
    border-radius: 5px;
    padding: 8px 12px;
    color: white;
    cursor: pointer;
    transition: box-shadow 0.3s ease;
  }
  .btn:hover {
    border: 1px solid cyan;
    box-shadow: 0 0 15px cyan, 0 0 30px aqua;
  }
</style>
</head>

<body>

<div id="wrap">
  <canvas id="canvas"></canvas>

  <div class="bar">
    <span id="score">Puntaje 0 de 199</span>
    <audio id="audio" src="sound.mp3" preload="auto" loop></audio>
    <button class="btn" id="snd">🔊</button>
  </div>
</div>

<script>
  var BAR_HEIGHT = 60
  var a = canvas
  var b = document.body
  a.width = window.innerWidth
  a.height = window.innerHeight - BAR_HEIGHT
  var c = a.getContext('2d')

  // Solo recargamos si es un cambio de tamaño REAL (ej: rotar el celular),
  // no cuando el navegador móvil oculta/muestra su barra de direcciones
  // (eso dispara "resize" con cambios chicos de altura y causaba el
  // reinicio/parpadeo de colores antes de empezar a jugar).
  var initialWidth = window.innerWidth
  var initialHeight = window.innerHeight
  var resizeTimeout
  window.onresize = function () {
    clearTimeout(resizeTimeout)
    resizeTimeout = setTimeout(function () {
      var widthChanged = Math.abs(window.innerWidth - initialWidth) > 50
      var heightChanged = Math.abs(window.innerHeight - initialHeight) > 150
      if (widthChanged || heightChanged) {
        window.location.reload()
      }
    }, 300)
  }
</script>

<script>
// IMPORTANTE: estos preventDefault() van SOLO en el <canvas>, no en document.
// Si van en document, el touchend bloquea la generación del "click" sintético
// en TODO la página, incluyendo el botón de audio, y por eso quedaba muerto en celular.
canvas.addEventListener('touchstart', function(e) { e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchmove',  function(e) { e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchend',   function(e) { e.preventDefault(); }, { passive: false });
</script>

<script>
with(Math) {

for(i in c)c[i[x = m = n = k = 0]+(i[6]||'')]=c[i]

var META = 199
var ganaste = false

for (W = a.width,
     H = a.height,
     f = ['#ffffff', '#ff0571', '#c2ff05', '#00ff00', '#00ccff'],
     d = min(W, H) / 7,
     L = W / 2 - d * 3 + d / 2,
     R = H / 2 - d * 3,
     g = [],
     h = [],
     onmousedown = function () {
       k = 1
     }; x < 6; x++) {
  for (y = 0; y < 6; y++) {
    g.push({
      o: f[random()*5|0],
      Y: R + y * d,
      x: L + x * d,
      y: R + y * d,
      r: y,
      c: x
    })
  }
}

onmouseup = ontouchend = function () {

  if (!h[1]) {
    h = []
  }

  for (i in h) {
    p = h[i]
    if (p.r >= 0) {
      m++
      p.r -= n + 1
      p.y = R + p.r * d
      p.o = f[random()*5|0]
    }
  }

  if (!ganaste && m >= META) {
    ganaste = true
    setTimeout(function() { alert('¡Ganaste! 🎉') }, 100)
  }

  n = k = 0
  h = []
}

onmousemove = ontouchmove = function (e) {

  if (e.pageX) {
    X = e.pageX
    Y = e.pageY
  } else {
    X = e.touches[0].pageX
    k = Y = e.touches[0].pageY
  }

  if (k) {
    for (i in g) {
      p = g[i]

      if (h[0] &&
        (h[0].o != p.o |
          abs(
            abs(h[0].r - p.r) - abs(h[0].c - p.c)
          ) != 1))
        continue

      if (
        abs(X - p.x) < d / 2 &&
        abs(Y - p.y) < d / 2
      ) {
        if (!~h.indexOf(p)) {
          h.unshift(p)
          n = max(p.r, n)
        } else if (h[1] == p) {
          h.shift()
        }
      }
    }
  }
}


setInterval(function() {

  c.ce(0, 0, W, H)
  c.lineWidth = d / 6
  c.lineJoin = 'round'

  for (i in g) {
    p = g[i]

    r = 0
    for (j in g) {
      q = g[j]
      if (p.r + 1 == q.r && p.c == q.c) {
        r = 1
      }
    }
    if (!r && p.r != 5) {
      p.r++
      p.Y = R + p.r * d
    }

    if (p.y != p.Y) {
      D = p.y > p.Y ? -1 : 1
      p.y += p.T * D
      p.T *= p.s && !p.t ? 0.5 : 1.5

      if (~D && p.y >= p.Y) {
        p.y = p.Y
      } else if (!~D && p.y <= p.Y) {
        p.y = p.Y
      }

      if (!p.s && !p.t && p.y == p.Y) {
        p.s = 1
        p.Y -= d / 3
        p.T = d / 5
      } else if (p.s && !p.t && p.y == p.Y) {
        p.t = 1
        p.T = d / 15
        p.Y += d / 3
      }

    } else {
      p.T = d / 15
      p.t = p.s = 0
    }

    c.strokeStyle = p.o
    if (~h.indexOf(p)) {
      c.sR(p.x - d / 3, p.y - d / 3, d / 1.5, d / 1.5)
    }
    c.sR(p.x - d / 4, p.y - d / 4, d / 2, d / 2)
  }

  // marcador — ahora se actualiza en el <span> HTML, no se dibuja en canvas
  var puntajeActual = min(m, META)
  document.getElementById('score').textContent = 'Puntaje ' + puntajeActual + ' de ' + META

  if (h[0]) {
    c.strokeStyle = h[0].o
    c.ba()
    c.m(X, Y)
    for (i in h) {
      p = h[i]
      c.l(p.x, p.y)
    }
    c.s()
  }
}, 33)
}
</script>

<script>
document.addEventListener('contextmenu', function(e) {
  e.preventDefault();
});
</script>

<script>
  var audio = document.getElementById("audio");
  var sound = document.getElementById("snd");
  sound.addEventListener("click", function() {
    if (audio.paused) {
      audio.play();
      sound.textContent = "🔊";
    } else {
      audio.pause();
      sound.textContent = "🔇";
    }
  });
</script>

</body>
</html>
