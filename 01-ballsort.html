<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
    <title>PuzzleX - BallSort</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            background: #111;
            font-family: Arial, sans-serif;
            color: lime;
        }

        #app {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        button {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 3px auto;
            padding: 3px 3px;
            font-size: 18px;
            background-color: #003300;
            color: lime;
            border: 1px solid gray;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #009900;
            color: cyan;
            border: 1px solid cyan;
            text-shadow: 0 0 5px blue, 0 0 10px cyan;
            box-shadow: 0 0 15px cyan, 0 0 30px aqua;
        }

        input[type="number"] {
            width: 60px;
            padding: 8px;
            font-size: 16px;
            margin: 5px;
            border: 2px solid #008080;
            border-radius: 5px;
        }

        .boxes {
            display: flex;
            flex-wrap: wrap;
            margin: 1rem auto;
            position: relative;
            width: fit-content;
            justify-content: center;
        }


        .box {
            display: flex;
            border: 0.3rem solid rgba(0, 128, 128, 0.5);
            border-top-width: 0;
            border-top-color: transparent;
            height: 10rem;
            width: 2rem;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            border-bottom-left-radius: 2rem;
            border-bottom-right-radius: 2rem;
            margin: 0.2rem;
            position: relative;
            box-shadow: inset -0.2rem -0.2rem 10px rgba(0, 128, 128, 0.5);
            background-color: rgba(0, 128, 128, 0.1);
            box-sizing: content-box;
            cursor: pointer;
        }

        .box.complited:after {
            content: "";
            position: absolute;
            top: -0.8rem;
            width: 3.8rem;
            height: 1rem;
            background: #654321;
            border-radius: 0.5rem;
            box-shadow: inset -0.2rem -0.2rem 5px rgba(0, 0, 0, 0.5);
            z-index: 2;
        }

        .box:before {
            content: "";
            position: absolute;
            width: 4.6rem;
            background-color: rgba(0, 128, 128, 0.3);
            height: 1.2rem;
            top: 0;
            border-radius: 0.5rem;
            box-shadow: inset -0.2rem -0.2rem 10px rgba(0, 128, 128, 0.2);
            backdrop-filter: blur(5px);
        }

        .box.selected {
            border-color: #ff4081;
            box-shadow: 0 0 15px rgba(255, 64, 129, 0.5);
        }

        .item {
            display: flex;
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            margin-bottom: 0;
            z-index: 1;
            box-shadow: inset -0.2rem -0.2rem 12px rgba(0, 0, 0, 0.5);
        }

        .type-1 { background-color: crimson; }
        .type-2 { background-color: yellowgreen; }
        .type-3 { background-color: gold; }
        .type-4 { background-color: deepskyblue; }
        .type-5 { background-color: royalblue; }
        .type-6 { background-color: hotpink; }
        .type-7 { background-color: cyan; }
        .type-8 { background-color: darkviolet; }
        .type-9 { background-color: forestgreen; }
        .type-10 { background-color: orangered; }

        a:link,a:visited {
            text-decoration: none;
            color: lime;
        }

        a:hover {
            text-decoration: none;
            color: red;
        }

    </style>
</head>
<body>

<h2 style="color: lime; font-wieight: bold;">PuzzleX by Carlos Sivila</a></h2>

<div id="app">
    <div class="boxes">
        <div class="box" 
             v-for="(box, i) in boxes" 
             :key="i"
             :class="{ selected: i == selected, complited: box.complited }"
             @click="play(i)">
            <div v-for="item in box.items"
                 :class="['item', 'type-' + item.type]">
            </div>
        </div>
    </div>
<div style="color: lime; font-size: 20px; font-weight: bold;" class="check" id="check">{{ aciertos }} aciertos de 15</div>
</div>

<script>
new Vue({
    el: '#app',
    data: {
        boxes: [],
        types: 5,
        selected: -1,
        aciertos: 0
    },
    mounted() {
        this.newGame();
    },
    methods: {
        newGame() {
            this.boxes = [];
            let items = [];
            for (let i = 1; i <= 4; i++) {
                for (let j = 1; j <= this.types; j++) {
                    items.push({ type: j });
                }
            }
            items = this.shuffleArray(items);
            
            for (let i = 1; i <= this.types + 2; i++) {
                this.boxes.push({
                    items: items.splice(0, 4),
                    complited: false
                });
            }
        },
        shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        },
        play(target) {
            if (this.selected === -1) {
                if (!this.boxes[target].complited) {
                    this.selected = target;
                }
            } else if (this.selected === target) {
                this.selected = -1;
            } else {
                const selectedBox = this.boxes[this.selected];
                const targetBox = this.boxes[target];
                
                if (!targetBox.complited && selectedBox.items.length > 0) {
                    if (targetBox.items.length === 0 || 
                        (selectedBox.items[0].type === targetBox.items[0].type && 
                         targetBox.items.length < 4)) {
                        targetBox.items.unshift(selectedBox.items.shift());
                        this.checkCompleted(target);
                        this.selected = -1;
                    } else {
                        this.selected = target;
                    }
                } else {
                    this.selected = target;
                }
            }
        },
        checkCompleted(index) {
            const box = this.boxes[index];
            if (box.items.length === 4) {
                const firstType = box.items[0].type;
                box.complited = box.items.every(item => item.type === firstType);
            }
        },
        addBox() {
            this.boxes.push({ items: [], complited: false });
        }
    },
    computed: {
        complited() {
            return this.boxes.filter(box => box.complited).length;
        }
    },
    watch: {
        types() {
            this.newGame();
        },
        complited(val) {
            if (val === this.types) {
                this.aciertos++;
                if (this.aciertos >= 15) {
                    setTimeout(() => {
                        playgood();
                        setTimeout(() => {
                            playwin();
                            setTimeout(() => alert('Ganaste'), 1000);
                        }, 1000);
                    }, 1000);
                } else {
                    setTimeout(() => {
                        playgood();
                        setTimeout(() => this.newGame(), 2000);
                    }, 1000);
                }
            }
        }
    }
});
</script>

<script>
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playgood() {
    initAudio();
    const now = audioCtx.currentTime;
    const notas = [523.25, 659.25, 783.99];
    notas.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(freq, now + i * 0.12);
        gainNode.gain.setValueAtTime(0.18, now + i * 0.12);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.15);
        osc.start(now + i * 0.12);
        osc.stop(now + i * 0.12 + 0.15);
    });
}

function playwin() {
    initAudio();
    const now = audioCtx.currentTime;
    const notasIniciales = [523.25, 587.33, 659.25, 783.99];
    notasIniciales.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(freq, now + i * 0.15);
        gainNode.gain.setValueAtTime(0.2, now + i * 0.15);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.15);
        osc.start(now + i * 0.15);
        osc.stop(now + i * 0.15 + 0.15);
    });
    const notasFinales = [880, 1046.5];
    notasFinales.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        const startTime = now + 0.75 + i * 0.15;
        osc.frequency.setValueAtTime(freq, startTime);
        gainNode.gain.setValueAtTime(0.25, startTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + 0.2);
        osc.start(startTime);
        osc.stop(startTime + 0.2);
    });
}
</script>

<div>
<p>UNA ESFERA SOLO PUEDE IR<br>
ENCIMA DE OTRA DEL MISMO COLOR</p>
<audio id="audio" src="snd.mp3" preload="auto" loop></audio>
<button id="snd" style="margin: 3px 0;">🔊</button>
</div>

<script>
    const audio = document.getElementById("audio");
    const snd = document.getElementById("snd");
    snd.addEventListener("click", function() {
        if (audio.paused) {
            audio.play();
            snd.textContent = "🔊";
        } else {
            audio.pause();
            snd.textContent = "🔇";
        }
    });
</script>

<script>
document.addEventListener('contextmenu', function(e) {
e.preventDefault();
});
</script>

</body>
</html>
