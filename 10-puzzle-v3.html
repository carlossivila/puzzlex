<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PuzzleX</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        user-select: none;
        font-size: 0;
      }

      html, body {
        height: 100%;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: hsl(0, 0%, 20%);
      }

      #wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1vmin;
      }

      #board {
        border: 1.2vmin solid hsl(0, 0%, 25%);
        background-color: hsl(0, 0%, 90%);
        box-shadow: 0 0 2vmin hsla(0, 0%, 0%, 0.5) inset;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .row {
        display: flex;
        flex-direction: row;
      }

      @keyframes fadingIn {
        from {
          transform: scale(0.9);
          opacity: 0;
          pointer-events: none;
        }
        to {
          transform: scale(1);
          opacity: 1;
          pointer-events: auto;
        }
      }

      .card {
        margin: 0.5px;
        border: 0;
        background-color: transparent;
        position: relative;
        perspective: 75vmin;
        opacity: 1;
        transition: transform 5s;
        animation-duration: 0.8s;
        animation-name: fadingIn;
        animation-timing-function: ease-out;
        outline: 0;
      }

      .card:disabled {
        z-index: 1;
      }

      .imageFragment {
        width: 100%;
        height: 100%;
        background-color: gray;
        transition: transform 0.25s;
      }

      .card[data-rotation="0"] .imageFragment { transform: rotate(0deg); }
      .card[data-rotation="1"] .imageFragment { transform: rotate(90deg); }
      .card[data-rotation="2"] .imageFragment { transform: rotate(180deg); }
      .card[data-rotation="3"] .imageFragment { transform: rotate(270deg); }
      .card[data-rotation="4"] .imageFragment { transform: rotate(360deg); }

      #counter {
        font-size: 3.8vmin !important;
        color: hsl(180, 100%, 70%);
        letter-spacing: 0.08em;
        font-family: monospace;
        text-shadow:
          0 0 0.6vmin hsl(180, 100%, 70%),
          0 0 1.5vmin hsl(180, 100%, 60%);
      }

      #sizeToggle {
        font-size: 3.8vmin;
        padding: 1.2vmin 3.2vmin;
        border: 0.25vmin solid hsl(180, 100%, 60%);
        border-radius: 999px;
        background-color: transparent;
        color: hsl(180, 100%, 70%);
        cursor: pointer;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-shadow:
          0 0 0.6vmin hsl(180, 100%, 70%),
          0 0 1.5vmin hsl(180, 100%, 60%),
          0 0 3vmin hsl(180, 100%, 50%);
        box-shadow:
          0 0 0.6vmin hsl(180, 100%, 60%),
          0 0 1.5vmin hsl(180, 100%, 50%),
          inset 0 0 1vmin hsla(180, 100%, 60%, 0.15);
        transition: text-shadow 0.2s, box-shadow 0.2s, transform 0.1s;
        flex-shrink: 0;
      }

      #sizeToggle:hover {
        text-shadow:
          0 0 0.8vmin hsl(180, 100%, 80%),
          0 0 2vmin hsl(180, 100%, 70%),
          0 0 4vmin hsl(180, 100%, 55%);
        box-shadow:
          0 0 1vmin hsl(180, 100%, 70%),
          0 0 2.5vmin hsl(180, 100%, 55%),
          0 0 5vmin hsl(180, 100%, 45%),
          inset 0 0 1.5vmin hsla(180, 100%, 60%, 0.25);
      }

      #sizeToggle:active {
        transform: scale(0.96);
      }

      #titulo {
        font-size: 4vmin;
        font-weight: bold;
        color: hsl(180, 100%, 70%);
        font-family: monospace;
        letter-spacing: 0.08em;
        text-shadow:
          0 0 0.6vmin hsl(180, 100%, 70%),
          0 0 1.5vmin hsl(180, 100%, 60%);
      }
    </style>
  </head>

  <body draggable="false">
    <div id="wrapper">
      <h2 id="titulo">PuzzleX by Carlos Sivila</h2>
      <div id="board"></div>
      <div id="counter">Aciertos: 0 de 24</div>
      <button id="sizeToggle">3x3 / 4x4</button>
    </div>

    <script>
      const puzzles = [
        'https://geoffrichards.co.uk/tetravex-thumbnail.png',
        'https://thumbs.dreamstime.com/z/bot%C3%B3n-determinado-del-n%C3%BAmero-n%C3%BAmeros-103101130.jpg?ct=jpeg',
        'https://i.discogs.com/YOGZe043GsAPj4N7NOJLh1DKrBHxo6wrGWXYEREdbrM/rs:fit/g:sm/q:40/h:300/w:300/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTI5MTEy/OTMtMTU5NDI0NTgx/Mi03OTMxLmpwZWc.jpeg',
        'https://www.shutterstock.com/image-photo/nuremberg-germany-august-9-2024-260nw-2516622489.jpg',
        'https://upload.wikimedia.org/wikipedia/commons/thumb/2/28/Albert_Einstein_Head_cleaned.jpg/500px-Albert_Einstein_Head_cleaned.jpg',
        'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQbELh4JZozSYNgqD2ShfgtS3TK_qDLxfAI5w&s',
        'https://www.clarin.com/img/2019/10/30/NXk__gtU_1200x0__1.jpg',
        'https://i.pinimg.com/originals/77/d4/78/77d47823126562484a88fc51e1adb760.jpg',
        'https://i.pinimg.com/474x/11/83/b3/1183b381d5d75af0cefa50253b874a31.jpg',
        'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2c/Maradona-Mundial_86_con_la_copa.JPG/960px-Maradona-Mundial_86_con_la_copa.JPG',
        'https://static.dw.com/image/61527609_804.jpg',
        'https://static.dw.com/image/19306161_604.jpg',
        'https://www.clarin.com/2021/01/08/pDBQXz6Ht_360x240__1.jpg',
        'https://cdn.nba.com/headshots/nba/latest/1040x760/893.png',
        'https://theartofjoshnelson.com/cdn/shop/products/il_794xN.3092575748_c5dm.jpg?v=1624471280',
        'https://static.wikia.nocookie.net/simpsons-2013/images/2/26/Bart_Simpson.PNG/revision/latest?cb=20130602191223&path-prefix=es',
        'https://cdn.forbes.co/2020/07/Bugs-Bunny-1280x720-1.jpg',
        'https://e7.pngegg.com/pngimages/303/900/png-clipart-mickey-mouse-in-wizard-suit-illustration-mickey-mouse-minnie-mouse-epic-mickey-sorcerer-s-hat-psychedelic-game-heroes.png',
        'https://autopiccolo.es/wp-content/uploads/2024/09/IMG-20200605-WA0008.jpg',
        'https://static.wikia.nocookie.net/cartoon-characters8569/images/d/d6/Betty-boop.jpg/revision/latest?cb=20170103113524',
        'https://static.wikia.nocookie.net/tkoc/images/a/ab/Felix_the_Cat.jpg/revision/latest/scale-to-width-down/250?cb=20170108143822&path-prefix=pt-br',
        'https://vignette.wikia.nocookie.net/chroniclesofillusion/images/7/7c/MightyMouse.png/revision/latest?cb=20170125162746',
        'https://media-front.elmostrador.cl/2014/08/superheroes.jpg',
        'https://static.wikia.nocookie.net/superman/images/c/ce/Action_Comics_1.png/revision/latest?cb=20150623162141&path-prefix=es'
      ];

      // Estado global
      let currentSize = 3;
      let aciertos = 0;
      let queue = []; // cola aleatoria sin repetir

      const TOTAL = puzzles.length; // 24

      function buildQueue() {
        // Fisher-Yates shuffle
        const arr = [...Array(TOTAL).keys()];
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function updateCounter() {
        document.getElementById('counter').textContent = `Aciertos: ${aciertos} de ${TOTAL}`;
      }

      const handleCardClick = (event) => {
        event.preventDefault();

        const cardClicked = event.composedPath().find(
          (el) => el.classList && [...el.classList].includes('card')
        );
        if (!cardClicked || cardClicked.disabled) return;

        cardClicked.disabled = true;

        const currentRotation = cardClicked.dataset.rotation;
        const newRotation = `${Number(currentRotation) + 1}`;
        cardClicked.dataset.rotation = newRotation;

        if (newRotation === '4') {
          const imageFragment = cardClicked.querySelector('.imageFragment');
          cardClicked.addEventListener('transitionend', () => {
            imageFragment.style.transitionDuration = '0s';
            requestAnimationFrame(() => {
              cardClicked.dataset.rotation = '0';
              requestAnimationFrame(() => {
                imageFragment.style.transitionDuration = '';
              });
            });
          }, { once: true });
        }

        const allCards = [...document.querySelectorAll('.card')];
        const isPuzzleComplete = allCards.every(
          (card) => ['0', '4'].includes(card.dataset.rotation)
        );

        if (isPuzzleComplete) {
          allCards.forEach((card) => (card.disabled = true));
          aciertos += 1;
          updateCounter();

          setTimeout(() => {
            if (aciertos >= TOTAL) {
              alert('¡Ganaste!');
              // Reset completo
              aciertos = 0;
              queue = buildQueue();
              updateCounter();
            }
            setupBoard(puzzles[queue.shift()], currentSize);
          }, 3000);

        } else {
          if (newRotation === '4') {
            setTimeout(() => { cardClicked.disabled = false; }, 300);
          } else {
            cardClicked.addEventListener('transitionend', () => {
              cardClicked.disabled = false;
            }, { once: true });
          }
        }
      };

      const setupBoard = (puzzle, size = 3) => {
        const getRandomRotation = () => Math.floor(Math.random() * 4);

        const renderCard = (x, y) => `
          <button
            class="card"
            data-rotation="${getRandomRotation()}"
            style="width:${68 / size}vmin; height:${68 / size}vmin;"
          >
            <div
              class="imageFragment"
              style="
                background-image: url('${puzzle}');
                background-position: ${y * (100 / (size - 1))}% ${x * (100 / (size - 1))}%;
                background-size: ${size * 100}% ${size * 100}%;
              "
            ></div>
          </button>`;

        const renderRow = (children) => `<div class="row">${children}</div>`;
        const indices = Array.from(Array(size).keys());

        const boardHTML = indices.map((row) =>
          renderRow(indices.map((col) => renderCard(row, col)).join(''))
        ).join('');

        document.getElementById('board').innerHTML = boardHTML;
        document.querySelectorAll('.card').forEach((card) => {
          card.addEventListener('click', handleCardClick);
          card.addEventListener('contextmenu', handleCardClick);
          card.addEventListener('auxclick', handleCardClick);
        });
      };

      // Inicializar
      queue = buildQueue();
      updateCounter();
      setupBoard(puzzles[queue.shift()], currentSize);

      document.getElementById('sizeToggle').addEventListener('click', () => {
        currentSize = currentSize === 3 ? 4 : 3;
        const btn = document.getElementById('sizeToggle');
        btn.textContent = currentSize === 3 ? '3x3 / 4x4' : '4x4 / 3x3';
        // Mantiene la imagen actual, solo cambia tamaño
        // Para eso recuperamos la url del board actual
        const currentImg = document.querySelector('.imageFragment');
        if (currentImg) {
          const style = currentImg.getAttribute('style');
          const urlMatch = style.match(/url\('([^']+)'\)/);
          if (urlMatch) {
            setupBoard(urlMatch[1], currentSize);
            return;
          }
        }
        setupBoard(puzzles[queue[0] ?? 0], currentSize);
      });
    </script>
  </body>
</html>
