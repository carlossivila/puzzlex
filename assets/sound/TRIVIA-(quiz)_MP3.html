<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ruleta - Paso 1</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    min-height: 100%;   /* antes: height: 100% */
    margin: 0;
  }

  body {
    background: radial-gradient(circle at 20% 30%, #0a0a0f, #030305);
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'DM Sans', sans-serif;
  }

  #app {
    width: 100%;
    min-height: 100vh;  /* antes: height: 100% */
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0.5rem;
    gap: 0.6rem;
  }

  #header {
    width: 100%;
    text-align: center;
    padding: 4px 0 2px;
    flex-shrink: 0;
  }

  #header h1 {
    color: lime;
    font-size: 17px;
    font-weight: 700;
  }

  #header hr {
    border: none;
    height: 1px;
    background: linear-gradient(90deg, transparent, lime, transparent);
    margin-top: 4px;
  }

  #ruleta-area {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
  }

  #result {
    color: lime;
    font-size: 1.5rem;
    min-height: 2rem;
    text-align: center;
  }

  #circle-placeholder {
    width: min(320px, 82vw);
    height: min(320px, 82vw);
    border-radius: 50%;
    background: conic-gradient(#F4D03F, #E67E22, #A1887F, #3498DB, #52BE80, #E84393, #E74C3C, #8E44AD, #F4D03F);
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
  <div id="app">
    <div id="header">
      <h1>PuzzleX by Carlos Sivila</h1>
      <hr>
    </div>
    <div id="ruleta-area">
      <div id="result"></div>
      <div id="circle-placeholder"></div>
    </div>
  </div>

  <script>
    console.log('Cargada:', new Date().toLocaleTimeString());
  </script>
</body>
</html>
