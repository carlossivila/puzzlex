            border: 2px solid transparent;
            border-radius: 2px;

        }

        button:hover {
            color: black;
            border: 2px solid lime;
            background-color: lightblue;
            box-shadow: 0px 0px 10px cyan;
        }

            font-size: 20px;
            font-weight: bold;
            color: green;
        }

        h4 {
            margin: 0;
            padding: 0;
            color: yellow;
        }

        h2 {
           color: lime;
           text-align: left;
           font-family: 'arial black'; font-style: italic;
           } 

        .correcto {

        }

        .incorrecto {

        }

        audio {
            width: 100px;
            height: 18px;
        }

        a:link, a:visited {

            color: lime;
        }

        a:hover {

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function getAnswer(file) {
        return file.replace('.mp3', '');
    }

    function getOptions(correctIndex) {
        const correctAnswer = getAnswer(audios[correctIndex]);
        const otherAnswers = audios
            .filter((file, i) => i !== correctIndex)
            .map(file => getAnswer(file));
        shuffle(otherAnswers);
        const options = [correctAnswer, otherAnswers[0], otherAnswers[1]];
        shuffle(options);
        return options;
    }

    function loadQuestions() {
        shuffle(audios);
        const quizContainer = document.getElementById("quiz-container");

        audios.forEach((file, index) => {
            const options = getOptions(index);
            const questionDiv = document.createElement("div");
            questionDiv.classList.add("question");
        questionDiv.innerHTML = `
        <h4><span class="numero">${String(index + 1).padStart(3, '0')}</span>&nbsp;&nbsp;<audio src="sound/sound1/${file}" controls></audio></h4>
       <div class="options">
        ${options.map(option => `<label><input type="radio" name="q${index + 1}" value="${option}"> ${option}</label>`).join('')}
       </div>
       `;
            quizContainer.appendChild(questionDiv);
        });
    }

    function calculateScore() {
        let score = 0;

        audios.forEach((file, index) => {
            const correctAnswer = getAnswer(file);
            const selectedOption = document.querySelector(`input[name="q${index + 1}"]:checked`);
            if (selectedOption) {
                if (selectedOption.value === correctAnswer) {
                    score++;
                    selectedOption.parentNode.classList.add('correcto');
                } else {
                    selectedOption.parentNode.classList.add('incorrecto');
                }
            }

            const correctOption = [...document.querySelectorAll(`input[name="q${index + 1}"]`)]
                .find(option => option.value === correctAnswer);
            if (correctOption) {
                correctOption.parentNode.classList.add('correcto');
            }
        });

        const percentage = (score / audios.length) * 100;
        const answerDiv = document.querySelector('.answer');
        answerDiv.innerHTML = `&nbsp;Acertaste ${score} de ${audios.length} - ${percentage.toFixed(2)}%`;
        answerDiv.style.display = 'block';
    }

    window.onload = loadQuestions;
</script>
