<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PuzzleX - Sopa_de_letras</title>
<style>
body {
background-color: #111;
color: white;
margin: 0;
padding: 0;
width: 100vw;
height: 100vh;
overflow: hidden;
position: fixed;
-webkit-overflow-scrolling: touch;
overscroll-behavior: none;
touch-action: none;
}

#puzzle {
  border: 1px solid black;
  padding: 4px;
  float: left;
  margin: 3px 3px;
box-shadow: inset 2px 2px 8px #330f0f,
inset -2px -2px 8px #ff0000;
}

#puzzle div {
  width: 100%;
  margin: 0 auto;
}

#puzzle .puzzleSquare {
  height: 25px;
  width: 25px;
  text-transform: uppercase;
  background-color: black;
  border: 0;
  font: 15px sans-serif;
  color: lime;
}

button::-moz-focus-inner {
  border: 0;
}

#puzzle .selected {
  background-color: green;
}

#puzzle .found {
  background-color: cyan;
  color: blue;
}

#puzzle .solved {
  background-color: yellow;
  color: blue;
}

#puzzle .complete {
  background-color: darkgreen;
}

#words {
  padding-top: 4px;
  margin-left: 3px;
  -moz-column-count: 3;
  -moz-column-gap: 10px;
  -webkit-column-count: 3;
  -webkit-column-gap: 10px;
  column-count: 3;
  column-gap: 10px;
  width: 333px;
}

#words ul {
  list-style-type: none;
  padding-left: 3px;
  margin-left: 3px;
}

#words li {
  padding: 3px 0;
  font: 14px; sans-serif;
}

#words .wordFound {
  text-decoration: line-through;
  color: red;
}

button {
text-align: center;
margin: 1px;
padding: 1px;
}

.refresh {
background-color: black;
color: lime;
border: 1px solid cyan;
border-radius: 5px;
padding: 5px 10px;
margin-top: 4px;
cursor: pointer;
transition: background-color 0.3s, color 0.3s, border-color 0.3s;
}

.refresh:hover {
background-color: #050505;
color: red;
border: 1px solid gray;
}

.refresh:active {
background-color: #33F033;
color: red;
border: 1px solid black;
}

.container {
display: flex;
justify-content: left;
align-items: center;
}

@media (max-width: 600px) {
  body {
    font-size: 20px;
    transform: scale(1.0);
    transform-origin: top left;
  }
  
  #words li {
    font-size: 14px !important;
  }
}

</style>
</head>

<body>
<h3 style="color: lime;">PuzzleX by Carlos Sivila</h3>
<div class="container">
<div id='puzzle'></div>
</div>
<div id='words'></div>
<button class="refresh" id='refresh'>REFRESH</button>

<script src="https://code.jquery.com/jquery-1.7.1.min.js"></script>
<script>
(function () {

  'use strict';

  var WordFind = function () {

    var language = 'english';
	var letters = 'abcdefghijklmnoprstuvwy';
	    
	function setLanguage() {
		if($('#language-name') && $('#language-name').attr('id')) {
			language = $('#language-name').val();
			
			switch(language) {
				case 'english':
			    		letters = 'abcdefghijklmnoprstuvwy';
			    		break;
			    	
			    	case 'spanish':
			    		letters = 'abcdefghijklmnoprstuvwyáéíóúüñ';
			    		break;
			}
		}
	}
	    
	    setLanguage();

    var allOrientations = ['horizontal','horizontalBack','vertical','verticalUp',
                           'diagonal','diagonalUp','diagonalBack','diagonalUpBack'];

    var orientations = {
      horizontal:     function(x,y,i) { return {x: x+i, y: y  }; },
      horizontalBack: function(x,y,i) { return {x: x-i, y: y  }; },
      vertical:       function(x,y,i) { return {x: x,   y: y+i}; },
      verticalUp:     function(x,y,i) { return {x: x,   y: y-i}; },
      diagonal:       function(x,y,i) { return {x: x+i, y: y+i}; },
      diagonalBack:   function(x,y,i) { return {x: x-i, y: y+i}; },
      diagonalUp:     function(x,y,i) { return {x: x+i, y: y-i}; },
      diagonalUpBack: function(x,y,i) { return {x: x-i, y: y-i}; }
    };

    var checkOrientations = {
      horizontal:     function(x,y,h,w,l) { return w >= x + l; },
      horizontalBack: function(x,y,h,w,l) { return x + 1 >= l; },
      vertical:       function(x,y,h,w,l) { return h >= y + l; },
      verticalUp:     function(x,y,h,w,l) { return y + 1 >= l; },
      diagonal:       function(x,y,h,w,l) { return (w >= x + l) && (h >= y + l); },
      diagonalBack:   function(x,y,h,w,l) { return (x + 1 >= l) && (h >= y + l); },
      diagonalUp:     function(x,y,h,w,l) { return (w >= x + l) && (y + 1 >= l); },
      diagonalUpBack: function(x,y,h,w,l) { return (x + 1 >= l) && (y + 1 >= l); }
    };

    var skipOrientations = {
      horizontal:     function(x,y,l) { return {x: 0,   y: y+1  }; },
      horizontalBack: function(x,y,l) { return {x: l-1, y: y    }; },
      vertical:       function(x,y,l) { return {x: 0,   y: y+100}; },
      verticalUp:     function(x,y,l) { return {x: 0,   y: l-1  }; },
      diagonal:       function(x,y,l) { return {x: 0,   y: y+1  }; },
      diagonalBack:   function(x,y,l) { return {x: l-1, y: x>=l-1?y+1:y    }; },
      diagonalUp:     function(x,y,l) { return {x: 0,   y: y<l-1?l-1:y+1  }; },
      diagonalUpBack: function(x,y,l) { return {x: l-1, y: x>=l-1?y+1:y  }; }
    };

    var fillPuzzle = function (words, options) {

      var puzzle = [], i, j, len;

      for (i = 0; i < options.height; i++) {
        puzzle.push([]);
        for (j = 0; j < options.width; j++) {
          puzzle[i].push('');
        }
      }

      for (i = 0, len = words.length; i < len; i++) {
        if (!placeWordInPuzzle(puzzle, options, words[i])) {
          return null;
        }
      }

      return puzzle;
    };

    var placeWordInPuzzle = function (puzzle, options, word) {

      var locations = findBestLocations(puzzle, options, word);

      if (locations.length === 0) {
        return false;
      }

      var sel = locations[Math.floor(Math.random() * locations.length)];
      placeWord(puzzle, word, sel.x, sel.y, orientations[sel.orientation]);

      return true;
    };

    var findBestLocations = function (puzzle, options, word) {

      var locations = [],
          height = options.height,
          width = options.width,
          wordLength = word.length,
          maxOverlap = 0;

      for (var k = 0, len = options.orientations.length; k < len; k++) {
        
        var orientation = options.orientations[k],
            check = checkOrientations[orientation],
            next = orientations[orientation],
            skipTo = skipOrientations[orientation],
            x = 0, y = 0;

        while( y < height ) {

          if (check(x, y, height, width, wordLength)) {

            var overlap = calcOverlap(word, puzzle, x, y, next);

            if (overlap >= maxOverlap || (!options.preferOverlap && overlap > -1)) {
              maxOverlap = overlap;
              locations.push({x: x, y: y, orientation: orientation, overlap: overlap});
            }

            x++;
            if (x >= width) {
              x = 0;
              y++;
            }
          }
          else {
            var nextPossible = skipTo(x,y,wordLength);
            x = nextPossible.x;
            y = nextPossible.y;
          }

        }
      }

      return options.preferOverlap ?
             pruneLocations(locations, maxOverlap) :
             locations;
    };

    var calcOverlap = function (word, puzzle, x, y, fnGetSquare) {
      var overlap = 0;

      for (var i = 0, len = word.length; i < len; i++) {

        var next = fnGetSquare(x, y, i),
            square = puzzle[next.y][next.x];
        
        if (square === word[i]) {
          overlap++;
        }
        else if (square !== '' ) {
          return -1;
        }
      }

      return overlap;
    };

    var pruneLocations = function (locations, overlap) {

      var pruned = [];
      for(var i = 0, len = locations.length; i < len; i++) {
        if (locations[i].overlap >= overlap) {
          pruned.push(locations[i]);
        }
      }

      return pruned;
    };

    var placeWord = function (puzzle, word, x, y, fnGetSquare) {
      for (var i = 0, len = word.length; i < len; i++) {
        var next = fnGetSquare(x, y, i);
        puzzle[next.y][next.x] = word[i];
      }
    };

    return {

      validOrientations: allOrientations,

      orientations: orientations,

      newPuzzle: function(words, settings) {
        var wordList, puzzle, attempts = 0, opts = settings || {};

        wordList = words.slice(0).sort( function (a,b) {
          return (a.length < b.length) ? 1 : 0;
        });
        
        var options = {
          height:       opts.height || wordList[0].length,
          width:        opts.width || wordList[0].length,
          orientations: opts.orientations || allOrientations,
          fillBlanks:   opts.fillBlanks !== undefined ? opts.fillBlanks : true,
          maxAttempts:  opts.maxAttempts || 3,
          preferOverlap: opts.preferOverlap !== undefined ? opts.preferOverlap : true
        };

        while (!puzzle) {
          while (!puzzle && attempts++ < options.maxAttempts) {
            puzzle = fillPuzzle(wordList, options);
          }

          if (!puzzle) {
            options.height++;
            options.width++;
            attempts = 0;
          }
        }

        if (options.fillBlanks) {
          this.fillBlanks(puzzle, options);
        }

        return puzzle;
      },

      fillBlanks: function (puzzle) {
        for (var i = 0, height = puzzle.length; i < height; i++) {
          var row = puzzle[i];
          for (var j = 0, width = row.length; j < width; j++) {

            if (!puzzle[i][j]) {
              var randomLetter = Math.floor(Math.random() * letters.length);
              puzzle[i][j] = letters[randomLetter];
            }
          }
        }
      },

      solve: function (puzzle, words) {
        var options = {
                        height:       puzzle.length,
                        width:        puzzle[0].length,
                        orientations: allOrientations,
                        preferOverlap: true
                      },
            found = [],
            notFound = [];

        for(var i = 0, len = words.length; i < len; i++) {
          var word = words[i],
              locations = findBestLocations(puzzle, options, word);

          if (locations.length > 0 && locations[0].overlap === word.length) {
            locations[0].word = word;
            found.push(locations[0]);
          }
          else {
            notFound.push(word);
          }
        }

        return { found: found, notFound: notFound };
      },

      print: function (puzzle) {
        var puzzleString = '';
        for (var i = 0, height = puzzle.length; i < height; i++) {
          var row = puzzle[i];
          for (var j = 0, width = row.length; j < width; j++) {
            puzzleString += (row[j] === '' ? ' ' : row[j]) + ' ';
          }
          puzzleString += '\n';
        }

        console.log(puzzleString);
        return puzzleString;
      }
    };
  };

  var root = typeof exports !== "undefined" && exports !== null ? exports : window;
  root.wordfind = WordFind();

}).call(this);
</script>

<script>
(function(document, $, wordfind) {

    'use strict';

    var WordFindGame = function() {

        var wordList;

        var drawPuzzle = function(el, puzzle) {

            var output = '';
            for (var i = 0, height = puzzle.length; i < height; i++) {
                var row = puzzle[i];
                output += '<div>';
                for (var j = 0, width = row.length; j < width; j++) {
                    output += '<button class="puzzleSquare" x="' + j + '" y="' + i + '">';
                    output += row[j] || '&nbsp;';
                    output += '</button>';
                }
                output += '</div>';
            }

            $(el).html(output);
        };

        var drawWords = function(el, wordObj) {

            var output = '<ul>';

            for (var word in wordObj) {
                var definition = wordObj[word];
                output += '<li class="word ' + "wf_" + word + '">' + definition + '</li>';
            }
            output += '</ul>';

            $(el).html(output);
        };

        var startSquare, selectedSquares = [],
            curOrientation, curWord = '';

        var startTurn = function() {
            $(this).addClass('selected');
            startSquare = this;
            selectedSquares.push(this);
            curWord = $(this).text();
        };

        var select = function(target) {
            if (!startSquare) {
                return;
            }

            var lastSquare = selectedSquares[selectedSquares.length - 1];
            if (lastSquare == target) {
                return;
            }

            var backTo;
            for (var i = 0, len = selectedSquares.length; i < len; i++) {
                if (selectedSquares[i] == target) {
                    backTo = i + 1;
                    break;
                }
            }

            while (backTo < selectedSquares.length) {
                $(selectedSquares[selectedSquares.length - 1]).removeClass('selected');
                selectedSquares.splice(backTo, 1);
                curWord = curWord.substr(0, curWord.length - 1);
            }

            var newOrientation = calcOrientation(
                $(startSquare).attr('x') - 0,
                $(startSquare).attr('y') - 0,
                $(target).attr('x') - 0,
                $(target).attr('y') - 0
            );

            if (newOrientation) {
                selectedSquares = [startSquare];
                curWord = $(startSquare).text();
                if (lastSquare !== startSquare) {
                    $(lastSquare).removeClass('selected');
                    lastSquare = startSquare;
                }
                curOrientation = newOrientation;
            }

            var orientation = calcOrientation(
                $(lastSquare).attr('x') - 0,
                $(lastSquare).attr('y') - 0,
                $(target).attr('x') - 0,
                $(target).attr('y') - 0
            );

            if (!orientation) {
                return;
            }

            if (!curOrientation || curOrientation === orientation) {
                curOrientation = orientation;
                playTurn(target);
            }

        };

        var touchMove = function(e) {
            var xPos = e.originalEvent.touches[0].pageX;
            var yPos = e.originalEvent.touches[0].pageY;
            var targetElement = document.elementFromPoint(xPos, yPos);
            select(targetElement);
        };

        var mouseMove = function() {
            select(this);
        };

        var playTurn = function(square) {

            for (var i = 0, len = wordList.length; i < len; i++) {
                if (wordList[i].indexOf(curWord + $(square).text()) === 0) {
                    $(square).addClass('selected');
                    selectedSquares.push(square);
                    curWord += $(square).text();
                    break;
                }
            }
        };

        var endTurn = function() {

            for (var i = 0, len = wordList.length; i < len; i++) {

                if (wordList[i] === curWord) {
                    $('.selected').addClass('found');
                    wordList.splice(i, 1);
                    $('.' + "wf_" + curWord).addClass('wordFound').html(curWord);

                    completeWordHandler(curWord);

                    // Verificar si todas las palabras fueron encontradas (jugando o reveladas)
                    var allFound = true;
                    for (var k = 0; k < words.length; k++) {
                        if (!$('.wf_' + words[k]).hasClass('wordFound')) {
                            allFound = false;
                            break;
                        }
                    }
                    if (allFound) {
                        $('.puzzleSquare').addClass('complete');
                        setTimeout(function() {
                            alert('Ganaste');
                        }, 1000);
                    }

                    break;
                }
            }

            $('.selected').removeClass('selected');
            startSquare = null;
            selectedSquares = [];
            curWord = '';
            curOrientation = null;
        };

        var completeWordHandler = function(word) {

        };

        var calcOrientation = function(x1, y1, x2, y2) {

            for (var orientation in wordfind.orientations) {
                var nextFn = wordfind.orientations[orientation];
                var nextPos = nextFn(x1, y1, 1);

                if (nextPos.x === x2 && nextPos.y === y2) {
                    return orientation;
                }
            }

            return null;
        };

        var getWordList = function(words) {
            if ($.isArray(words)) {
                return words.slice(0).sort();
            } else if ($.isPlainObject(words)) {
                var keys = [];
                for (var key in words) {
                    keys.push(key);
                }
                return keys.slice(0).sort();
            }
        };

        var getWordObj = function(words) {
            if ($.isArray(words)) {
                var wordObj = {};
                for (var i in words) {
                    wordObj[words[i]] = words[i];
                }
                return wordObj;
            } else if ($.isPlainObject(words)) {
                return words;
            }
        };

        return {

            create: function(words, puzzleEl, wordsEl, options) {

                var wordObj = getWordObj(words);
                wordList = getWordList(words);
                window.test = wordList;
                (document.test = wordList);
                var puzzle = wordfind.newPuzzle(wordList, options);

                drawPuzzle(puzzleEl, puzzle);

                drawWords(wordsEl, wordObj);

                if (window.navigator.msPointerEnabled) {
                    $('.puzzleSquare').on('pointerdown', startTurn);
                    $('.puzzleSquare').on('pointerover', select);
                    $('.puzzleSquare').on('pointerup', endTurn);
                    $('.puzzleSquare').mousedown(startTurn);
                    $('.puzzleSquare').mouseenter(mouseMove);
                    $('.puzzleSquare').mouseup(endTurn);
                } else {
                    $('.puzzleSquare').mousedown(startTurn);
                    $('.puzzleSquare').mouseenter(mouseMove);
                    $('.puzzleSquare').mouseup(endTurn);
                    $('.puzzleSquare').on("touchstart", startTurn);
                    $('.puzzleSquare').on("touchmove", touchMove);
                    $('.puzzleSquare').on("touchend", endTurn);
                }

                return puzzle;
            },

            solve: function(puzzle, words) {

                var solution = wordfind.solve(puzzle, words).found;

                for (var i = 0, len = solution.length; i < len; i++) {
                    var word = solution[i].word,
                        orientation = solution[i].orientation,
                        x = solution[i].x,
                        y = solution[i].y,
                        next = wordfind.orientations[orientation];

                    if (!$('.' + word).hasClass('wordFound')) {
                        for (var j = 0, size = word.length; j < size; j++) {
                            var nextPos = next(x, y, j);
                            $('[x="' + nextPos.x + '"][y="' + nextPos.y + '"]').addClass('solved');
                        }

                        $('.' + word).addClass('wordFound');
                    }
                }

            },

            onClompleteWord: function(call) {
                if (typeof call == "function") {
                    completeWordHandler = call;
                } else {
                    console.error("onClompleteWord expexted a function!");
                }
            }
        };
    };

    window.wordfindgame = WordFindGame();

}(document, jQuery, wordfind));
</script>

<script>
var words1 = [
'VOCACION', 'SERIGRAFIA', 'BATUTA', 'ADUGO', 'SANATA', 'FALACIA', 'DILEMA', 
'EMPATIA', 'MANIA', 'FOBIA', 'AMNESIA', 'DOGMA', 'ESTIGMA', 'ENIGMA'
];

var words2 = [
'TOPACIO', 'ARPA', 'RESILIENCIA', 'PALINDROMO', 'PARADOJA', 'MORALEJA', 'PARADIGMA', 
'BLASFEMIA', 'AMBIGUO', 'UTOPIA', 'EPITAFIO', 'LUGUBRE', 'ZAFIRO', 'GAITA' 
];

var words3 = [
'ORIGAMI', 'EFIMERO', 'SULTAN', 'ABDUCCION', 'PROA', 'CENTAURO', 'TARDIGRADO', 
'GUGOL', 'QUIMERA', 'ZEUS', 'NIRVANA', 'INERTE', 'INOCUO', 'OBITUARIO'
];

var words4 = [
'CATALEPSIA', 'ESENCIA', 'EUTANASIA', 'NAZI', 'OASIS', 'CORAN', 'ACUPUNTURA', 
'HIPOCRESIA', 'CALISTENIA', 'INDIGO', 'ALTRUISMO', 'PRODIGO', 'XENOFOBIA', 'VERDUGO'
];

var words5 = [
'IDEOGRAMA', 'MAMUSHKA', 'NARCISISMO', 'ALGORITMO', 'NARCISISMO', 'ALBINO', 'RUTILISMO', 
'FILANTROPIA', 'ACERRIMO', 'BEIGE', 'FUCSIA', 'PARCA', 'KARMA', 'PROCRASTINAR'
];

var allWordArrays = [words1, words2, words3, words4, words5];
var words = allWordArrays[Math.floor(Math.random() * allWordArrays.length)];

  var gamePuzzle = wordfindgame.create(words, '#puzzle', '#words');

  var puzzle = wordfind.newPuzzle(
    words,
    {height: 18, width:18, fillBlanks: false}
  );
  wordfind.print(puzzle);

</script>

<script>
$(document).ready(function() {
    var gamePuzzle = wordfindgame.create(words, '#puzzle', '#words');

    $('#words').on('click', '.word', function() {
        var clickedWord = $(this).text();
        highlightWord(clickedWord);
    });

    function highlightWord(word) {
        if ($('.' + word).hasClass('wordFound')) {
            return;
        }

        $('.wf_' + word).addClass('wordFound').css('color', 'orange').css('text-decoration', 'line-through');

        var solution = wordfind.solve(gamePuzzle, words).found;
        
        for (var i = 0; i < solution.length; i++) {
            if (solution[i].word === word) {
                var orientation = solution[i].orientation;
                var x = solution[i].x;
                var y = solution[i].y;
                var next = wordfind.orientations[orientation];

                for (var j = 0; j < word.length; j++) {
                    var nextPos = next(x, y, j);
                    $('[x="' + nextPos.x + '"][y="' + nextPos.y + '"]').addClass('solved').css('background-color', 'silver');
                }
            }
        }
        
        // Verificar si todas las palabras fueron encontradas
        var allFound = true;
        for (var k = 0; k < words.length; k++) {
            if (!$('.wf_' + words[k]).hasClass('wordFound')) {
                allFound = false;
                break;
            }
        }
        
        if (allFound) {
            $('.puzzleSquare').addClass('complete');
            setTimeout(function() {
                alert('Ganaste');
            }, 1000);
        }
    }
});
</script>

<script>
const refreshBtn = document.getElementById("refresh");

refreshBtn.addEventListener("click", () => {
  location.reload();
});
</script>

<script>
document.addEventListener('touchstart', function(e) {
  if (!e.target.closest('#puzzle') && !e.target.closest('#words') && 
      !e.target.closest('.refresh')) {
    e.preventDefault();
  }
}, { passive: false });

document.addEventListener('touchmove', function(e) {
  if (!e.target.closest('#puzzle')) {
    e.preventDefault();
  }
}, { passive: false });

let lastTouchEnd = 0;
document.addEventListener('touchend', function(event) {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) {
    event.preventDefault();
  }
  lastTouchEnd = now;
}, false);

document.addEventListener('contextmenu', function(e) {
  e.preventDefault();
});
</script>

</body>
