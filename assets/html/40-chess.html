<script type="text/javascript">
    const pieceSymbols = {

    function createBoard() {

                square.className = `chess-square ${(i + j) % 2 === 0 ? 'white' : 'black'}`;
                square.onclick = function () {
                    hu(j, i);
                };
                square.id = `${j}${i}`;
                row.appendChild(square);
            }
            container.appendChild(row);
        }
    }

        const isWhiteInCheck = isCheck(b, 64);

                const square = document.getElementById(`${x}${y}`);

                square.classList.remove('selected', 'king-in-check');
                if (isSelected) {
                    square.classList.add('selected');
                }
                if (!em(b, x, y)) {
                    const isWhite = sa(b, x, y, 64);
                    const pieceType = ge(b, x, y) & 7;
                    const pieceKey = (isWhite ? 'w' : 'b') + pieceType;
                    const pieceSymbol = pieceSymbols[pieceKey] || '?';
                    square.innerHTML = `<span class="chess-piece ${isWhite ? 'white' : 'black'}">${pieceSymbol}</span>`;
                    if (pieceType === 6) {
                        if ((isWhite && isWhiteInCheck) || (!isWhite && isBlackInCheck)) {
                            square.classList.add('king-in-check');
                        }
                    }
                } else {
                    square.innerHTML = '';
                }
            }
        }
    }

    function sm(i) {

        else if (i.f == 5) K += "o-o-o";

        if (!((N - 1) % 20)) K = "";

    function un(u, b) {
        for (var i = u.x.length - 1; i >= 0; --i) Z(b, u.x[i], u.y[i], u.p[i]);
    }

    function au(u, b, x, y) {
        u.x.push(x);
        u.y.push(y);
        u.p.push(b[x + y * 8]);
    }

    function st(x) {
        document.getElementById("i").innerHTML = x;
    }

    function P(x, y, X, Y, f) {
        this.x = x;
        this.y = y;
        this.X = X;
        this.Y = Y;
        this.f = f;
    }

    function U() {
        this.x = [];
        this.y = [];
        this.p = [];
    }

    function em(b, x, y) {
        return !b[x + y * 8];
    }

    function ge(b, x, y) {
        return b[x + y * 8] & 7;
    }

    function co(b, x, y) {
        return b[x + y * 8] & 192;
    }

    function sa(b, x, y, c) {
        var i = b[x + y * 8];
        return i && (i & c);
    }

    function op(b, x, y, c) {
        var i = b[x + y * 8];
        return i && !(i & c);
    }

    function mo(b, x, y) {
        var i = b[x + y * 8];
        return i && (i & 32);
    }

    function la(b, x, y) {
        var i = b[x + y * 8];
        return i && (i & 16);
    }

    function ra(x, y) {
        return x >= 0 && x < 8 && y >= 0 && y < 8;
    }

    function di(c) {
        return c == 64 ? -1 : 1;
    }

    function Z(b, x, y, p) {
        b[x + y * 8] = p;

    function t(b, x, y, i, j, c, l) {

    function kn(b, x, y, c, l) {

        if (m.f == 4) Z(b, m.X, m.Y, 37 | co(b, m.x, m.y));
        else Z(b, m.X, m.Y, ge(b, m.x, m.y) | co(b, m.x, m.y) | 32 | (m.f == 2 ? 16 : 0));
        au(u, b, m.x, m.y);
        Z(b, m.x, m.y, 0);
        if (m.f == 1) {
            au(u, b, m.X, m.Y - di(c));
