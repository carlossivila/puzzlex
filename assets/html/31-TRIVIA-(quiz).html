<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

:root {
  --lime: #aaff00;
  --cyan: #00eeff;
  --bg: #0a0a0f;
}

body {
  background: radial-gradient(circle at 20% 30%, #0a0a0f, #030305);
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  font-family: 'DM Sans', sans-serif;
  overflow-x: hidden;
  padding: 0.5rem;
  gap: 0.6rem;
}

#header {
  width: 100%;
  text-align: center;
  padding: 4px 0 2px;
}

#header h1 {
  color: lime;
  font-size: 17px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 700;
}

#header hr {
  border: none;
  height: 1px;
  background: linear-gradient(90deg, transparent, lime, transparent);
  margin-top: 4px;
}

#screen-ruleta {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
  width: 100%;
}

#screen-trivia { display: none; width: 100%; }

#ruleta-result {
  font-family: 'Bebas Neue', cursive;
  font-size: clamp(2.5rem, 8vw, 2.5rem);
  letter-spacing: 0.08em;
  min-height: 2.8rem;
  text-align: center;
  padding: 0 0.5rem;
}

@keyframes ruleta-pop {
  0%   { transform: scale(0.5); opacity: 0; filter: blur(2px); }
  70%  { transform: scale(1.1); }
  100% { transform: scale(1);   opacity: 1; filter: blur(0); }
}

.ruleta-pop { animation: ruleta-pop 0.4s cubic-bezier(0.2,1.2,0.4,1); }

#ruleta-container {
  position: relative;
  width: min(360px, 84vw);
  height: min(360px, 84vw);
  margin-top: 1.8rem;
}

#ruleta-container::before {
  content: '';
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, gray, yellow, orange, lime, cyan, purple, red, gray);
  filter: blur(14px);
  opacity: 0.9;
  z-index: -1;
  pointer-events: none;
  animation: aureola-spin 4s linear infinite;
}

@keyframes aureola-spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

#ruleta-pointer {
  position: absolute;
  top: -26px; left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 17px solid transparent;
  border-right: 17px solid transparent;
  border-top: 40px solid #aaff00;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.45));
  z-index: 15;
}

#ruleta-pointer::after {
  content: '';
  position: absolute;
  top: -38px; left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 13px solid transparent;
  border-right: 13px solid transparent;
  border-top: 33px solid #333;
}

#ruleta-canvas {
  display: block;
  border-radius: 50%;
  box-shadow: 0 0 0 3px rgba(255,255,200,0.18), 0 18px 22px rgba(0,0,0,0.55);
  width: 100%; height: 100%;
}

#ruleta-btn {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  z-index: 30;
  font-family: 'Bebas Neue', cursive;
  font-size: clamp(0.95rem, 3.8vw, 1.4rem);
  background: radial-gradient(circle at 35% 25%, #ffec9f, #ffb347);
  color: #0f0f1c;
  border: none;
  border-radius: 50%;
  width: min(80px, 18vw);
  height: min(80px, 18vw);
  cursor: pointer;
  box-shadow: 0 5px 0 #b45f1b, 0 5px 18px rgba(0,0,0,0.5);
  transition: transform 0.05s linear, box-shadow 0.05s linear, background 0.05s linear;
  text-align: center; line-height: 1.2; font-weight: 900;
}

#ruleta-btn:active  { transform: translate(-50%,-50%) scale(0.93); box-shadow: 0 2px 0 #b45f1b; }

#ruleta-btn:hover   { background: radial-gradient(circle at 30% 25%,#fff2bb,#ffc46b); transform: translate(-50%,-50%) scale(1.03); }

#ruleta-btn:disabled{ background: #3e3e52; box-shadow: 0 4px 0 #1e1e2c; color: #b0b0c0; cursor: not-allowed; transform: translate(-50%,-50%) scale(0.97); }

#trivia-wrap {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 0;
}

.category-name {
  font-size: 17px;
  padding: 6px 8px;
  font-weight: bold;
  background: lightblue;
  border: 1px solid gray;
  border-radius: 5px;
  color: #111;
  cursor: pointer;
}

#question {
  font-size: 18px;
  padding: 8px 8px;
  color: blue;
  background: beige;
  border: 1px solid gray;
  border-radius: 5px;
}

#answers button {
  display: block;
  width: 100%;
  padding: 7px 8px;
  font-size: 19px;
  background: #eee;
  border: 1px solid gray;
  border-radius: 5px;
  cursor: pointer;
  transition: background 0.25s;
  text-align: left;
  margin-bottom: 0;
}

#answers button:hover { background: #ddd; }

.correct   { background: #4CAF50 !important; color: white !important; }

.incorrect { background: #f44336 !important; color: white !important; }

#progress-container { background: black; border-radius: 5px; height: 10px; }

#progress-bar {
  height: 10px; background: lime;
  border-radius: 5px;
  transition: width 0.1s linear;
  width: 100%;
}


.btn {
  display: inline-block;
  font-size: 18px;
  background-color: #009900;
  border: 1px solid gray;
  border-radius: 5px;
  transition: box-shadow 0.3s ease;
}

.btn:hover {
  border: 1px solid cyan;
  box-shadow: 0 0 15px cyan, 0 0 30px aqua;
}


#trivia-footer {
  margin-top: 4px;
}

#trivia-footer hr { border-color: #333; margin: 4px 0; }

#trivia-footer p {
  color: cyan; font-size: 18px; line-height: 1.4;
  padding: 4px 0;
}

#trivia-footer .fire-row { display: flex; flex-wrap: wrap; gap: 2px; align-items: flex-end; }

a:link, a:visited { text-decoration: none; color: lime; }

a:hover { color: red; }

.fade-out { animation: fadeOut 0.35s forwards; }

.fade-in  { animation: fadeIn  0.35s forwards; }

@keyframes fadeOut { to { opacity: 0; transform: scale(0.97); } }

@keyframes fadeIn  { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
</style>
</head>

<script>
    const audio = document.getElementById("audio");
    const sound = document.getElementById("sound");
    sound.addEventListener("click", function() {
        if (audio.paused) {
            audio.play();
            sound.textContent = "🔊";
        } else {
            audio.pause();
            sound.textContent = "🔇";
        }
    });
</script>

const RULETA_VARIANTES = {
  'IDIOMA':      ['IDIOMA','IDIOMA_','IDIOMA__'],
  'MATEMATICAS': ['MATEMATICAS'],
  'HISTORIA':    ['HISTORIA','HISTORIA_','HISTORIA__'],
  'GEOGRAFIA':   ['GEOGRAFIA','GEOGRAFIA_'],
  'BIOLOGIA':    ['BIOLOGIA','BIOLOGIA_','BIOLOGIA__'],
  'TECNOLOGIA':  ['TECNOLOGIA','TECNOLOGIA_','TECNOLOGIA__','TECNOLOGIA-_'],
  'DEPORTE':     ['DEPORTE'],
  'ARTE':        ['ARTE','ARTE_','ARTE__','ARTE-_','ARTE_-','ARTE--']
};
const RULETA_LABELS = ['IDIOMA',       'MATEMÁTICAS',      'HISTORIA',       'GEOGRAFÍA',       'BIOLOGÍA',       'TECNOLOGÍA',      'DEPORTE',       'ARTE'];
const RULETA_KEYS   = ['IDIOMA',       'MATEMATICAS',      'HISTORIA',       'GEOGRAFIA',       'BIOLOGIA',       'TECNOLOGIA',      'DEPORTE',       'ARTE'];
const RULETA_COLORS = ['#F4D03F',      '#E67E22',          '#A1887F',        '#3498DB',         '#52BE80',        '#8E44AD',         '#E74C3C',       '#E84393'];
const RULETA_ICONS  = {'IDIOMA':'📚',  'MATEMATICAS':'🧮',  'HISTORIA':'⚔️',  'GEOGRAFIA':'🌍',  'BIOLOGIA':'🧬',  'TECNOLOGIA':'💾',  'DEPORTE':'⚽',  'ARTE':'🎨'};
const canvas = document.getElementById('ruleta-canvas');
const ctx    = canvas.getContext('2d');
let rAngle = 0, spinning = false, audioCtx = null;
let chosenSubCategory = null;

function getAC() { if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function playTick(p=1) {
  try {
    const ac=getAC(), buf=ac.createBuffer(1,ac.sampleRate*0.04,ac.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(ac.sampleRate*0.008));
    const s=ac.createBufferSource(); s.buffer=buf; s.playbackRate.value=p;
    const f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1200*p; f.Q.value=2;
    const g=ac.createGain(); g.gain.value=0.32;
    s.connect(f); f.connect(g); g.connect(ac.destination); s.start();
  } catch(e){}
}
function playFinal() {
  try {
    const ac=getAC(),o=ac.createOscillator(),g=ac.createGain();
    o.type='sine'; o.frequency.setValueAtTime(880,ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(660,ac.currentTime+0.3);
    g.gain.setValueAtTime(0.4,ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.6);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+0.6);
  } catch(e){}
}

function setupCanvas() {
  const s = Math.round(Math.min(360, canvas.getBoundingClientRect().width || document.documentElement.clientWidth * 0.84));
  if (s < 10) { requestAnimationFrame(setupCanvas); return; }
  if (canvas.width === s) return;
  canvas.width = canvas.height = s;
  drawWheel();
}

function lighten(hex) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,r+55)},${Math.min(255,g+55)},${Math.min(255,b+55)})`;
}

function drawWheel(hi=-1) {
  const W=canvas.width, cx=W/2, cy=W/2, R=W/2-4, n=RULETA_LABELS.length, arc=(Math.PI*2)/n;
  ctx.clearRect(0,0,W,W);
  for(let i=0;i<n;i++){
    const s=rAngle+i*arc, e=s+arc, mid=s+arc/2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,R,s,e); ctx.closePath();
    ctx.fillStyle = hi===i ? lighten(RULETA_COLORS[i]) : RULETA_COLORS[i];
    ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.22)'; ctx.lineWidth=1.5; ctx.stroke();
    const fs=Math.max(9,Math.min(R*0.13,15)), tx=W*0.14;
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(mid); ctx.textAlign='left';
    ctx.fillStyle='#fff'; ctx.shadowColor='rgba(0,0,0,0.6)'; ctx.shadowBlur=4;
    ctx.font=`700 ${fs}px 'DM Sans',sans-serif`;
    ctx.fillText(RULETA_LABELS[i], tx+4, fs*0.37, R-tx-6);
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(cx,cy,W*0.07,0,Math.PI*2);
  ctx.fillStyle='#0f0f13'; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.1)'; ctx.lineWidth=2; ctx.stroke();
}

document.getElementById('ruleta-btn').addEventListener('click', function(){
  if(spinning) return;
  spinning=true; this.disabled=true;
  try{getAC().resume();}catch(e){}
  const res=document.getElementById('ruleta-result');
  res.className=''; res.textContent='';

  const todosLosGrupos = Object.keys(questions);
  chosenSubCategory = todosLosGrupos[Math.floor(Math.random() * todosLosGrupos.length)];

  let targetIdx = 0;
  for(let k=0; k<RULETA_KEYS.length; k++){
    const vars = RULETA_VARIANTES[RULETA_KEYS[k]];
    if(vars && vars.indexOf(chosenSubCategory) !== -1){ targetIdx = k; break; }
  }

  const n=RULETA_LABELS.length, arcSz=(Math.PI*2)/n;
  const sectorMid = targetIdx * arcSz + arcSz / 2;
  const desiredAngle = ((-Math.PI/2) - sectorMid % (Math.PI*2) + Math.PI*2*100) % (Math.PI*2);
  const from = rAngle % (Math.PI*2);
  const vueltas = (6 + Math.floor(Math.random()*5)) * Math.PI * 2;
  const diff = (desiredAngle - from + Math.PI*2*100) % (Math.PI*2);
  const total = vueltas + diff;

  const dur=4000+Math.random()*1500;
  const t0=performance.now();
  function ease(t){return 1-Math.pow(1-t,4);}
  let lastSeg=-1;

  (function frame(now){
    const t=Math.min((now-t0)/dur,1);
    rAngle=from+total*ease(t);
    drawWheel();
    const ptr=((-rAngle-Math.PI/2)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
    const seg=Math.floor(ptr/arcSz)%n;
    if(seg!==lastSeg){ lastSeg=seg; if(t<1) playTick(0.6+4*Math.pow(1-t,3)*2.2); }
    if(t<1){requestAnimationFrame(frame);return;}

    rAngle=rAngle%(Math.PI*2);
    spinning=false;

    drawWheel(targetIdx); playFinal();

    const key=RULETA_KEYS[targetIdx];
    res.textContent=RULETA_ICONS[key]+' '+RULETA_LABELS[targetIdx];
    res.className='ruleta-pop';
    res.style.color='#333';
    res.style.textShadow='0 0 8px lime, 0 0 3px cyan';
    res.style.fontWeight='bold';

    setTimeout(()=>switchToTrivia(chosenSubCategory), 3000);
  })(performance.now());
});

function switchToTrivia(subCat) {
  const sr=document.getElementById('screen-ruleta');
  const st=document.getElementById('screen-trivia');
  sr.classList.add('fade-out');
  setTimeout(()=>{
    sr.style.display='none'; sr.classList.remove('fade-out');
    st.style.display='block'; st.classList.add('fade-in');
    setTimeout(()=>st.classList.remove('fade-in'),400);
    startGame(subCat);
  },320);
}

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playgood() {
    initAudio();
    const notas = [523.25, 587.33, 659.25, 783.99];
    const tiempos = [0, 0.15, 0.3, 0.45];
    
    notas.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime + tiempos[i]);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + tiempos[i] + 0.15);
        
        osc.start(audioCtx.currentTime + tiempos[i]);
        osc.stop(audioCtx.currentTime + tiempos[i] + 0.15);
    });
}

function playfail() {
    initAudio();
    const now = audioCtx.currentTime;
    [440, 392, 349.23, 293.66].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, now + i * 0.15);
        gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.4);
        osc.start(now + i * 0.15);
        osc.stop(now + i * 0.15 + 0.45);
    });
}

function playlose() {
    initAudio();
    const now = audioCtx.currentTime;

    const notasDescendentes = [392, 349.23, 311.13, 293.66, 261.63];
    notasDescendentes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + i * 0.2);
        gainNode.gain.setValueAtTime(0.15, now + i * 0.2);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + i * 0.2 + 0.25);
        
        osc.start(now + i * 0.2);
        osc.stop(now + i * 0.2 + 0.25);
    });

    const oscFinal = audioCtx.createOscillator();
    const gainFinal = audioCtx.createGain();
    
    oscFinal.connect(gainFinal);
    gainFinal.connect(audioCtx.destination);
    
    oscFinal.type = 'sawtooth';
    oscFinal.frequency.setValueAtTime(130.81, now + 1.2);
    gainFinal.gain.setValueAtTime(0.2, now + 1.2);
    gainFinal.gain.exponentialRampToValueAtTime(0.01, now + 1.2 + 0.6);
    
    oscFinal.start(now + 1.2);
    oscFinal.stop(now + 1.2 + 0.6);
}

function playwin() {
    initAudio();
    const now = audioCtx.currentTime;

    const notasIniciales = [523.25, 587.33, 659.25, 783.99];
    notasIniciales.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc.frequency.setValueAtTime(freq, now + i * 0.15);
        gainNode.gain.setValueAtTime(0.2, now + i * 0.15);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.15);
        
        osc.start(now + i * 0.15);
        osc.stop(now + i * 0.15 + 0.15);
    });

    const notasFinales = [880, 1046.5];
    notasFinales.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        const startTime = now + 0.75 + i * 0.15;
        osc.frequency.setValueAtTime(freq, startTime);
        gainNode.gain.setValueAtTime(0.25, startTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + 0.2);
        
        osc.start(startTime);
        osc.stop(startTime + 0.2);
  });
}

cd.innerHTML=`${currentCategory}&nbsp;/&nbsp;<span style="font-size:20px;font-family:'Calculator',monospace;font-weight:bold;">${score}</span> ✅ &nbsp;y&nbsp;<span style="font-size:20px;font-family:'Calculator',monospace;font-weight:bold;">${fails}</span>❌&nbsp;de&nbsp;<span style="font-size:20px;font-family:'Calculator',monospace;font-weight:bold;">${totalQuestions}</span>&nbsp;/&nbsp;<span style="color:${timerColor()};font-size:20px;font-family:'Calculator',monospace;font-weight:bold;">${timeLeft}</span>`;

function startGame(category) {
  currentCategory=category;
  currentQuestions=[...questions[category]];
  score=0; fails=0; totalQuestions=currentQuestions.length;
  updateDisplay();
  showNextQuestion();
}

function showNextQuestion() {
  if(currentQuestions.length===0){
    clearInterval(timer);
    const mitad=Math.ceil(totalQuestions/2);
    if(score>=mitad){
      playwin();
      setTimeout(()=>{
        const msg = new SpeechSynthesisUtterance("Gracias por usar PuzzleX by Carlos Sivila");
        msg.lang = "es-AR";
        msg.rate = 0.95;
        msg.pitch = 1;
        window.speechSynthesis.speak(msg);
        setTimeout(()=>{
          alert(`¡GANASTE! \nPuntaje: ${score} aciertos y ${fails} fallos de ${totalQuestions}\nGracias por usar PuzzleX by Carlos Sivila`);
          switchToRuleta();
        }, 5000);
      }, 1000);
    } else {
      playlose();
      setTimeout(()=>{
        alert(`¡PERDISTE! \nPuntaje: ${score} aciertos y ${fails} fallos de ${totalQuestions}\nGracias por usar PuzzleX by Carlos Sivila`);
        switchToRuleta();
      },1000);
    }
    return;
  }

  const ri=Math.floor(Math.random()*currentQuestions.length);
  const qd=currentQuestions[ri];
  const question=qd[0], answers=qd.slice(1), correct=answers[0];
  currentQuestions.splice(ri,1);
  questionElement.textContent=question;
  answersElement.innerHTML='';
  answers.sort(()=>Math.random()-0.5).forEach(a=>{
    const b=document.createElement('button');
    b.textContent=a;
    b.addEventListener('click',()=>checkAnswer(b,a,correct));
    answersElement.appendChild(b);
  });
  startTimer();
}

function checkAnswer(button, sel, correct) {
  clearInterval(timer);
  for(let b of answersElement.getElementsByTagName('button')){
    b.disabled=true;
    if(b.textContent===correct) b.classList.add('correct');
  }
  if(sel===correct){ score++; playgood(); }
  else { fails++; button.classList.add('incorrect'); playfail(); }
  updateDisplay();
  setTimeout(showNextQuestion,2000);
}

function startTimer() {
  timeLeft=99;
  progressBar.style.width='100%';
  progressBar.style.background='lime';
  if(timer) clearInterval(timer);
  timer=setInterval(()=>{
    timeLeft--;
    progressBar.style.width=`${(timeLeft/99)*100}%`;
    if(timeLeft>66) progressBar.style.background='lime';
    else if(timeLeft>33) progressBar.style.background='orange';
    else progressBar.style.background='red';
    updateDisplay();
    if(timeLeft<=0){
      clearInterval(timer);
      playlose();
      setTimeout(()=>{
        alert(`¡PERDISTE!, se te acabó el tiempo \nPuntaje: ${score} aciertos y ${fails} fallos de ${totalQuestions}\nGracias por usar PuzzleX by Carlos Sivila`);
        switchToRuleta();
      },1000);
    }
  },1000);
}

document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
