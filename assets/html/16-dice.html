<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PuzzleX - dados</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: left; background-color: #111; }

        .dados { display: flex; justify-content: left; margin: 15px; }

        .dado-scene {
            width: 60px;
            height: 60px;
            perspective: 300px;
            margin: 0 5px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .dado-cube {
            width: 60px;
            height: 60px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(0deg) rotateY(0deg);
        }

        .dado-cube.rolling {
            transition: none !important;
        }

        .face {
            position: absolute;
            width: 60px;
            height: 60px;
            background-color: white;
            border: 2px solid #000;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .face.front  { transform: rotateY(0deg)    translateZ(30px); }
        .face.back   { transform: rotateY(180deg)   translateZ(30px); }
        .face.right  { transform: rotateY(90deg)    translateZ(30px); }
        .face.left   { transform: rotateY(-90deg)   translateZ(30px); }
        .face.top    { transform: rotateX(90deg)    translateZ(30px); }
        .face.bottom { transform: rotateX(-90deg)   translateZ(30px); }

        .dado-cube.selected .face.front {
            background-color: #b3e5fc;
        }

        .punto {
            width: 10px;
            height: 10px;
            background-color: black;
            border-radius: 50%;
            position: absolute;
        }

        .score { font-size: 20px; }
        #contador, #temporizador { margin-top: 2px; color: red; }
        #numeroObjetivo { font-size: 20px; font-family: arial black, arial; color: lime; }

        a:link, a:visited { text-decoration: none; color: lime; }
        a:hover           { text-decoration: none; color: red;  }

        @media (max-width: 600px) {
            body { font-size: 20px; transform: scale(1.0); transform-origin: top left; }
        }
    </style>
</head>
<body>
<h3 style="color: lime;">PuzzleX by Carlos Sivila</h3>
<div id="numeroObjetivo"></div>
<div class="dados">
    <div class="dado-scene" onclick="toggleSeleccion(document.getElementById('dado1'))">
        <div class="dado-cube" id="dado1" data-valor="">
            <div class="face front"></div><div class="face back"></div>
            <div class="face right"></div><div class="face left"></div>
            <div class="face top"></div><div class="face bottom"></div>
        </div>
    </div>
    <div class="dado-scene" onclick="toggleSeleccion(document.getElementById('dado2'))">
        <div class="dado-cube" id="dado2" data-valor="">
            <div class="face front"></div><div class="face back"></div>
            <div class="face right"></div><div class="face left"></div>
            <div class="face top"></div><div class="face bottom"></div>
        </div>
    </div>
    <div class="dado-scene" onclick="toggleSeleccion(document.getElementById('dado3'))">
        <div class="dado-cube" id="dado3" data-valor="">
            <div class="face front"></div><div class="face back"></div>
            <div class="face right"></div><div class="face left"></div>
            <div class="face top"></div><div class="face bottom"></div>
        </div>
    </div>
    <div class="dado-scene" onclick="toggleSeleccion(document.getElementById('dado4'))">
        <div class="dado-cube" id="dado4" data-valor="">
            <div class="face front"></div><div class="face back"></div>
            <div class="face right"></div><div class="face left"></div>
            <div class="face top"></div><div class="face bottom"></div>
        </div>
    </div>
    <div class="dado-scene" onclick="toggleSeleccion(document.getElementById('dado5'))">
        <div class="dado-cube" id="dado5" data-valor="">
            <div class="face front"></div><div class="face back"></div>
            <div class="face right"></div><div class="face left"></div>
            <div class="face top"></div><div class="face bottom"></div>
        </div>
    </div>
</div>

<div class="score">
    <div style="display: flex; justify-content: left;">
        <div style="color: white;">Aciertos:&nbsp;</div><div id="contador">0</div> &emsp; <span style="color: red"> de 39 </span>
    </div>
    <div style="display: flex; justify-content: left;">
        <div style="color: white;">Tiempo restante:&ensp;</div><div id="temporizador">99</div>
    </div>
</div>

<script>
    let aciertos = 0;
    let tiempoRestante = 99;
    let temporizador;
    let dadosSeleccionados = [];
    let valoresDados = [];
    let audioContext;
    let rollingIntervals = [];
    let isRolling = false;

    function inicializarAudio() {
        if (!audioContext)
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    function reproducirTono(frecuencia, duracion) {
        inicializarAudio();
        const oscilador = audioContext.createOscillator();
        const ganancia  = audioContext.createGain();
        oscilador.connect(ganancia);
        ganancia.connect(audioContext.destination);
        oscilador.frequency.value = frecuencia;
        oscilador.type = 'sine';
        ganancia.gain.setValueAtTime(0.3, audioContext.currentTime);
        ganancia.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duracion);
        oscilador.start(audioContext.currentTime);
        oscilador.stop(audioContext.currentTime + duracion);
    }

    function sonidoAcierto() { reproducirTono(523.25, 0.2); }

    function sonidoVictoria() {
        const notas    = [523.25, 587.33, 659.25, 783.99, 880.00];
        const duracion = 0.3;
        notas.forEach((nota, index) => {
            setTimeout(() => reproducirTono(nota, duracion), index * duracion * 1000);
        });
    }

    const posiciones = {
        1: [{ top: '35%', left: '35%' }],
        2: [{ top: '25%', left: '15%' }, { top: '45%', left: '45%' }],
        3: [{ top: '25%', left: '15%' }, { top: '35%', left: '35%' }, { top: '45%', left: '55%' }],
        4: [{ top: '15%', left: '15%' }, { top: '15%', left: '55%' }, { top: '55%', left: '15%' }, { top: '55%', left: '55%' }],
        5: [{ top: '15%', left: '15%' }, { top: '15%', left: '55%' }, { top: '35%', left: '35%' }, { top: '55%', left: '15%' }, { top: '55%', left: '55%' }],
        6: [{ top: '15%', left: '15%' }, { top: '15%', left: '55%' }, { top: '35%', left: '15%' }, { top: '35%', left: '55%' }, { top: '55%', left: '15%' }, { top: '55%', left: '55%' }]
    };

    function crearPuntos(face, valor) {
        face.innerHTML = '';
        posiciones[valor].forEach(pos => {
            const punto = document.createElement('div');
            punto.className = 'punto';
            punto.style.top  = pos.top;
            punto.style.left = pos.left;
            face.appendChild(punto);
        });
    }

    function iniciarJuego() {
        inicializarAudio();
        generarValoresDados();
        generarNumeroObjetivo();
        iniciarTemporizador();
        lanzarDados();
    }

    function generarValoresDados() {
        valoresDados = [];
        for (let i = 0; i < 5; i++)
            valoresDados.push(Math.floor(Math.random() * 6) + 1);
    }

    function generarNumeroObjetivo() {
        const sumaTotal = valoresDados.reduce((a, b) => a + b, 0);
        let numeroObjetivo;
        do {
            numeroObjetivo = Math.floor(Math.random() * (sumaTotal - 4)) + 5;
        } while (!esAlcanzable(numeroObjetivo));
        document.getElementById("numeroObjetivo").textContent = "Suma: " + numeroObjetivo;
        dadosSeleccionados = [];
        reiniciarDados();
    }

    function esAlcanzable(numero) {
        const posiblesSumas = [];
        for (let i = 0; i < (1 << valoresDados.length); i++) {
            let suma = 0;
            for (let j = 0; j < valoresDados.length; j++)
                if (i & (1 << j)) suma += valoresDados[j];
            posiblesSumas.push(suma);
        }
        return posiblesSumas.includes(numero);
    }

    function reiniciarDados() {
        Array.from(document.getElementsByClassName("dado-cube"))
             .forEach(c => c.classList.remove("selected"));
    }

    function toggleSeleccion(dado) {
        if (isRolling) return;
        dado.classList.toggle("selected");
        verificarAcerto();
    }

    function verificarAcerto() {
        const sumaSeleccionada = calcularSumaConRepetidos();
        const numeroObjetivo   = parseInt(document.getElementById("numeroObjetivo").textContent.split(": ")[1]);

        if (dadosSeleccionados.length > 0 && sumaSeleccionada === numeroObjetivo) {
            aciertos++;
            document.getElementById("contador").textContent = " " + aciertos;
            sonidoAcierto();

            if (aciertos === 39) {
                sonidoVictoria();
                setTimeout(() => { alert("Ganaste"); location.reload(); }, 1500);
                return;
            }

            reiniciarTemporizador();
            generarValoresDados();
            generarNumeroObjetivo();
            lanzarDados();
            dadosSeleccionados = [];
        }
    }

    function calcularSumaConRepetidos() {
        dadosSeleccionados = Array.from(document.getElementsByClassName("dado-cube"))
            .filter(dado => dado.classList.contains("selected"))
            .map(dado => parseInt(dado.dataset.valor));
        return dadosSeleccionados.reduce((a, b) => a + b, 0);
    }

function iniciarTemporizador() {
    temporizador = setInterval(() => {
        tiempoRestante--;
        document.getElementById("temporizador").textContent =
            tiempoRestante < 10 ? '0' + tiempoRestante : tiempoRestante;
        if (tiempoRestante <= 0) {
            clearInterval(temporizador);
            alert("Perdiste");
            resetJuego();
        }
    }, 1000);
}

function reiniciarTemporizador() {
    clearInterval(temporizador);
    tiempoRestante = 99;
    document.getElementById("temporizador").textContent = "99";
    iniciarTemporizador();
}

    function resetJuego() {
        aciertos = 0;
        document.getElementById("contador").textContent = "0";
        reiniciarTemporizador();
        generarValoresDados();
        generarNumeroObjetivo();
        lanzarDados();
    }

    const ROT_FINAL = 'rotateX(0deg) rotateY(0deg)';

    function lanzarDados() {
        isRolling = true;
        rollingIntervals.forEach(clearInterval);
        rollingIntervals = [];

        const cubos = Array.from(document.getElementsByClassName("dado-cube"));
        let terminados = 0;

        cubos.forEach((cubo, i) => {
            const valor = valoresDados[i];

            cubo.dataset.valor = valor;

            const frontFace = cubo.querySelector('.face.front');
            crearPuntos(frontFace, valor);

            cubo.classList.remove('selected');

            let rx = Math.floor(Math.random() * 360);
            let ry = Math.floor(Math.random() * 360);

            cubo.classList.add('rolling');
            cubo.style.transition = 'none';
            cubo.style.transform  = `rotateX(${rx}deg) rotateY(${ry}deg)`;

            const iv = setInterval(() => {
                rx += Math.floor(Math.random() * 20) + 10;
                ry += Math.floor(Math.random() * 20) + 10;
                cubo.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
            }, 100);

            rollingIntervals.push(iv);

            setTimeout(() => {
                clearInterval(iv);
                cubo.classList.remove('rolling');
                cubo.style.transition = 'transform 1.5s cubic-bezier(0.25, 1, 0.5, 1)';
                cubo.style.transform  = ROT_FINAL;

                setTimeout(() => {
                    terminados++;
                    if (terminados === cubos.length) isRolling = false;
                }, 1500);

            }, 1000 + i * 60);
        });
    }

    iniciarJuego();
</script>

<script>
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
</script>
</body>
</html>
