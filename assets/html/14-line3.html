<body>

<h3 style="color: lime; font-size: 18px;">PuzzleX by Carlos Sivila&emsp;//&emsp;<span><a href="https://www.youtube.com/watch?v=G4X1073sB-g">-soluciones-</a></span></h3>

<script language="javascript">
var level=1, myway, mynextmove;
var tmp, done, iswon, content;
var pcwins=[0,0,0,0];
var playerwins=[0,0,0,0];
var draws=[0,0,0,0];
var sessionPlayerWins=0;
var sessionPcWins=0;
var playerstarts=true;
var moves=new Array();
var game=new Array(9);
var choices=[11,12,13,21,22,23,31,32,33];
var corners=[11,13,31,33];
var ways=new Array();
ways[1]=[0,11,12,13];
ways[2]=[0,21,22,23];
ways[3]=[0,31,32,33];
ways[4]=[0,11,21,31];
ways[5]=[0,12,22,32];
ways[6]=[0,13,23,33];
ways[7]=[0,11,22,33];
ways[8]=[0,13,22,31]; 
var w3c=(document.getElementById)?true:false;
var ns4=(document.layers)?true:false;
var ie4=(document.all && !w3c)?true:false;
var ie5=(document.all && w3c)?true:false;
var ns6=(w3c && navigator.appName.indexOf("Netscape")>=0)?true:false;

function init(){
oktoplay=true;
iswon=false;
done=0;
writetext(4);
moves[11]=0; moves[12]=0; moves[13]=0; moves[21]=0; moves[22]=0; moves[23]=0; moves[31]=0; moves[32]=0; moves[33]=0;
for(i=0;i<=8;i++){
document.getElementById('rc'+choices[i]).innerHTML="";
document.getElementById('rc'+choices[i]).style.color="";
game[i]=0;
}
if(!playerstarts)pcturn();
}

function writetext(num){
switch(num){
case 1: content='Esta ronda es empate';
break;
case 2: content='La computadora ganó esta ronda.';
break;
case 3: content='Tú ganaste esta ronda.';
break;
case 4: content='NIVEL: '+level+'\n\nComputadora Gana:  Este nivel- '+pcwins[level]+'  (Total: '+(pcwins[0]+pcwins[1]+pcwins[2]+pcwins[3])+')\nJugador Gana    :  Este nivel- '+playerwins[level]+'  (Total: '+(playerwins[0]+playerwins[1]+playerwins[2]+playerwins[3])+')\nEmpates         :  Este nivel- '+draws[level]+'  (Total: '+(draws[0]+draws[1]+draws[2]+draws[3])+')';
break;
}

document.scores.scores2.value=content

if(num==3){
sessionPlayerWins++;
if(sessionPlayerWins>=10){
setTimeout(function(){
alert('Juego terminado, tú ganas');
sessionPlayerWins=0; sessionPcWins=0;
pcwins=[0,0,0,0]; playerwins=[0,0,0,0]; draws=[0,0,0,0];
playerstarts=true; init();
},1000); return;
}}
if(num==2){
sessionPcWins++;
if(sessionPcWins>=10){
setTimeout(function(){
alert('Juego terminado, tú pierdes');
sessionPlayerWins=0; sessionPcWins=0;
pcwins=[0,0,0,0]; playerwins=[0,0,0,0]; draws=[0,0,0,0];
playerstarts=true; init();
},1000); return;
}}
if(num<4)setTimeout('init(4)',1000);
}

function setlevel(x){
	if (level!=x){
		level=x;
		init();
}}

function setbutton(cellnum){
if (!iswon){
if(moves[cellnum]==0){
document.getElementById('rc'+cellnum).innerHTML="X";
document.getElementById('rc'+cellnum).style.color="blue";
moves[cellnum]=1;
game[done]=cellnum;
done++;
findwinner(true);
}else alert('Esta casilla ya está ocupada');
}}

function pcstrategy(istowin){
if (level>0){
var str=(istowin)? 2 : 1;
for(n=1;n<=8;n++){
if((moves[ways[n][1]]==str) && (moves[ways[n][2]]==str) && (moves[ways[n][3]]==0)) tmp=ways[n][3];
if((moves[ways[n][1]]==str) && (moves[ways[n][3]]==str) && (moves[ways[n][2]]==0)) tmp=ways[n][2];
if((moves[ways[n][2]]==str) && (moves[ways[n][3]]==str) && (moves[ways[n][1]]==0)) tmp=ways[n][1];
}}}


function selecCorner(which){
if (which=="empty"){
do{
tmp=corners[Math.floor(Math.random()*4)];
}while(moves[tmp]!=0);
}
else
tmp=corners[Math.floor(Math.random()*4)];
}


function pcdontlose(){
if (!playerstarts){
if (done==0){
tmp=choices[2*Math.floor(Math.random()*5)];
if (tmp==22) myway=1;
else myway=2;
}
else if (done==2){
if (myway==1){
if (game[1]==11 || game[1]==13 || game[1]==31 || game[1]==33)
tmp=44-game[1];	
else{
dlta=22-game[1];
op0=22+dlta+(10/dlta);
op1=22+dlta-(10/dlta);
tmp=eval("op"+Math.floor(Math.random()*2));
}}
else if (myway==2){
if (game[1]==22){
tmp=44-game[0];
myway=21;
}
else if (game[1]==11 || game[1]==13 || game[1]==31 || game[1]==33){
selecCorner("empty");
myway=22;
}
else{
tmp=22;
myway=23;
}}}
else if (done==4){
if (myway==22){
for (i=0; i<4 ;i++){            
if (moves[corners[i]]==0){
tmp=corners[i];
}}}
else if (myway==23){
dlta=game[1]-game[0];
op0=44-(game[1]+dlta);
op1=(op0+game[0])/2;
tmp=eval("op"+Math.floor(Math.random()*2));
}
else if (myway==1)
tmp=44+game[2]-(2*game[3]);
}}
else if (level==3){
if (done==1){
if (game[0]==11 || game[0]==13 || game[0]==31 || game[0]==33){
tmp=22;
myway=1;
}
else if (game[0]==22){
selecCorner("any");
myway=2;
}
else{
tmp=22;
myway=3;
}}
else if (done==3){
if (myway==1){
if (game[2]==44-game[0])
tmp=choices[1+(2*Math.floor(Math.random()*4))];
else
tmp=44-game[0]
}
else if (myway==2){
if (game[2]==44-game[1])
selecCorner("empty");
}
else if (myway==3){
if (game[2]==11 || game[2]==13 || game[2]==31 || game[2]==33)
tmp=44-game[2];
if (game[2]==44-game[0]){
dlta=22-game[2];
tmp=22+(10/dlta);
mynextmove=tmp+dlta;
}
else{
dlta=22-game[0];
op0=game[0]+(10/dlta);	
op1=game[0]-(10/dlta);	
op2=game[2]+dlta;	
tmp=eval("op"+Math.floor(Math.random()*3));
}}}
else if (done==5 && myway==3){
tmp=mynextmove;
}}}


function findwinner(isplayer){
me=(isplayer)? 1 : 2;
for(n=1;n<=8;n++){
if( (moves[ways[n][1]]==me) && (moves[ways[n][2]]==me) && (moves[ways[n][3]]==me) ){
iswon=true;
break;
}}
if(iswon){
if(isplayer){
playerwins[level]++;
playerstarts=true;
writetext(3);
}else{
pcwins[level]++;
playerstarts=false;
writetext(2);
}}else{
if(done>8){
draws[level]++;
playerstarts=!playerstarts;
writetext(1);
}else if(isplayer) pcturn();
}}

function pcrandom(){
do{
tmp=choices[Math.floor(Math.random()*9)];
}while(moves[tmp]!=0);
}

function pcturn(){
tmp='00';
pcstrategy(true);
if(tmp=='00')pcstrategy(false);
if(tmp=='00' && level>1)
	pcdontlose();
if(tmp=='00')
	pcrandom();
moves[tmp]=2;
game[done]=tmp;
document.getElementById('rc'+tmp).innerHTML="O";
document.getElementById('rc'+tmp).style.color="red";
done++;
findwinner(false);
}

window.onload=init;

window.onresize=function(){
  if(ns4)setTimeout('history.go(0)',400);
}
</script>


<table cellpadding="0" cellspacing="0" border="5" bordercolor="black" bordercolorlight="gray" bgcolor="white"><tr>
<td><div class="cell" id="rc11" onclick="setbutton(11)"></div></td>
<td><div class="cell" id="rc12" onclick="setbutton(12)"></div></td>
<td><div class="cell" id="rc13" onclick="setbutton(13)"></div></td>
</tr><tr>
<td><div class="cell" id="rc21" onclick="setbutton(21)"></div></td>
<td><div class="cell" id="rc22" onclick="setbutton(22)"></div></td>
<td><div class="cell" id="rc23" onclick="setbutton(23)"></div></td>
</tr><tr>
<td><div class="cell" id="rc31" onclick="setbutton(31)"></div></td>
<td><div class="cell" id="rc32" onclick="setbutton(32)"></div></td>
<td><div class="cell" id="rc33" onclick="setbutton(33)"></div></td>
</tr></table><br>

<form name="scores"><textarea name="scores2" cols="50" rows="6" ></textarea>

<br><br>
<input type="radio" name="level" id="level0" onclick="setlevel(0)"><span style="color: lime;">NIVEL 0 (la pc juega al azar)</span><br>
<input type="radio" name="level" id="level1" onclick="setlevel(1)" checked><span style="color: lime;">NIVEL 1 (la pc piensa la jugada)</span><br>
<input type="radio" name="level" id="level2" onclick="setlevel(2)"><span style="color: lime;">NIVEL 2 (tú puedes ganar<br>&emsp;solo si empiezas)</span><br>
<input type="radio" name="level" id="level3" onclick="setlevel(3)"><span style="color: lime;">NIVEL 3 (la pc nunca pierde,<br>&emsp;pero tú puedes empatar)</span><br>

</form>
