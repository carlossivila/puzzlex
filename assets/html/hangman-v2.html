    <style>
html, body {
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    text-align: left;
    background-color: #111;
    color: white;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
}

h3 {
    flex-shrink: 0;
    background-color: #111;
    z-index: 10;
    margin: 0;
    padding: 8px 8px 4px 8px;
}

#game-content {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 8px 8px;
}

#word-display {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin: 4px 0;
}

.letter-box {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.letter-char {
    font-size: 20px;
    font-weight: bold;
    min-width: 20px;
    text-align: center;
    color: white;
    line-height: 1.1;
}

.letter-char.blank {
    color: cyan;
}

.letter-underline {
    height: 3px;
    width: 100%;
    min-width: 20px;
    background-color: #555;
    border-radius: 2px;
    margin-top: 3px;
}

.letter-box.blank .letter-underline {
    background-color: cyan;
}

#timer {
    color: cyan;
    font-size: 24px;
    margin: 3px 0;
}

#timer.warning {
    color: red;
}

#counter {
    color: orange;
    font-size: 22px;
    margin: 3px 0;
}

#fail {
    color: red;
    font-size: 22px;
    margin: 3px 0;
}

#difficultyToggle {
    background-color: black;
    color: lime;
    border: 1px solid cyan;
    border-radius: 5px;
    padding: 5px 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 20px;
    transition: background-color 0.3s, color 0.3s, border-color 0.3s;
    margin-top: 4px;
}

#difficultyToggle:hover {
    background-color: #050505;
    color: red;
    border: 1px solid gray;
}

#difficultyToggle:active {
    background-color: #33F033;
    color: red;
    border: 1px solid black;
}

input {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
}

@media (max-width: 600px) {
    body {
        font-size: 22px;
    }
}
    </style>

    <script>
        let audioCtx = null;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        function playgood() {
            initAudio();
            const notas = [523.25, 587.33, 659.25, 783.99];
            const tiempos = [0, 0.15, 0.3, 0.45];
            
            notas.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime + tiempos[i]);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + tiempos[i] + 0.15);
                
                osc.start(audioCtx.currentTime + tiempos[i]);
                osc.stop(audioCtx.currentTime + tiempos[i] + 0.15);
            });
        }
        
        function playfail() {
            initAudio();
            const now = audioCtx.currentTime;
            [440, 392, 349.23, 293.66].forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.12, now + i * 0.15);
                gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.4);
                osc.start(now + i * 0.15);
                osc.stop(now + i * 0.15 + 0.45);
            });
        }
        
        function playlose() {
            initAudio();
            const now = audioCtx.currentTime;
            const notasDescendentes = [392, 349.23, 311.13, 293.66, 261.63];
            notasDescendentes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + i * 0.2);
                gainNode.gain.setValueAtTime(0.15, now + i * 0.2);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + i * 0.2 + 0.25);
                
                osc.start(now + i * 0.2);
                osc.stop(now + i * 0.2 + 0.25);
            });
            const oscFinal = audioCtx.createOscillator();
            const gainFinal = audioCtx.createGain();
            
            oscFinal.connect(gainFinal);
            gainFinal.connect(audioCtx.destination);
            
            oscFinal.type = 'sawtooth';
            oscFinal.frequency.setValueAtTime(130.81, now + 1.2);
            gainFinal.gain.setValueAtTime(0.2, now + 1.2);
            gainFinal.gain.exponentialRampToValueAtTime(0.01, now + 1.2 + 0.6);
            
            oscFinal.start(now + 1.2);
            oscFinal.stop(now + 1.2 + 0.6);
        }
        
        function playwin() {
            initAudio();
            const now = audioCtx.currentTime;
            const notasIniciales = [523.25, 587.33, 659.25, 783.99];
            notasIniciales.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.frequency.setValueAtTime(freq, now + i * 0.15);
                gainNode.gain.setValueAtTime(0.2, now + i * 0.15);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.15);
                
                osc.start(now + i * 0.15);
                osc.stop(now + i * 0.15 + 0.15);
            });
            const notasFinales = [880, 1046.5];
            notasFinales.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                const startTime = now + 0.75 + i * 0.15;
                osc.frequency.setValueAtTime(freq, startTime);
                gainNode.gain.setValueAtTime(0.25, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + 0.2);
                
                osc.start(startTime);
                osc.stop(startTime + 0.2);
            });
        }
    </script>

'SIAMÉS','SIESTA','SIGNO','SILOGISMO','SIMBIOSIS','SIMPLE','SIMULACIÓN','SINAGOGA','SINAPSIS','SINOPSIS','SINTAXIS','SINÓNIMO','SISMO','SISTEMA','SÍMBOLO','SÍNDROME','SÍNTOMA','SÉSAMO',
'SOBORNO','SOGA','SOFTWARE','SOKOBAN','SOLUCIÓN','SOL','SOLITARIO','SOMA','SONÁMBULO','SORTEO','SORTILIEGIO','SÓTANO','SOUVENIR','SUDOKU','SUDOR','SULTÁN','SUPERFICIAL','SUSPENSO','SUTURA',
'SUTIL','TABACO','TABÚ','TANGENTE','TANGRAM','TANQUE','TANATOFOBIA','TAQUILLA','TARDE','TARDÍGRADO','TARTA','TAXONOMÍA','TAXÓN','TECLA','TELEFÉRICO','TELESCOPIO','TEMPLO','TENIA','TENUE',
'TEMPERAMENTO','TENDENCIA','TEQUILA','TERAPIA','TERCIOPELO','TESTAFERRO','TETRIS','TEXTIL','TEXTO','TEXTURA','TIEMPO','TIARA','TICKET','TIMAR','TIMBALES','TIMO','TINTA','TINTORERÍA','TIPO',

'TROFEO','TROMPETA','TROMPO','TRUEQUE','TSUNAMI','TULIPANES','TUMOR','TUPÉ','TURISTA','UMBANDA','UMBRAL','UNICORNIO','URBE','UFOLOGÍA','UTOPÍA','VACUNA','VACUNO','VAGABUNDO','VAINILLA',
'VAJILLA','VALIJA','VALOR','VÁLVULA','VAMPIRO','VANIDAD','VANGUARDIA','VAPOR','VASELINA','VASIJA','VEINTE','VEINTIUNO','VELERO','VENGANZA','VENTA','VENTAJA','VERAZ','VERDUGO',
'VERGÜENZA','VERSO','VERSIÓN','VÉRTEBRA','VERTEBRADO','VERTIENTE','VÉRTICE','VESTÍBULO','VÍA','VIAGRA','VID','VIDRIO','VIGA','VIGENTE','VIGOR','VILLANO','VINAGRE','VINO',
'VINTAGE','VIOLACIÓN','VIRGEN','VÉRTIGO','VITAMINA','VIUDO','VIVAZ','VODKA','VOLCÁN','VOLANTE','VOLTAJE','VOLTIO','VOLUMEN','VÓMITO','VIRUS','VISIÓN','VUDÚ','WHISKY',
'XILÓFONO','YAKUZA','YATE','YERNO','YOGA','ZAR','ZARIGÜEYA','ZAMBA','ZÓCALO','ZOMBIE'
];

let mode = 'easy';
let score = 0, errors = 9, goal = 99;
let timerSec = 59, timerInterval = null;
let currentWord = '', hiddenIndexes = [], currentHiddenIdx = 0;
let shuffledWords = [], wordIndex = 0;
let gameActive = false;
let isTransitioning = false;

const timerEl     = document.getElementById('timer');
const counterEl   = document.getElementById('counter');
const failEl      = document.getElementById('fail');
const wordEl      = document.getElementById('word-display');
const hiddenInput = document.getElementById('hiddenInput');

function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function normalize(str) {
    return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
}

function updateHUD() {
    counterEl.textContent = `Aciertos: ${score} de ${goal}`;
    failEl.textContent = `Fallos: ${errors}`;
}

function startTimer() {
    clearInterval(timerInterval);
    timerSec = 59;
    timerEl.textContent = '00:59';
    timerEl.classList.remove('warning');
    timerInterval = setInterval(() => {
        timerSec--;
        const m = String(Math.floor(timerSec / 60)).padStart(2, '0');
        const s = String(timerSec % 60).padStart(2, '0');
        timerEl.textContent = `${m}:${s}`;
        if (timerSec <= 8) timerEl.classList.add('warning');
        if (timerSec <= 0) {
            clearInterval(timerInterval);
            onTimeout();
        }
    }, 1000);
}

function stopTimer() { clearInterval(timerInterval); }

function pickHidden(word) {
    const eligible = [...Array(word.length).keys()].filter(i => i !== 0 && i !== word.length - 1);
    if (eligible.length === 0) return [Math.floor(word.length / 2)];
    return shuffle(eligible).slice(0, 1);
}

function renderWord() {
    wordEl.innerHTML = '';
    for (let i = 0; i < currentWord.length; i++) {
        const isHidden = hiddenIndexes.includes(i);
        const box = document.createElement('div');
        box.className = 'letter-box' + (isHidden ? ' blank' : '');
        box.id = 'lb-' + i;

        const ch = document.createElement('div');
        ch.className = 'letter-char' + (isHidden ? ' blank' : '');
        ch.id = 'lc-' + i;
        ch.textContent = isHidden ? '_' : currentWord[i];

        const ul = document.createElement('div');
        ul.className = 'letter-underline';

        box.appendChild(ch);
        box.appendChild(ul);
        wordEl.appendChild(box);
    }
}

function loadWord() {
    if (wordIndex >= shuffledWords.length) {
        shuffledWords = shuffle(words);
        wordIndex = 0;
    }
    currentWord = shuffledWords[wordIndex++];
    hiddenIndexes = pickHidden(currentWord);
    currentHiddenIdx = 0;
    renderWord();
    startTimer();
}

function handleKey(key) {
    if (!gameActive || isTransitioning) return;
    const k = normalize(key);
    if (k.length !== 1 || !/[A-Z]/.test(k)) return;

    const idx = hiddenIndexes[currentHiddenIdx];
    const expected = normalize(currentWord[idx]);

    if (k === expected) {
        document.getElementById('lc-' + idx).textContent = currentWord[idx];
        document.getElementById('lc-' + idx).classList.remove('blank');
        document.getElementById('lb-' + idx).classList.remove('blank');
        currentHiddenIdx++;

        if (currentHiddenIdx >= hiddenIndexes.length) {
            score++;
            errors = 9;
            updateHUD();
            stopTimer();
            if (score >= goal) {
                gameActive = false;
                playwin();
                setTimeout(() => {
                    alert('¡Ganaste!');
                    resetGame();
                }, 1000);
                return;
            }
            playgood();
            isTransitioning = true;
            setTimeout(() => {
                isTransitioning = false;
                loadWord();
            }, 400);
        }
    } else {
        errors--;
        updateHUD();
        playfail();
        if (errors <= 0) {
            gameActive = false;
            stopTimer();
            playlose();
            setTimeout(() => {
                alert(`¡Perdiste, era: "${currentWord}"!`);
                resetGame();
            }, 1000);
        }
    }
}

function onTimeout() {
    gameActive = false;
    playlose();
    setTimeout(() => {
        alert(`¡Perdiste, se te acabó el tiempo, era: "${currentWord}"!`);
        resetGame();
    }, 1000);
}

function resetGame() {
    score = 0; errors = 9;
    isTransitioning = false;
    updateHUD();
    shuffledWords = shuffle(words);
    wordIndex = 0;
    gameActive = true;
    loadWord();
    hiddenInput.value = '';
    hiddenInput.focus();
}

document.getElementById('difficultyToggle').addEventListener('click', function () {
    if (mode === 'easy') {
        mode = 'hard';
        goal = 199;
        this.textContent = 'Difícil / Fácil';
    } else {
        mode = 'easy';
        goal = 99;
        this.textContent = 'Fácil / Difícil';
    }
    stopTimer();
    resetGame();
});

document.addEventListener('keydown', e => {
    if (e.key.length === 1 && document.activeElement !== hiddenInput) handleKey(e.key);
});

let processingInput = false;
hiddenInput.addEventListener('input', () => {
    if (processingInput) return;
    processingInput = true;
    const val = hiddenInput.value;
    hiddenInput.value = '';
    if (val.length > 0) {
        handleKey(val[val.length - 1]);
    }
    processingInput = false;
});

document.addEventListener('click', () => {
    if (gameActive) hiddenInput.focus();
});

document.addEventListener('touchstart', () => {
    if (gameActive) { hiddenInput.value = ''; hiddenInput.focus(); }
}, { passive: true });

document.addEventListener('contextmenu', e => e.preventDefault());

resetGame();
</script>
