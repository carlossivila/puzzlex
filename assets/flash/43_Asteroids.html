<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: #1a1a2e;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        overflow: hidden;
        padding-top: 5px;
    }

    .game-wrapper {
        display: flex;
        justify-content: center;
        align-items: flex-start; 
        width: 100%;
        height: 100vh;
        padding: 10px;
        margin-top: 0;
    }

    #ruffle-embed {
        width: 780px;
        height: 580px;
        border: 2px solid #444;
        border-radius: 8px;
        background: #000;
        box-shadow: 0 0 30px rgba(0, 150, 255, 0.15);
        flex-shrink: 0;
        margin-top: 5px;
    }

    @media (max-width: 1024px) {
        #ruffle-embed {
            width: 880px;
            height: 680px;
        }
    }

    @media (max-width: 900px) {
        .game-wrapper {
            padding: 5px;
        }
        
        #ruffle-embed {
            width: 95vw;
            height: calc(95vw * (680 / 880));
            max-height: 85vh;
            margin-top: 5px;
        }
    }

    @media (max-width: 600px) {
        #ruffle-embed {
            width: 98vw;
            height: calc(98vw * (680 / 880));
            max-height: 80vh;
            border-width: 1px;
            border-radius: 4px;
            margin-top: 5px;
        }
    }

    @media (max-height: 500px) and (orientation: landscape) {
        #ruffle-embed {
            height: 85vh;
            width: calc(85vh * (880 / 680));
            max-width: 98vw;
            margin-top: 5px;
        }
    }

    .dpad-container {
        display: none;
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        background: rgba(0, 0, 0, 0.4);
        padding: 18px 22px 22px 22px;
        border-radius: 28px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        border: 1px solid rgba(255, 255, 255, 0.08);
    }

    @media (max-width: 1024px) {
        .dpad-container {
            display: block;
        }
    }

    .dpad-grid {
        display: grid;
        grid-template-columns: 80px 80px 80px;
        grid-template-rows: 80px 80px 80px;
        gap: 6px;
        justify-items: center;
        align-items: center;
    }

    .dpad-btn {
        width: 100%;
        height: 100%;
        border: none;
        border-radius: 5px;
        font-size: 38px;
        font-weight: bold;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        touch-action: none;
        transition: transform 0.08s ease, box-shadow 0.08s ease;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
        background-color: #a8e6a3;
        color: #1e5e1e;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        -webkit-tap-highlight-color: transparent;
    }

    .dpad-btn:active {
        transform: scale(0.92);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.25);
    }

    .btn-up { grid-column: 2; grid-row: 1; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-space {
        grid-column: 2;
        grid-row: 2;
        background-color: #b5eab0;
        font-size: 34px;
    }
    .btn-right { grid-column: 3; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 3; }

    .btn-space .space-symbol {
        font-size: 40px;
        line-height: 1;
        transform: scale(1.1);
        display: inline-block;
    }

    .dpad-btn .arrow {
        display: inline-block;
        line-height: 1;
        transform: scale(1.2);
    }

    .dpad-btn {
        font-family: 'Segoe UI', 'Arial Unicode MS', sans-serif;
    }

    @media (max-width: 500px) {
        .dpad-grid {
            grid-template-columns: 65px 65px 65px;
            grid-template-rows: 65px 65px 65px;
            gap: 5px;
        }
        .dpad-btn {
            font-size: 30px;
        }
        .btn-space .space-symbol {
            font-size: 32px;
        }
        .dpad-container {
            padding: 10px 10px 14px 10px;
            bottom: 10px;
            border-radius: 20px;
        }
    }

    @media (max-width: 380px) {
        .dpad-grid {
            grid-template-columns: 55px 55px 55px;
            grid-template-rows: 55px 55px 55px;
            gap: 4px;
        }
        .dpad-btn {
            font-size: 24px;
            border-radius: 4px;
        }
        .btn-space .space-symbol {
            font-size: 26px;
        }
        .dpad-container {
            padding: 8px 8px 10px 8px;
            bottom: 8px;
        }
    }
</style>
</head>
<body>

<div class="game-wrapper">
    <embed src="43_Asteroids.swf" width="780" height="580" id="ruffle-embed">
</div>

<div class="dpad-container" id="dpadContainer">
    <div class="dpad-grid">
        <button class="dpad-btn btn-up" data-key="ArrowUp" data-code="ArrowUp" data-keycode="38">
            <span class="arrow">▲</span>
        </button>
        <button class="dpad-btn btn-left" data-key="ArrowLeft" data-code="ArrowLeft" data-keycode="37">
            <span class="arrow">◀</span>
        </button>
        <button class="dpad-btn btn-space" data-key=" " data-code="Space" data-keycode="32">
            <span class="space-symbol">␣</span>
        </button>
        <button class="dpad-btn btn-right" data-key="ArrowRight" data-code="ArrowRight" data-keycode="39">
            <span class="arrow">▶</span>
        </button>
        <button class="dpad-btn btn-down" data-key="ArrowDown" data-code="ArrowDown" data-keycode="40">
            <span class="arrow">▼</span>
        </button>
    </div>
</div>

<script>
    (function() {
        'use strict';

        function getRuffleEmbed() {
            let ruffle = document.querySelector('ruffle-embed');
            if (ruffle) return ruffle;
            return document.querySelector('embed');
        }

        function sendKeyEvent(key, code, keyCode, type) {
            const ruffleEmbed = getRuffleEmbed();
            if (!ruffleEmbed) {
                console.warn('No se encontró el embed de Ruffle');
                return;
            }

            try {
                ruffleEmbed.focus();
            } catch (_) { /* ignore */ }

            const event = new KeyboardEvent(type, {
                key: key,
                code: code,
                keyCode: keyCode,
                which: keyCode,
                bubbles: true,
                cancelable: true,
                composed: true
            });

            ruffleEmbed.dispatchEvent(event);
        }

        const buttons = document.querySelectorAll('.dpad-btn');

        buttons.forEach(btn => {
            const key = btn.getAttribute('data-key');
            const code = btn.getAttribute('data-code');
            const keyCode = parseInt(btn.getAttribute('data-keycode'), 10);

            if (!key || !code || isNaN(keyCode)) {
                console.warn('Botón sin datos válidos:', btn);
                return;
            }

            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                sendKeyEvent(key, code, keyCode, 'keydown');
            });

            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                sendKeyEvent(key, code, keyCode, 'keyup');
            });

            btn.addEventListener('touchcancel', (e) => {
                e.preventDefault();
                sendKeyEvent(key, code, keyCode, 'keyup');
            });

            btn.addEventListener('mousedown', (e) => {
                e.preventDefault();
                sendKeyEvent(key, code, keyCode, 'keydown');
            });

            btn.addEventListener('mouseup', (e) => {
                e.preventDefault();
                sendKeyEvent(key, code, keyCode, 'keyup');
            });

            btn.addEventListener('focus', (e) => e.preventDefault());
        });

        console.log('✅ D-pad cargado con botones en cruz y espacio central (visible solo en móviles)');
        console.log('📐 Tamaño embed: PC=780x580, Móvil=880x680 (escalado responsive)');
    })();
</script>

</body>
</html>
