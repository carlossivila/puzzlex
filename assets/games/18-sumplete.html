<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PuzzleX - sumplete</title>
<style>
    body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: #111;
        margin: 0;
        padding: 20px;
    }


    h2 {
       color: lime;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(4, 60px);
        gap: 2px;
        margin: 10px;
        background-color: #333;
        padding: 2px;
        border-radius: 5px;
    }

    .cell {
        width: 60px;
        height: 60px;
        background-color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 24px;
        cursor: pointer;
        user-select: none;
        transition: background-color 0.3s;
    }

    .cell.target {
        background-color: #ddd;
        font-weight: bold;
    }

    .cell.selected {
        background-color: #90EE90;
    }

    .controls {
        margin: 10px;
    }

    button {
       font-size: 20px;
       margin: 7px;
       background-color: black;
       color: lime;
       border: 1px solid cyan;
       border-radius: 5px;
       padding: 5px 5px;
       cursor: pointer;
       transition: background-color 0.3s, color 0.3s, border-color 0.3s;
   }

    button:hover {
       background-color: #050505;
       color: red;
       border: 1px solid gray;
   }

    button:active {
       background-color: #33F033;
       color: red;
       border: 1px solid black;
   }

a:link,a:visited {
text-decoration: none;
color: lime;
}
a:hover {
text-decoration: none;
color: red;
}

</style>
</head>
<body>

<h2>PuzzleX by Carlos Sivila</h2>

    <div id="game-grid" class="grid"></div>
    <div class="controls">
        <button onclick="checkSolution()">Verificar</button>
        <button onclick="showSolution()">Solución</button>
    </div>
    <div id="counter" style="color: lime; font-size: 20px; margin-top: 5px;">0 de 25 aciertos</div>

<script>

const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new AudioContext();
    }
}

function playAcierto() {
    initAudio();
    const notas = [523.25, 587.33, 659.25, 783.99];
    const tiempos = [0, 0.15, 0.3, 0.45];
    
    notas.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime + tiempos[i]);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + tiempos[i] + 0.15);
        
        osc.start(audioCtx.currentTime + tiempos[i]);
        osc.stop(audioCtx.currentTime + tiempos[i] + 0.15);
    });
}

function playFallo() {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(493.88, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(293.66, audioCtx.currentTime + 0.2);
    osc.frequency.setValueAtTime(261.63, audioCtx.currentTime + 0.3);
    
    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
    
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.6);
}

function playAcierto() {
    initAudio();
    const notas = [523.25, 587.33, 659.25, 783.99];
    const tiempos = [0, 0.15, 0.3, 0.45];
    
    notas.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime + tiempos[i]);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + tiempos[i] + 0.15);
        
        osc.start(audioCtx.currentTime + tiempos[i]);
        osc.stop(audioCtx.currentTime + tiempos[i] + 0.15);
    });
}

function playGanaste() {
    initAudio();
    const notas = [523.25, 587.33, 659.25, 783.99, 880.00, 987.77];
    const tiempos = [0, 0.12, 0.24, 0.36, 0.6, 0.85];
    const volumenes = [0.15, 0.17, 0.19, 0.21, 0.25, 0.3];
    
    notas.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(volumenes[i], audioCtx.currentTime + tiempos[i]);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + tiempos[i] + 0.2);
        
        osc.start(audioCtx.currentTime + tiempos[i]);
        osc.stop(audioCtx.currentTime + tiempos[i] + 0.2);
    });
}

let currentGrid = [];
let selectedCells = [];
let rowSums = [];
let colSums = [];
let solution = [];
let winCount = 0;

function generatePuzzle() {
    let grid = [];
    for (let i = 0; i < 3; i++) {
        let row = [];
        for (let j = 0; j < 3; j++) {
            row.push(Math.floor(Math.random() * 9) + 1);
        }
        grid.push(row);
    }

    let rSums = [];
    let cSums = [];
    let sol = Array(3).fill().map(() => Array(3).fill(false));

    // Sumas de filas
    for (let i = 0; i < 3; i++) {
        let sum = 0;
        for (let j = 0; j < 3; j++) {
            if (Math.random() < 0.7) {
                sum += grid[i][j];
                sol[i][j] = true;
            }
        }
        rSums.push(sum);
    }

    for (let j = 0; j < 3; j++) {
        let sum = 0;
        for (let i = 0; i < 3; i++) {
            if (sol[i][j]) {
                sum += grid[i][j];
            }
        }
        cSums.push(sum);
    }

    return {
        grid: grid,
        rowSums: rSums,
        colSums: cSums,
        solution: sol
    };
}

function createGrid() {
    const gameGrid = document.getElementById('game-grid');
    gameGrid.innerHTML = '';

    // Primera fila (sumas de columnas)
    for (let i = 0; i < 4; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell target';
        if (i < 3) {
            cell.textContent = colSums[i];
        }
        gameGrid.appendChild(cell);
    }

    for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 4; j++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            if (j < 3) {
                cell.textContent = currentGrid[i][j];
                cell.dataset.row = i;
                cell.dataset.col = j;
                cell.addEventListener('click', handleClick);
            } else {
                cell.className = 'cell target';
                cell.textContent = rowSums[i];
            }
            gameGrid.appendChild(cell);
        }
    }
}

function handleClick(event) {
    const cell = event.target;
    const row = parseInt(cell.dataset.row);
    const col = parseInt(cell.dataset.col);
    
    // Toggle selección
    const selectedIndex = selectedCells.findIndex(pos => 
        pos.row === row && pos.col === col
    );
    
    if (selectedIndex === -1) {
        selectedCells.push({row, col});
        cell.classList.add('selected');
    } else {
        selectedCells.splice(selectedIndex, 1);
        cell.classList.remove('selected');
    }
}

function checkSolution() {
    for (let i = 0; i < 3; i++) {
        let sum = 0;
        for (let j = 0; j < 3; j++) {
            if (selectedCells.some(pos => pos.row === i && pos.col === j)) {
                sum += currentGrid[i][j];
            }
        }
        if (sum !== rowSums[i]) {
            playFallo();
            alert('Inténtalo de nuevo');
            return;
        }
    }

    for (let j = 0; j < 3; j++) {
        let sum = 0;
        for (let i = 0; i < 3; i++) {
            if (selectedCells.some(pos => pos.row === i && pos.col === j)) {
                sum += currentGrid[i][j];
            }
        }
        if (sum !== colSums[j]) {
            playFallo();
            alert('Inténtalo de nuevo');
            return;
        }
    }

    playAcierto();
    winCount++;
    updateCounter();

if (winCount === 25) {
    playGanaste();
    alert('¡Ganaste!');
    return;
}

    newGame();
}

function showSolution() {
    selectedCells = [];

    const cells = document.querySelectorAll('.cell:not(.target)');
    cells.forEach(cell => {
        const row = parseInt(cell.dataset.row);
        const col = parseInt(cell.dataset.col);
        
        cell.classList.remove('selected');
        
        if (solution[row][col]) {
            cell.classList.add('selected');
        }
    });

    setTimeout(() => {
        cells.forEach(cell => {
            if (cell.dataset.row !== undefined) {
                cell.classList.remove('selected');
            }
        });
        selectedCells = [];
    }, 3000);
}

function newGame() {
    const puzzle = generatePuzzle();
    currentGrid = puzzle.grid;
    rowSums = puzzle.rowSums;
    colSums = puzzle.colSums;
    solution = puzzle.solution;
    selectedCells = [];
    createGrid();
}

function updateCounter() {
    document.getElementById('counter').textContent = `${winCount} de 25 aciertos`;
}

newGame();
</script>

<script>
document.addEventListener('contextmenu', function(e) {
e.preventDefault();
});
</script>

</body>
</html>
