<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PuzzleX - Wordle_x4</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: left;
            background-color: #111;
            margin-top: 5px;
        }

        h1 {
            font-size: 18px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 37px);
            gap: 5px;
            margin: 5px auto;
        }
        
        .cell {
            width: 37px;
            height: 37px;
            border: 2px solid #ccc;
            font-size: 22px;
            font-weight: bold;
            line-height: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        
        .correct {
            background-color: green;
            color: white;
        }
        
        .present {
            background-color: gold;
            color: white;
        }
        
        .absent {
            background-color: grey;
            color: white;
        }
        
        #counter {
            color: orange;
            font-size: 20px;
            margin: 3px 0;
            text-align: left;
        }

        #fail {
            color: red;
            font-size: 20px;
            margin: 3px 0;
            text-align: left;
        }
        
        #touchArea {
            width: 100%;
            height: 50px;
            margin: 5px 0;
            display: none;
        }
        
        input {
            position: absolute;
            left: -9999px;
            width: 1px;
            height: 1px;
        }

        a:link, a:visited {
            text-decoration: none;
            color: lime;
        }
        
        a:hover {
            text-decoration: none;
            color: red;
        }

        #difficultyToggle {
            background-color: black;
            color: lime;
            border: 1px solid cyan;
            border-radius: 5px;
            padding: 5px 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        #difficultyToggle:hover {
            background-color: #050505;
            color: red;
            border: 1px solid gray;
        }

        #difficultyToggle:active {
            background-color: #33F033;
            color: red;
            border: 1px solid black;
        }

        @media (max-width: 600px) {
            body {
                font-size: 20px;
                transform: scale(1.0);
                transform-origin: top left;
            }
        }
    </style>
</head>
<body>

<h1 style="color: lime; text-align: left;">PuzzleX by Carlos Sivila</h1>
<div id="grid" class="grid"></div>
<div id="touchArea"></div>
<input type="text" id="hiddenInput" maxlength="4" autocomplete="off">
<p id="message"></p>
<div style="display: flex;">
<div id="counter">Aciert: 0 de 15</div> &ensp; 
<div id="fail">Fall: 0 de 9</div></div>
<button id="difficultyToggle">Fácil / Difícil</button>

<script>
let audioCtx = null;
        
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playgood() {
    initAudio();
    const notas = [523.25, 587.33, 659.25, 783.99];
    const tiempos = [0, 0.15, 0.3, 0.45];
    
    notas.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime + tiempos[i]);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + tiempos[i] + 0.15);
        
        osc.start(audioCtx.currentTime + tiempos[i]);
        osc.stop(audioCtx.currentTime + tiempos[i] + 0.15);
    });
}

function playfail() {
    initAudio();
    const now = audioCtx.currentTime;
    [440, 392, 349.23, 293.66].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, now + i * 0.15);
        gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.4);
        osc.start(now + i * 0.15);
        osc.stop(now + i * 0.15 + 0.45);
    });
}

function playlose() {
    initAudio();
    const now = audioCtx.currentTime;

    const notasDescendentes = [392, 349.23, 311.13, 293.66, 261.63];
    notasDescendentes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + i * 0.2);
        gainNode.gain.setValueAtTime(0.15, now + i * 0.2);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + i * 0.2 + 0.25);
        
        osc.start(now + i * 0.2);
        osc.stop(now + i * 0.2 + 0.25);
    });

    const oscFinal = audioCtx.createOscillator();
    const gainFinal = audioCtx.createGain();
    
    oscFinal.connect(gainFinal);
    gainFinal.connect(audioCtx.destination);
    
    oscFinal.type = 'sawtooth';
    oscFinal.frequency.setValueAtTime(130.81, now + 1.2);
    gainFinal.gain.setValueAtTime(0.2, now + 1.2);
    gainFinal.gain.exponentialRampToValueAtTime(0.01, now + 1.2 + 0.6);
    
    oscFinal.start(now + 1.2);
    oscFinal.stop(now + 1.2 + 0.6);
}

function playwin() {
    initAudio();
    const now = audioCtx.currentTime;

    const notasIniciales = [523.25, 587.33, 659.25, 783.99];
    notasIniciales.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc.frequency.setValueAtTime(freq, now + i * 0.15);
        gainNode.gain.setValueAtTime(0.2, now + i * 0.15);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.15);
        
        osc.start(now + i * 0.15);
        osc.stop(now + i * 0.15 + 0.15);
    });

    const notasFinales = [880, 1046.5];
    notasFinales.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        const startTime = now + 0.75 + i * 0.15;
        osc.frequency.setValueAtTime(freq, startTime);
        gainNode.gain.setValueAtTime(0.25, startTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + 0.2);
        
        osc.start(startTime);
        osc.stop(startTime + 0.2);
    });
}

let words = [
"acre", "agua", "aire", "algo", "alma", "alud", "alto", "amar", "amor", "anca", "arca", "arco", "arma", "arpa", "arte", "asco", "asno", "auto", "ayer", "azar", "azul", 
"bajo", "bala", "base", "beso", "boca", "bola", "bote", "bota", "buey", 
"caja", "cama", "cana", "caos", "capa", "cara", "caro", "casa", "caso", "cata", "caza", "ceja", "cena", "cero", "cien", "cima", "cine", "cita", "club", "coco", "codo", "copa", "copo", "coro", "cosa", "cruz", "cubo", "cuna", "cura", 
"dado", "daga", "dama", "dedo", "dios", "diez", "doce", "doma", "domo", "dona", "duda", "duro", 
"faja", "fama", "faro", "fijo", "fino", "flor", "foca", "foco", "fosa", "foto", 
"gata", "gato", "gaza", "goma", "gota", "gris", 
"hija", "hijo", "higo", "hilo", "hoja", "hora", "hoyo", "humo", 
"idea", 
"joya", "jugo", 
"kata", "kilo", 
"lago", "laja", "lana", "lata", "lazo", "leer", "lino", "lira", "liso", "lobo", "loco", "lodo", "logo", "lomo", "lona", "loro", "losa", "loza", "luna", "lupa", "luto", 
"mago", "malo", "mano", "masa", "mayo", "mazo", "mesa", "meta", "miel", "miga", "modo", "mono", "moro", "moto", "mudo", "muro", "mozo", 
"nada", "nido", "nube", "nudo", "nota", 
"ocho", "ocre", "odio", "ogro", "oler", "olor", "olla", "onda", "once", "onza", 
"pago", "palo", "papa", "pata", "pato", "pena", "pera", "pelo", "peso", "piel", "pies", "pico", "pila", "pino", "pipa", "piso", "poco", "pozo", "puma", "puro", 
"rama", "raro", "rata", "rayo", "raza", "remo", "rico", "rifa", "rima", "risa", "rito", "rizo", "robo", "rojo", "ropa", "rosa", "roto", "rudo", "rulo", "ruso", "ruta", 
"saco", "sala", "sano", "sapo", "sebo", "seco", "seda", "seis", "soda", "soga", "soja", "solo", "sopa", "suma",  
"taco", "tapa", "taza", "tela", "timo", "tiza", "todo", "topo", "toro", "tres", "tubo", 
"vaca", "vara", "vaso", "veda", "vela", "vida", "vino", "vive", "vivo", "voto", 
"yoga", "yuyo", 
"zona", "zumo"
];

let selectedWord, attempts, wins = 0, fails = 0;
let currentInput = '';
let maxFallos = 9;
let difficultyMode = 'easy';
const hiddenInput = document.getElementById('hiddenInput');

function updateCounter() {
    document.getElementById('counter').textContent = `Aciert: ${wins} de 15`;
    document.getElementById('fail').textContent = `Fall: ${fails} de ${maxFallos}`;
}

function reiniciarJuego() {
    selectedWord = words[Math.floor(Math.random() * words.length)];
    attempts = 0;
    currentInput = '';
    document.getElementById('grid').innerHTML = '';
    createGrid();
    hiddenInput.value = '';
    document.getElementById('message').textContent = '';
}

function createGrid() {
    const grid = document.getElementById('grid');
    for (let i = 0; i < 6; i++) {
        for (let j = 0; j < 4; j++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            grid.appendChild(cell);
        }
    }
}

function updateCells() {
    const gridCells = document.querySelectorAll('.cell');
    const startIndex = attempts * 4;

    for (let i = 0; i < 4; i++) {
        const cell = gridCells[startIndex + i];
        cell.textContent = i < currentInput.length ? currentInput[i].toUpperCase() : '';
    }
}

function checkGuess(input) {
    const gridCells = document.querySelectorAll('.cell');
    const startIndex = attempts * 4;
    const correctWord = selectedWord;
    const guessArr = input.toLowerCase().split('');
    const result = [];

    for (let i = 0; i < 4; i++) {
        if (guessArr[i] === correctWord[i]) {
            result[i] = 'correct';
        } else {
            result[i] = 'absent';
        }
    }

    for (let i = 0; i < 4; i++) {
        if (result[i] !== 'correct' && correctWord.includes(guessArr[i])) {
            result[i] = 'present';
        }
    }

    for (let i = 0; i < 4; i++) {
        const cell = gridCells[startIndex + i];
        cell.classList.add(result[i]);
        cell.textContent = guessArr[i].toUpperCase();
    }

    attempts++;
    if (input.toLowerCase() === correctWord) {
        playgood();
        wins++;
        updateCounter();
        if (wins >= 15) {
            setTimeout(() => {
                playwin();
                alert('¡Ganaste!');
                wins = 0;
                updateCounter();
            }, 1000);
            return;
        }
        setTimeout(() => reiniciarJuego(), 500);
    } else if (attempts === 6) {
        playfail();
        fails++;
        updateCounter();
        if (fails >= maxFallos) {
            setTimeout(() => {
                playlose();
                alert('¡Perdiste!');
                wins = 0;
                fails = 0;
                updateCounter();
            }, 1000);
            return;
        }
        setTimeout(() => {
            alert('Perdiste, la respuesta era: ' + correctWord.toUpperCase());
            reiniciarJuego();
        }, 600);
    }
}

document.addEventListener('keydown', (e) => {
    if (attempts >= 6) return;

    if (e.key === 'Enter' && currentInput.length === 4) {
        checkGuess(currentInput);
        currentInput = '';
    } else if (e.key === 'Backspace') {
        currentInput = currentInput.slice(0, -1);
        updateCells();
    } else if (/^[a-zñ]$/i.test(e.key) && currentInput.length < 4) {
        currentInput += e.key.toLowerCase();
        updateCells();
    }
});

document.addEventListener('click', (e) => {
    if (window.innerWidth <= 600) {
        hiddenInput.focus();
    }
});

hiddenInput.addEventListener('input', (e) => {
    const value = e.target.value.toLowerCase().replace(/[^a-zñ]/g, '');
    currentInput = value.slice(0, 4);
    hiddenInput.value = value;
    updateCells();
});

hiddenInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && currentInput.length === 4) {
        checkGuess(currentInput);
        currentInput = '';
        hiddenInput.value = '';
        e.preventDefault();
    }
});

// Botón toggle de dificultad
document.getElementById('difficultyToggle').addEventListener('click', function() {
    if (difficultyMode === 'easy') {
        difficultyMode = 'difficult';
        maxFallos = 6;
        this.textContent = 'Difícil / Fácil';
    } else {
        difficultyMode = 'easy';
        maxFallos = 9;
        this.textContent = 'Fácil / Difícil';
    }
    updateCounter();
});

updateCounter();
reiniciarJuego();

if (window.innerWidth > 600) {
    document.addEventListener('DOMContentLoaded', () => {
        document.body.tabIndex = -1;
        document.body.focus();
    });
}
</script>

<script>
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });
</script>

</body>
</html>
