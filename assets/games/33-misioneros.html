<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misioneros y Caníbales</title>
<style>
  :root{
    --agua1:#1e6091;
    --agua2:#168aad;
    --acento:#e08e45;
    --texto:#f0f0f0;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    font-family:'Segoe UI', Tahoma, sans-serif;
    background:#111;
    color:var(--texto);
    padding:clamp(8px, 3vw, 20px);
  }

    h3{
        color: lime;
      }

  .escena{
    width:100%;
    max-width:600px;
  }
  .rio-contenedor{
    display:flex;
    align-items:flex-start;
    justify-content:flex-start;
    gap:clamp(4px, 2vw, 8px);
    width:100%;
  }
  .orilla{
    min-height:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:8px;
    flex-shrink:1;
    min-width:0;
  }
  .items{
    display:flex;
    flex-direction:row;
    gap:clamp(4px, 1.5vw, 8px);
    width:clamp(76px, 26vw, 104px);
    justify-content:flex-start;
  }
  .columna{
    display:flex;
    flex-direction:column;
    gap:clamp(4px, 1.5vw, 8px);
  }
  .rio{
    background:linear-gradient(180deg,var(--agua1),var(--agua2));
    border-radius:12px;
    min-height:clamp(70px, 22vw, 110px);
    width:clamp(100px, 34vw, 150px);
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:clamp(4px, 2vw, 10px);
    position:relative;
    overflow:hidden;
  }
  .rio::before, .rio::after{
    content:"";
    position:absolute;
    left:-10%;
    width:120%;
    height:3px;
    background:repeating-linear-gradient(90deg, rgba(255,255,255,0.4) 0 16px, transparent 16px 36px);
    animation:ola 3s linear infinite;
  }
  .rio::before{ top:20%; }
  .rio::after{ top:65%; animation-duration:4s; }
  @keyframes ola{
    from{ transform:translateX(0); }
    to{ transform:translateX(40px); }
  }
  .bote{
    width:clamp(90px, 30vw, 130px);
    min-height:clamp(45px, 15vw, 70px);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    z-index:2;
    transition:transform 0.6s ease;
    cursor:pointer;
  }
  .bote-emoji{
    font-size:clamp(1.5rem, 5.5vw, 2.2rem);
    line-height:1;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,0.35));
  }
  .bote.der{ transform:translateX(30px); }
  .bote.izq{ transform:translateX(-30px); }
  .bote.centro{ transform:translateX(0); }
  .item{
    width:clamp(34px, 11vw, 48px);
    height:clamp(34px, 11vw, 48px);
    background:#fff;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(1.05rem, 4vw, 1.5rem);
    cursor:pointer;
    box-shadow:0 3px 6px rgba(0,0,0,0.25);
    border:3px solid transparent;
    transition: all 0.15s ease;
    user-select:none;
  }
  .item:hover{ transform:scale(1.08); }
  .item.seleccionado{
    border-color:var(--acento);
    background:#fff3e0;
  }
  .item.enbote{
    width:clamp(26px, 8vw, 36px);
    height:clamp(26px, 8vw, 36px);
    font-size:clamp(0.8rem, 3vw, 1.1rem);
    box-shadow:none;
  }
  .item.enbote:hover{ transform:none; }
  .item.inactivo{
    cursor:default;
    opacity:0.55;
  }
  .controles{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    margin-top:6px;
  }
  .boton-reinicio {
    align-self: flex-start;
    margin-top: 0;
    font-size: clamp(18px, 5.5vw, 22px);
    padding: clamp(8px, 2.5vw, 10px) clamp(18px, 6vw, 26px);
    background: #ccc;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    touch-action: manipulation;
  }
  @media (max-width: 340px){
    .item{ width:28px; height:28px; font-size:0.85rem; }
    .item.enbote{ width:22px; height:22px; font-size:0.65rem; }
    .rio{ width:88px; min-height:60px; }
    .bote{ width:80px; min-height:40px; }
    .bote-emoji{ font-size:1.3rem; }
  }

        a:link,a:visited {
            text-decoration: none;
            color: lime;
            font-size: clamp(18px, 5.5vw, 22px);
            font-weight: bold;
        }

        a:hover {
            text-decoration: none;
            color: red;
        }

</style>
</head>
<body>
<br><br><br><br>
<h3>PuzzleX by Carlos Sivila</h3>
<div class="escena">
<div class="rio-contenedor">
<div class="orilla" id="orillaIzq">
<div class="items" id="itemsIzq"></div>
</div>
<div class="rio">
<div class="bote izq" id="bote">
<span class="bote-emoji">🚣</span>
<div id="boteSlots" style="display:flex; gap:4px;"></div>
</div>
</div>
<div class="orilla" id="orillaDer">
<div class="items" id="itemsDer"></div>
</div>
</div>
<div style="display:flex; align-items:center; gap:10px; margin-top:40px;">
<button class="boton-reinicio" id="btnReiniciar">🔄 Reiniciar</button>
<a href="https://www.youtube.com/watch?v=_DCm_lkpd6Y">solución</a>
</div>

<script>
  const PERSONAS = {
    m1: { emoji: '😇', nombre: 'Misionero', tipo: 'misionero' },
    m2: { emoji: '😇', nombre: 'Misionero', tipo: 'misionero' },
    m3: { emoji: '😇', nombre: 'Misionero', tipo: 'misionero' },
    c1: { emoji: '👹', nombre: 'Caníbal', tipo: 'canibal' },
    c2: { emoji: '👹', nombre: 'Caníbal', tipo: 'canibal' },
    c3: { emoji: '👹', nombre: 'Caníbal', tipo: 'canibal' }
  };
  const CAPACIDAD_BOTE = 2;

  let estado;

  const elItemsIzq = document.getElementById('itemsIzq');
  const elItemsDer = document.getElementById('itemsDer');
  const elBote = document.getElementById('bote');
  const elBoteSlots = document.getElementById('boteSlots');
  const btnReiniciar = document.getElementById('btnReiniciar');

  function reiniciar(){
    estado = {
      posiciones: { m1:'izq', m2:'izq', m3:'izq', c1:'izq', c2:'izq', c3:'izq' },
      ladoBote: 'izq',
      boteItems: [],
      terminado: false
    };
    render();
  }

  function crearItemEl(clave, enBote){
    const info = PERSONAS[clave];
    const div = document.createElement('div');
    div.className = 'item' + (enBote ? ' enbote' : '');
    div.title = info.nombre;
    div.textContent = info.emoji;

    if(estado.terminado){
      div.classList.add('inactivo');
      return div;
    }

    if(enBote){
      div.addEventListener('click', (e) => { e.stopPropagation(); toggleBote(clave); });
    } else {
      const mismoLadoQueBote = estado.posiciones[clave] === estado.ladoBote;
      const hayLugar = estado.boteItems.length < CAPACIDAD_BOTE;
      if(mismoLadoQueBote && hayLugar){
        div.addEventListener('click', (e) => { e.stopPropagation(); toggleBote(clave); });
      } else if(mismoLadoQueBote && !hayLugar){
        div.addEventListener('click', (e) => { e.stopPropagation(); });
        div.classList.add('inactivo');
      } else {
        div.classList.add('inactivo');
      }
    }
    return div;
  }

  function toggleBote(clave){
    if(estado.terminado) return;
    const idx = estado.boteItems.indexOf(clave);
    if(idx >= 0){
      estado.boteItems.splice(idx, 1);
    } else {
      if(estado.boteItems.length < CAPACIDAD_BOTE){
        estado.boteItems.push(clave);
      }
    }
    render();
  }

  function render(){
    elItemsIzq.innerHTML = '';
    elItemsDer.innerHTML = '';

    const colIzqMis = document.createElement('div');
    colIzqMis.className = 'columna';
    const colIzqCan = document.createElement('div');
    colIzqCan.className = 'columna';
    const colDerMis = document.createElement('div');
    colDerMis.className = 'columna';
    const colDerCan = document.createElement('div');
    colDerCan.className = 'columna';

    for(const clave in PERSONAS){
      const lado = estado.posiciones[clave];
      const enBote = estado.boteItems.includes(clave);
      if(enBote) continue;
      const el = crearItemEl(clave, false);
      const esMisionero = PERSONAS[clave].tipo === 'misionero';
      if(lado === 'izq'){
        (esMisionero ? colIzqMis : colIzqCan).appendChild(el);
      } else {
        (esMisionero ? colDerMis : colDerCan).appendChild(el);
      }
    }

    elItemsIzq.appendChild(colIzqMis);
    elItemsIzq.appendChild(colIzqCan);
    elItemsDer.appendChild(colDerMis);
    elItemsDer.appendChild(colDerCan);

    elBote.className = 'bote ' + (estado.boteItems.length > 0 ? 'centro' : estado.ladoBote);
    elBoteSlots.innerHTML = '';
    estado.boteItems.forEach(clave => {
      elBoteSlots.appendChild(crearItemEl(clave, true));
    });

    elBote.style.cursor = estado.terminado ? 'default' : 'pointer';
  }

  function verificarPeligro(lado){
    let misioneros = 0, canibales = 0;
    for(const clave in PERSONAS){
      if(estado.posiciones[clave] === lado){
        if(PERSONAS[clave].tipo === 'misionero') misioneros++;
        else canibales++;
      }
    }
    return misioneros > 0 && canibales > misioneros;
  }

  function cruzar(){
    if(estado.terminado) return;
    if(estado.boteItems.length === 0){
      alert('Debe ir al menos un misionero o caníbal en bote para cruzar');
      return;
    }

    const origen = estado.ladoBote;
    const destino = origen === 'izq' ? 'der' : 'izq';

    estado.boteItems.forEach(clave => {
      estado.posiciones[clave] = destino;
    });
    estado.boteItems = [];
    estado.ladoBote = destino;

    render();

    const peligroIzq = verificarPeligro('izq');
    const peligroDer = verificarPeligro('der');

    if(peligroIzq || peligroDer){
      estado.terminado = true;
      render();
      setTimeout(() => {
        alert('Perdiste, los caníbales se comieron a los misioneros');
        reiniciar();
      }, 1000);
      return;
    }

    const todosEnDer = Object.values(estado.posiciones).every(p => p === 'der');
    if(todosEnDer){
      estado.terminado = true;
      render();
      setTimeout(() => {
        alert('Ganaste');
        reiniciar();
      }, 1000);
    }
  }

  elBote.addEventListener('click', cruzar);
  btnReiniciar.addEventListener('click', reiniciar);

  reiniciar();
</script>
</body>
</html>
