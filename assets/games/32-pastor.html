<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Pastor y el Río</title>
<style>
  :root{
    --agua1:#1e6091;
    --agua2:#168aad;
    --tierra:#8d6e4d;
    --pasto:#4c9a4c;
    --panel:#f4e9d8;
    --acento:#e08e45;
    --texto:#f0f0f0;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    font-family:'Segoe UI', Tahoma, sans-serif;
    background:#111;
    color:var(--texto);
    padding:clamp(8px, 3vw, 20px);
  }

    h4{
        color: lime;
      }

  h1{
    margin:6px 0 2px;
    font-size:1.7rem;
    text-align:center;
  }
  .subtitulo{
    margin:0 0 14px;
    font-size:0.95rem;
    opacity:0.8;
    text-align:center;
    max-width:600px;
  }
  .escena{
    width:100%;
    max-width:600px;
    background:transparent;
    border-radius:0;
    padding:0;
  }
  .rio-contenedor{
    display:flex;
    align-items:flex-start;
    justify-content:flex-start;
    gap:clamp(4px, 2vw, 8px);
    width:100%;
    max-width:600px;
  }
  .orilla{
    background:transparent;
    border-radius:0;
    min-height:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:8px;
    position:relative;
  }
  .orilla-titulo{
    display:none;
  }
  .items{
    display:flex;
    flex-direction:column;
    gap:clamp(4px, 1.5vw, 8px);
    justify-content:flex-start;
    align-items:flex-start;
    flex:1;
  }
  .pastor-marker{
    position:absolute;
    bottom:6px;
    left:50%;
    transform:translateX(-50%);
    font-size:clamp(1.2rem, 4vw, 1.8rem);
  }
  .rio{
    background:linear-gradient(180deg,var(--agua1),var(--agua2));
    border-radius:12px;
    min-height:clamp(70px, 22vw, 110px);
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:clamp(4px, 2vw, 10px);
    position:relative;
    overflow:hidden;
  }
  .rio::before, .rio::after{
    content:"";
    position:absolute;
    left:-10%;
    width:120%;
    height:3px;
    background:repeating-linear-gradient(90deg, rgba(255,255,255,0.4) 0 16px, transparent 16px 36px);
    animation:ola 3s linear infinite;
  }
  .rio::before{ top:20%; }
  .rio::after{ top:65%; animation-duration:4s; }
  @keyframes ola{
    from{ transform:translateX(0); }
    to{ transform:translateX(40px); }
  }
  .bote{
    width:clamp(70px, 24vw, 110px);
    min-height:clamp(45px, 15vw, 70px);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    z-index:2;
    transition:transform 0.6s ease;
  }
  .bote-emoji{
    font-size:clamp(1.9rem, 7vw, 3rem);
    line-height:1;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,0.35));
  }
  .bote.der{ transform:translateX(30px); }
  .bote.izq{ transform:translateX(-30px); }
  .bote.centro{ transform:translateX(0); }
  .item{
    width:clamp(38px, 12vw, 52px);
    height:clamp(38px, 12vw, 52px);
    background:#fff;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(1.2rem, 4.5vw, 1.7rem);
    cursor:pointer;
    box-shadow:0 3px 6px rgba(0,0,0,0.25);
    border:3px solid transparent;
    transition: all 0.15s ease;
    user-select:none;
  }
  .item:hover{ transform:scale(1.08); }
  .item.seleccionado{
    border-color:var(--acento);
    background:#fff3e0;
  }
  .item.enbote{
    width:clamp(28px, 9vw, 40px);
    height:clamp(28px, 9vw, 40px);
    font-size:clamp(0.9rem, 3.5vw, 1.3rem);
    cursor:default;
    box-shadow:none;
  }
  .item.enbote:hover{ transform:none; }
  .slot{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .item.vacio{
    visibility:hidden;
  }
  .franja{
    width:60%;
    height:7px;
    border-radius:5px;
    background:rgba(255,255,255,0.55);
  }
  .controles{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    margin-top:6px;
  }
  .btn{
    background:var(--acento);
    border:none;
    color:#fff;
    padding:10px 22px;
    font-size:1rem;
    border-radius:30px;
    cursor:pointer;
    font-weight:bold;
    box-shadow:0 3px 8px rgba(0,0,0,0.25);
    transition:transform 0.1s ease, opacity 0.2s;
  }
  .btn:hover:not(:disabled){ transform:translateY(-2px); }
  .btn:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }
  .btn.secundario{
    background:#5b7a94;
  }
  .boton-reinicio {
    align-self: flex-start;
    margin-top: 0;
    font-size: clamp(18px, 5.5vw, 22px);
    padding: clamp(8px, 2.5vw, 10px) clamp(18px, 6vw, 26px);
    background: #ccc;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    touch-action: manipulation;
  }
  @media (max-width: 360px){
    .item{
      width:34px;
      height:34px;
      font-size:1.1rem;
    }
    .item.enbote{
      width:24px;
      height:24px;
      font-size:0.8rem;
    }
    .bote{ width:60px; min-height:40px; }
    .bote-emoji{ font-size:1.7rem; }
  }
  .instrucciones{
    max-width:820px;
    background:rgba(255,255,255,0.6);
    border-radius:12px;
    padding:12px 16px;
    margin-top:16px;
    font-size:0.85rem;
    line-height:1.5;
  }

        a:link,a:visited {
            text-decoration: none;
            color: lime;
            font-size: clamp(18px, 5.5vw, 22px);
            font-weight: bold;
        }

        a:hover {
            text-decoration: none;
            color: red;
        }

</style>
</head>
<body>

<h4>PuzzleX by Carlos Sivila</h4>
<div class="escena">
<div class="rio-contenedor">
<div class="orilla" id="orillaIzq">
<div class="orilla-titulo">ORILLA IZQUIERDA</div>
<div class="items" id="itemsIzq"></div>
</div>
<div class="rio">
<div class="bote izq" id="bote"></div>
</div>
<div class="orilla" id="orillaDer">
<div class="orilla-titulo">ORILLA DERECHA</div>
<div class="items" id="itemsDer"></div>
</div>
</div>
</div>
<div style="display:flex; align-items:center; gap:10px; margin-top:40px;">
<button class="boton-reinicio" id="btnReiniciar">🔄 Reiniciar</button>
<a href="https://www.youtube.com/shorts/mPL8_MkB4Hs">solución</a>
</div>


<script>
  const ITEMS = {
    lechuga: { emoji: '🥬', nombre: 'Lechuga' },
    oveja:   { emoji: '🐑', nombre: 'Oveja' },
    lobo:    { emoji: '🐺', nombre: 'Lobo' }
  };

  let estado; // se inicializa en reiniciar()

  const elItemsIzq = document.getElementById('itemsIzq');
  const elItemsDer = document.getElementById('itemsDer');
  const elBote = document.getElementById('bote');
  const btnReiniciar = document.getElementById('btnReiniciar');

  function reiniciar(){
    estado = {
      posiciones: { lobo:'izq', oveja:'izq', lechuga:'izq' },
      pastor: 'izq',
      boteItem: null,
      terminado: false
    };
    render();
  }

  function crearItemEl(clave, enBote, mostrar){
    const info = ITEMS[clave];
    const div = document.createElement('div');
    div.className = 'item' + (enBote ? ' enbote' : '');
    div.title = info.nombre;

    if(mostrar === false){
      // espacio reservado: no se ve el emoji, solo queda el hueco (y su franja debajo)
      div.classList.add('vacio');
      div.textContent = info.emoji;
      return div;
    }

    div.textContent = info.emoji;
    if(enBote){
      // el ítem que está en el bote también se puede tocar para bajarlo (deseleccionar)
      if(!estado.terminado){
        div.style.cursor = 'pointer';
        div.addEventListener('click', (e) => toggleBote(clave, e));
      }
    } else {
      const mismoLadoQuePastor = estado.posiciones[clave] === estado.pastor;
      if(mismoLadoQuePastor && !estado.terminado){
        div.style.cursor = 'pointer';
        div.addEventListener('click', (e) => toggleBote(clave, e));
      } else {
        div.style.cursor = 'default';
        div.style.opacity = '0.55';
      }
    }
    return div;
  }

  function crearSlot(clave, mostrar){
    const slot = document.createElement('div');
    slot.className = 'slot';
    const item = crearItemEl(clave, false, mostrar);
    slot.appendChild(item);
    const franja = document.createElement('div');
    franja.className = 'franja';
    slot.appendChild(franja);
    return slot;
  }

  function toggleBote(clave, evento){
    if(evento) evento.stopPropagation();
    if(estado.terminado) return;
    if(estado.boteItem === clave){
      estado.boteItem = null;
    } else {
      estado.boteItem = clave;
    }
    render();
  }

  function render(){
    elItemsIzq.innerHTML = '';
    elItemsDer.innerHTML = '';

    for(const clave in ITEMS){
      const lado = estado.posiciones[clave];
      const enBote = estado.boteItem === clave;
      elItemsIzq.appendChild(crearSlot(clave, lado === 'izq' && !enBote));
      elItemsDer.appendChild(crearSlot(clave, lado === 'der' && !enBote));
    }

    // bote
    elBote.className = 'bote ' + (estado.boteItem ? 'centro' : estado.pastor);
    elBote.innerHTML = '';
    const boteEmoji = document.createElement('span');
    boteEmoji.className = 'bote-emoji';
    boteEmoji.textContent = '🚣';
    elBote.appendChild(boteEmoji);
    if(estado.boteItem){
      const boteEl = crearItemEl(estado.boteItem, true);
      elBote.appendChild(boteEl);
    }

    elBote.style.cursor = estado.terminado ? 'default' : 'pointer';
  }

  function verificarPeligro(ladoRevisar){
    // detecta si el lobo se comió a la oveja y/o la oveja se comió a la lechuga en ese lado
    const enLado = clave => estado.posiciones[clave] === ladoRevisar;
    const loboComeOveja = enLado('lobo') && enLado('oveja');
    const ovejaComeLechuga = enLado('oveja') && enLado('lechuga');
    return { loboComeOveja, ovejaComeLechuga };
  }

  function cruzar(){
    if(estado.terminado) return;

    const origen = estado.pastor;
    const destino = origen === 'izq' ? 'der' : 'izq';

    // mover pastor
    estado.pastor = destino;

    // mover item si hay uno en el bote
    if(estado.boteItem){
      estado.posiciones[estado.boteItem] = destino;
      estado.boteItem = null;
    }

    // revisar peligro en la orilla que quedó SIN el pastor (origen)
    const peligro = verificarPeligro(origen);

    render();

    if(peligro.loboComeOveja || peligro.ovejaComeLechuga){
      estado.terminado = true;
      render();
      let mensaje;
      if(peligro.loboComeOveja && peligro.ovejaComeLechuga){
        mensaje = 'Perdiste, la oveja se comió a la lechuga y el lobo se comió a la oveja';
      } else if(peligro.loboComeOveja){
        mensaje = 'Perdiste, el lobo se comió a la oveja';
      } else {
        mensaje = 'Perdiste, la oveja se comió a la lechuga';
      }
      setTimeout(() => {
        alert(mensaje);
        reiniciar();
      }, 1000);
      return;
    }

    // revisar victoria
    const todosEnDer = Object.values(estado.posiciones).every(p => p === 'der') && estado.pastor === 'der';
    if(todosEnDer){
      estado.terminado = true;
      render();
      setTimeout(() => {
        alert('Ganaste');
        reiniciar();
      }, 1000);
    }
  }

  elBote.addEventListener('click', cruzar);
  btnReiniciar.addEventListener('click', reiniciar);

  reiniciar();
</script>
</body>
</html>
