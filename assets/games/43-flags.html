<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PuzzleX - banderas</title>
<style>
        body {
            background-color: #333;
            color: lime;
            font-family: Arial, sans-serif;
            padding: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            max-width: 360px;
            gap: 10px;
        }
        .grid-item {
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 30px;
            border: 2px solid transparent;
            border-radius: 3px;
            transition: border-color 0.3s ease;
        }
        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 2px;
        }
        .grid-item.correct {
            border-color: lime;
        }
        .grid-item.incorrect {
            border-color: red;
        }
        .hidden {
            visibility: hidden;
        }

a:link,a:visited {
text-decoration: none;
color: lime;
}
a:hover {
text-decoration: none;
color: red;
}

#difficultyToggle {
    background-color: black;
    color: lime;
    border: 1px solid cyan;
    border-radius: 5px;
    padding: 5px 10px;
    cursor: pointer;
    font-weight: bold;
    font-size: 20px;
    transition: background-color 0.3s, color 0.3s, border-color 0.3s;
}

#difficultyToggle:hover {
    background-color: #050505;
    color: red;
    border: 1px solid gray;
}

#difficultyToggle:active {
    background-color: #33F033;
    color: red;
    border: 1px solid black;
}

@media (max-width: 600px) {
  body {
    font-size: 20px;
    transform: scale(1.0);
    transform-origin: top left;
  }
}

</style>
</head>

<body>

<h3>PuzzleX by Carlos Sivila</h3><br>
<div id="random-box" style="margin-bottom: 15px; font-size: 20px; font-weight: bold; color: cyan;"></div>
<div id="grid" class="grid"></div><br>
<div id="score" style="font-family: arial black, arial; font-size: 20px; color: white;"> Aciertos: 0 de 36 | Fallos: 0 de 9 </div><br>
<button id="difficultyToggle">Fácil / Difícil</button><br>


<script>
const ciudades = [
    ["Argentina - Buenos Aires",             "https://flagcdn.com/w40/ar.png", false, 0],
    ["Chile - Santiago de Chile",            "https://flagcdn.com/w40/cl.png", false, 1],
    ["Bolivia - La Paz",                     "https://flagcdn.com/w40/bo.png", false, 2],
    ["Uruguay - Montevideo",                 "https://flagcdn.com/w40/uy.png", false, 3],
    ["Paraguay - Asunción",                  "https://flagcdn.com/w40/py.png", false, 4],
    ["Colombia - Bogotá",                    "https://flagcdn.com/w40/co.png", false, 5],
    ["Venezuela - Caracas",                  "https://flagcdn.com/w40/ve.png", false, 6],
    ["Cuba - Habana",                        "https://flagcdn.com/w40/cu.png", false, 7],
    ["Perú - Lima",                          "https://flagcdn.com/w40/pe.png", false, 8],
    ["Panamá - Ciudad de Panamá",            "https://flagcdn.com/w40/pa.png", false, 9],
    ["El Salvador - San Salvador",           "https://flagcdn.com/w40/sv.png", false, 10],
    ["República Dominicana - Santo Domingo", "https://flagcdn.com/w40/do.png", false, 11],
    ["Brasil - Brasilia",                    "https://flagcdn.com/w40/br.png", false, 12],
    ["México - Ciudad de México",            "https://flagcdn.com/w40/mx.png", false, 13],
    ["Estados Unidos - Washington",          "https://flagcdn.com/w40/us.png", false, 14],
    ["Canadá - Ottawa",                      "https://flagcdn.com/w40/ca.png", false, 15],
    ["Reino Unido - Londres",                "https://flagcdn.com/w40/gb.png", false, 16],
    ["España - Madrid",                      "https://flagcdn.com/w40/es.png", false, 17],
    ["Francia - París",                      "https://flagcdn.com/w40/fr.png", false, 18],
    ["Italia - Roma",                        "https://flagcdn.com/w40/it.png", false, 19],
    ["Rusia - Moscú",                        "https://flagcdn.com/w40/ru.png", false, 20],
    ["Alemania - Berlín",                    "https://flagcdn.com/w40/de.png", false, 21],
    ["Japón - Tokio",                        "https://flagcdn.com/w40/jp.png", false, 22],
    ["China - Pekín",                        "https://flagcdn.com/w40/cn.png", false, 23],
    ["Tailandia - Bangkok",                  "https://flagcdn.com/w40/th.png", false, 24],
    ["Egipto - El Cairo",                    "https://flagcdn.com/w40/eg.png", false, 25],
    ["Australia - Canberra",                 "https://flagcdn.com/w40/au.png", false, 26],
    ["India - Nueva Delhi",                  "https://flagcdn.com/w40/in.png", false, 27],
    ["Camerún - Yaundé",                     "https://flagcdn.com/w40/cm.png", false, 28],
    ["Nigeria - Abuya",                      "https://flagcdn.com/w40/ng.png", false, 29],
    ["Arabia Saudita - Riad",                "https://flagcdn.com/w40/sa.png", false, 30],
    ["Indonesia - Yakarta",                  "https://flagcdn.com/w40/id.png", false, 31],
    ["Turquía - Ankara",                     "https://flagcdn.com/w40/tr.png", false, 32],
    ["Corea del Sur - Seúl",                 "https://flagcdn.com/w40/kr.png", false, 33],
    ["Corea del Norte - Pionyang",           "https://flagcdn.com/w40/kp.png", false, 34],
    ["Países Bajos - Ámsterdam",             "https://flagcdn.com/w40/nl.png", false, 35]
];

let aciertos = 0;
let fallos = 0;
let currentPair = null;
let gameActive = true;
let audioCtx = null;
let maxFallos = 9;
let difficultyMode = 'easy';

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playgood() {
    initAudio();
    const notas = [523.25, 587.33, 659.25, 783.99];
    const tiempos = [0, 0.15, 0.3, 0.45];
    notas.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime + tiempos[i]);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + tiempos[i] + 0.15);
        osc.start(audioCtx.currentTime + tiempos[i]);
        osc.stop(audioCtx.currentTime + tiempos[i] + 0.15);
    });
}
function playfail() {
    initAudio();
    const now = audioCtx.currentTime;
    [440, 392, 349.23, 293.66].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, now + i * 0.15);
        gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.4);
        osc.start(now + i * 0.15);
        osc.stop(now + i * 0.15 + 0.45);
    });
}
function playlose() {
    initAudio();
    const now = audioCtx.currentTime;
    const notasDescendentes = [392, 349.23, 311.13, 293.66, 261.63];
    notasDescendentes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + i * 0.2);
        gainNode.gain.setValueAtTime(0.15, now + i * 0.2);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + i * 0.2 + 0.25);
        osc.start(now + i * 0.2);
        osc.stop(now + i * 0.2 + 0.25);
    });
    const oscFinal = audioCtx.createOscillator();
    const gainFinal = audioCtx.createGain();
    oscFinal.connect(gainFinal);
    gainFinal.connect(audioCtx.destination);
    oscFinal.type = 'sawtooth';
    oscFinal.frequency.setValueAtTime(130.81, now + 1.2);
    gainFinal.gain.setValueAtTime(0.2, now + 1.2);
    gainFinal.gain.exponentialRampToValueAtTime(0.01, now + 1.2 + 0.6);
    oscFinal.start(now + 1.2);
    oscFinal.stop(now + 1.2 + 0.6);
}
function playwin() {
    initAudio();
    const now = audioCtx.currentTime;
    const notasIniciales = [523.25, 587.33, 659.25, 783.99];
    notasIniciales.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(freq, now + i * 0.15);
        gainNode.gain.setValueAtTime(0.2, now + i * 0.15);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.15);
        osc.start(now + i * 0.15);
        osc.stop(now + i * 0.15 + 0.15);
    });
    const notasFinales = [880, 1046.5];
    notasFinales.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        const startTime = now + 0.75 + i * 0.15;
        osc.frequency.setValueAtTime(freq, startTime);
        gainNode.gain.setValueAtTime(0.25, startTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + 0.2);
        osc.start(startTime);
        osc.stop(startTime + 0.2);
    });
}

function mostrarElementoAleatorio() {
    const remainingCities = ciudades.filter(ciudad => !ciudad[2]);
    if (remainingCities.length === 0) return;
    const randomIndex = Math.floor(Math.random() * remainingCities.length);
    currentPair = remainingCities[randomIndex];
    document.getElementById('random-box').innerText = currentPair[0];
}

function mostrarGrilla() {
    const gridContainer = document.getElementById('grid');
    gridContainer.innerHTML = '';

    const remainingCities = ciudades.filter(ciudad => !ciudad[2]);

    const shuffled = remainingCities.sort(() => Math.random() - 0.5);

    shuffled.forEach((ciudad) => {
        const div = document.createElement('div');
        div.className = 'grid-item';
        div.innerHTML = `<img src="${ciudad[1]}" alt="${ciudad[0]}" data-id="${ciudad[3]}">`;
        div.onclick = () => verificarOpcion(ciudad[3]);
        gridContainer.appendChild(div);
    });
}

function verificarOpcion(ciudadId) {
    if (!gameActive) return;
    const selectedCity = ciudades[ciudadId];
    const clickedElement = document.querySelector(`[data-id="${ciudadId}"]`).parentElement;
    
    if (selectedCity[1] === currentPair[1]) {
        aciertos++;
        playgood();
        clickedElement.classList.add('correct');
        selectedCity[2] = true;
        
        setTimeout(() => {
            if (aciertos === 36) {
                playwin();
                setTimeout(() => {
                    alert('Ganaste 🏆');
                    location.reload();
                }, 1000);
            } else {
                mostrarElementoAleatorio();
                mostrarGrilla();
            }
        }, 1500);
        
    } else {
        fallos++;
        playfail();
        clickedElement.classList.add('incorrect');
        
        setTimeout(() => {
            clickedElement.classList.remove('incorrect');
        }, 500);
        
        if (fallos === maxFallos) {
            gameActive = false;
            setTimeout(() => {
                playlose();
                setTimeout(() => {
                    alert('Perdiste');
                    location.reload();
                }, 1000);
            }, 600);
        }
    }
    actualizarContador();
}

function actualizarContador() {
    document.getElementById('score').innerText = `Aciertos: ${aciertos} de 36 | Fallos: ${fallos} de ${maxFallos}`;
}

document.getElementById('difficultyToggle').addEventListener('click', function() {
    if (difficultyMode === 'easy') {
        difficultyMode = 'difficult';
        maxFallos = 6;
        this.textContent = 'Difícil / Fácil';
    } else {
        difficultyMode = 'easy';
        maxFallos = 9;
        this.textContent = 'Fácil / Difícil';
    }
    aciertos = 0;
    fallos = 0;
    gameActive = true;
    ciudades.forEach(c => c[2] = false);
    actualizarContador();
    mostrarElementoAleatorio();
    mostrarGrilla();
});

mostrarElementoAleatorio();
mostrarGrilla();
</script>

<script>
document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
});
</script>

</body>
</html>
