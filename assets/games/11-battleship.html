<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PuzzleX - acorazado</title>
    <style>
body {
    background-color: #111;
    background-image: url(https://c.tenor.com/8Juj0k-1L4AAAAAd/tenor.gif);
    background-size: cover;
    background-position: center;
    margin-top: 75px;
}

      h1 {
      font-size: 26px;
      }

.board {
    display: grid;
    grid-template-columns: repeat(9, 34px);
    gap: 3px;
    margin: 3px 3px;
}

.cell {
    background-color: gray;
    color: white;
    width: 34px;
    height: 34px;
    border: 1px solid lime;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.cell.hit {
    background-color: red;
}

.cell.miss {
    background-color: black;
}

.controls {
    margin: 5px 3px;
    font-size: 20px;
}

input {
    width: 34px;
    text-transform: uppercase;
}

.stats {
    margin: 3px 3px;
    font-size: 22px;
    font-weight: bold;
    color: red;
}

#hint {
    display: inline-block;
    margin-left: 0px;
    color: lime;
    font-size: 16px;
    font-family: monospace;
    text-shadow: 0px 0px 5px black,
                 0px 0px 10px black,
                 0px 0px 15px black,
                 0px 0px 20px black;
}


button {
    margin: 5px auto;
    padding: 5px 5px;
    font-size: 22px;
    background-color: #003300;
    color: lime;
    border: 1px solid gray;
    border-radius: 5px;
    transition: all 0.3s ease;
     }

button:hover {
    background-color: #009900;
    color: cyan;
    border: 1px solid cyan;
    text-shadow: 0 0 5px blue, 0 0 10px cyan;
    box-shadow: 0 0 15px cyan, 0 0 30px aqua;
     }

@keyframes explosion {
    0% {
        transform: scale(0);
        opacity: 1;
    }
    50% {
        transform: scale(1.5);
        opacity: 0.8;
    }
    100% {
        transform: scale(2);
        opacity: 0;
    }
}

.explosion {
    position: absolute;
    pointer-events: none;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: radial-gradient(circle, #ff8800, #ff0000);
    animation: explosion 0.8s ease-out forwards;
    z-index: 10;
}

.bt {
  display: inline-block;
  font-size: 22px;
  background-color: #009900;
  border: 1px solid gray;
  border-radius: 5px;
  transition: box-shadow 0.3s ease;
}

.bt:hover {
  border: 1px solid cyan;
  box-shadow: 0 0 15px cyan, 0 0 30px aqua;
}

a:link,a:visited {
text-decoration: none;
color: lime;
}
a:hover {
text-decoration: none;
color: red;
}

@media (max-width: 600px) {
  body {
    font-size: 24px;
    transform: scale(1.0);
    transform-origin: top left;
  }
}

</style>
</head>

<body>
<h1 style="color: lime; text-align: left;">PuzzleX by Carlos Sivila</h1>

<div id="board" class="board"></div>

<div class="controls">
  <input type="text" id="coordinate" maxlength="3" placeholder="A1">&emsp;
  <button onclick="checkCoordinate()">Lanzar misil</button>&emsp;
  <audio id="audio" src="sonar-radar.mp3" preload="auto" loop></audio>
   <button class="btn" id="snd">🔊</button>
<script>
    const audio = document.getElementById("audio");
    const sound = document.getElementById("snd");
    snd.addEventListener("click", function() {
        if (audio.paused) {
            audio.play();
            snd.textContent = "🔊";
        } else {
            audio.pause();
            snd.textContent = "🔇";
        }
    });
</script>
<br>
  <span id="hint"></span>
</div>

<div class="stats">
  Aciertos: <span id="hits">0</span> | 
  Fallos: <span id="misses">0</span> |
  : <span id="timer">07:59</span>
</div>

<script>
const BOARD_SIZE = 9;
const TARGET_COUNT = 9;
const MAX_MISSES = 50;
let hits = 0;
let misses = 0;
let gameOver = false;
let targetCells = [];
let timeLeft = 479;

function createExplosion(x, y) {

    const explosion = document.createElement('div');
    explosion.className = 'explosion';

    const boardRect = board.getBoundingClientRect();
    const xPos = x + boardRect.left - 50;
    const yPos = y + boardRect.top - 50;

    explosion.style.left = `${xPos}px`;
    explosion.style.top = `${yPos}px`;
    document.body.appendChild(explosion);

    setTimeout(() => {
        explosion.remove();
    }, 800);
}

function createMultipleExplosions(x, y) {
    for (let i = 0; i < 3; i++) {
        setTimeout(() => {
            const offsetX = x + (Math.random() * 100 - 50);
            const offsetY = y + (Math.random() * 100 - 50);
            createExplosion(offsetX, offsetY);
        }, i * 200);
    }
}

const board = document.getElementById('board');
const letters = 'ABCDEFGHI';

for(let i = 0; i < BOARD_SIZE; i++) {
  for(let j = 0; j < BOARD_SIZE; j++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.coord = `${letters[i]}${j+1}`;
    cell.textContent = `${letters[i]}${j+1}`;
    board.appendChild(cell);
  }
}

while(targetCells.length < TARGET_COUNT) {
  const coord = `${letters[Math.floor(Math.random() * BOARD_SIZE)]}${Math.floor(Math.random() * BOARD_SIZE) + 1}`;
  if(!targetCells.includes(coord)) {
    targetCells.push(coord);
  }
}

function getRandomHint() {

  const availableTargets = targetCells.filter(coord => {
    const cell = document.querySelector(`[data-coord="${coord}"]`);
    return !(cell.classList.contains('hit') || cell.classList.contains('miss'));
  });

  if (availableTargets.length === 0) {
    return '';
  }

  const randomTarget = availableTargets[Math.floor(Math.random() * availableTargets.length)];
  const row = randomTarget[0]; // Letra (fila)
  const col = randomTarget.slice(1); // Número (columna)

  if (Math.random() < 0.5) {
    return `Radar detect un buque en la fila ${row}`;
  } else {
    return `Radar detect un caza en la colum ${col}`;
  }
}

function checkCoordinate() {
  if(gameOver) return;
  
  const input = document.getElementById('coordinate');
  const coord = input.value.toUpperCase();

  if(!/^[A-I][1-9]$/.test(coord)) {
    alert('Por favor ingrese una coordenada válida (A1-I9)');
    input.value = '';
    return;
  }
  
  const cell = document.querySelector(`[data-coord="${coord}"]`);
  if(cell.classList.contains('hit') || cell.classList.contains('miss')) {
    alert('Esta celda ya fue seleccionada');
    input.value = '';
    return;
  }
  
  if(targetCells.includes(coord)) {
    cell.classList.add('hit');
    hits++;
    document.getElementById('hits').textContent = hits;
    createMultipleExplosions(cell.offsetLeft, cell.offsetTop);

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const duration = 0.5;

const bufferSize = audioCtx.sampleRate * duration;
const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
const data = buffer.getChannelData(0);

for (let i = 0; i < bufferSize; i++) {
  data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
}

const source = audioCtx.createBufferSource();
source.buffer = buffer;

const gainNode = audioCtx.createGain();
gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

source.connect(gainNode);
gainNode.connect(audioCtx.destination);
source.start();

    if(hits === TARGET_COUNT) {
      gameOver = true;
      alert('Ganaste 🏆');
      alert('¡Ganaste!');
    }
  } else {
    cell.classList.add('miss');
    misses++;
    document.getElementById('misses').textContent = misses;
    if(misses === MAX_MISSES) {
      gameOver = true;
      alert('¡Perdiste!');
      alert('¡Perdiste!');
    }
  }
  
  // Show random hint
  document.getElementById('hint').textContent = getRandomHint();
  
  input.value = '';
}

function updateTimer() {
  if (gameOver) return;

  const minutes = Math.floor(timeLeft / 60);
  const seconds = timeLeft % 60;
  document.getElementById('timer').textContent = 
    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

  timeLeft--;

  if (timeLeft < 0) {
    gameOver = true;
    alert('¡Perdiste, se te acabó el tiempo!');
  }
}

setInterval(updateTimer, 1000);

document.getElementById('coordinate').addEventListener('input', function(e) {
  this.value = this.value.replace(/[^a-iA-I0-9]/g, '').substr(0, 2);
});
</script>

<script>
document.addEventListener('contextmenu', function(e) {
e.preventDefault();
});
</script>

</body>
</html>
