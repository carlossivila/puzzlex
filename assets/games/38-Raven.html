let timer;
let timeRemaining = 45 * 60;

// Cargar las placas y sus opciones
function loadPlacas() {
    const quizContainer = document.getElementById("quiz-container");
    const letras = ['A', 'B', 'C', 'D', 'E'];  // Letras para las placas

    letras.forEach(letra => {
        const groupDiv = document.createElement("div");
        groupDiv.classList.add("group");  // Clase para el grupo de placas
        groupDiv.innerHTML = `<h4>Grupo de Placas ${letra}</h4>`;

        // Generamos las placas dentro de cada grupo (del 1 al 12)
        for (let i = 1; i <= 12; i++) {
            const placa = questions.find(q => q.placa === `${letra}${i}`);
            if (placa) {
                const placaDiv = document.createElement("div");
                placaDiv.classList.add("placa");
                placaDiv.classList.add("question");  // Agregar clase "question" aquí
                placaDiv.innerHTML = ` 
                    <h4>Placa ${placa.placa}</h4>
                    <img src="${placa.image}" alt="Placa ${placa.placa}"/>
                    <div class="options">
                        ${placa.options.map(option => ` 
                            <label>
                                <input type="radio" name="q${placa.placa}" value="${option}"> ${option}
                            </label>
                        `).join('')}
                    </div>
                `;
                groupDiv.appendChild(placaDiv);
            }
        }

        quizContainer.appendChild(groupDiv);
    });
}

// Llamar la función para cargar las preguntas cuando se cargue la página
window.onload = function() {
    loadPlacas();
    startTimer(); // Iniciar el temporizador al cargar la página
};

// Función para iniciar el temporizador
function startTimer() {
    timer = setInterval(function() {
        if (timeRemaining <= 0) {
            clearInterval(timer); // Detener el temporizador
            alert("¡Se acabó el tiempo!");
            calculateScore(); // Llamar a la función de puntuación cuando se termine el tiempo
        } else {
            timeRemaining--; // Reducir el tiempo restante
            updateTimerDisplay(); // Actualizar la visualización del tiempo
        }
    }, 1000);
}

// Función para actualizar la visualización del tiempo restante
function updateTimerDisplay() {
    const minutes = Math.floor(timeRemaining / 60);
    const seconds = timeRemaining % 60;
    const timeString = `${minutes}:${seconds < 10 ? '0' + seconds : seconds}`;

    // Mostrar el tiempo en la parte superior
    document.getElementById('timer-top').textContent = `Tiempo restante: ${timeString}`;

    // Mostrar el tiempo en la parte inferior
    document.getElementById('timer-bottom').textContent = `Tiempo restante: ${timeString}`;
}

// Función para calcular el puntaje final
function calculateScore() {
    clearInterval(timer); // Detener el temporizador cuando se hace clic en "COMPROBAR"
    
    let score = 0;

    questions.forEach((q, index) => {
        const selectedOption = document.querySelector(`input[name="q${q.placa}"]:checked`);

        // Verificar la respuesta del usuario
        if (selectedOption) {
            if (selectedOption.value === q.answer) {
                score++;
                selectedOption.parentNode.classList.add('correcto'); // Colorear la respuesta correcta
            } else {
                selectedOption.parentNode.classList.add('incorrecto'); // Colorear la respuesta incorrecta
            }
        }

        // Resaltar la opción correcta, independientemente de si el usuario acertó o no
        const correctOption = [...document.querySelectorAll(`input[name="q${q.placa}"]`)]
            .find(option => option.value === q.answer);
        if (correctOption) {
            correctOption.parentNode.classList.add('correcto');
        }
    });

    // Calcular el porcentaje de aciertos
    const percentage = (score / questions.length) * 100;
    const answerDiv = document.querySelector('.answer');
    answerDiv.innerHTML = `&nbsp;Acertaste ${score} de ${questions.length} - ${percentage.toFixed(2)}%`;
    answerDiv.style.display = 'block';
}

const playSound = function() {
    let element = document.createElement('div');
    element.setAttribute('style', 'display: none');
    element.innerHTML = `
      <audio autoplay>
        <source src="snd.mp3" type="audio/mpeg">
        <source src="snd.ogg" type="audio/ogg">
      </audio>
    `;
    document.body.appendChild(element);
    document.removeEventListener('click', playSound);
}

document.addEventListener('click', playSound);
