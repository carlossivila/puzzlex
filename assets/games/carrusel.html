body {
  margin: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  height: 100vh;
  width: 100vw;
  background: black;
  overflow: hidden;
  padding: 0;
}

.image-container {
  position: relative;
  width: 100px;
  height: 100px;
  transform-style: preserve-3d;
  transform: perspective(600px) rotateY(0deg);
  transition: transform 0.7s;
  margin-bottom: 50px;
}

.image-container span {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  transform: rotateY(calc(var(--i) * 45deg)) translateZ(120px);
  cursor: pointer;
}

.image-container span img {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 5px;
}

.video-label {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0, 0, 0, 0.8);
  color: white;
  padding: 5px 10px;
  border-radius: 5px;
  font-size: 12px;
  font-weight: bold;
  pointer-events: none;
  z-index: 10;
}

.btn-container {
  position: relative;
  width: 80%;
  display: flex;
  justify-content: space-between;
  padding: 0 20px;
  box-sizing: border-box;
}

.btn {
  background: green;
  color: lime;
  border: 1px solid green;
  padding: 10px 20px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
}

.btn:hover {
  background: lime;
  color: red;
  border: 1px solid cyan;
  filter: brightness(1.5);
}

.btn:active {
  background: lime;
  color: blue;
  border: 1px solid yellow;
  filter: brightness(1.5);
}

@media (orientation: landscape) {
  .image-container {
    width: 120px;
    height: 120px;
  }
  
  .image-container span {
    transform: rotateY(calc(var(--i) * 45deg)) translateZ(150px);
  }
}

function getYouTubeID(url) {
  const match = url.match(/[?&]v=([^&]+)/);
  return match ? match[1] : null;
}

function getRandomVideos() {
  const indices = [];
  const randomVideos = [];
  
  while (indices.length < 8) {
    const randomIndex = Math.floor(Math.random() * videos.length);
    if (!indices.includes(randomIndex)) {
      indices.push(randomIndex);
      randomVideos.push({
        url: videos[randomIndex],
        number: randomIndex + 1
      });
    }
  }
  
  return randomVideos;
}

const randomVideos = getRandomVideos();
const spans = document.querySelectorAll('.image-container span');

spans.forEach((span, index) => {
  const video = randomVideos[index];
  const videoID = getYouTubeID(video.url);
  const img = span.querySelector('img');
  const label = span.querySelector('.video-label');

  if (videoID) {
    img.src = `https://img.youtube.com/vi/${videoID}/mqdefault.jpg`;
  }

  label.textContent = `Video ${video.number}`;
  
  // Agregar evento de clic para abrir el video
  span.addEventListener('click', () => {
    window.open(video.url, '_blank');
  });
});

const imageContainer = document.querySelector(".image-container");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");

let x = 0;

prevBtn.addEventListener("click", () => {
  x = x + 45;
  rotate();
});

nextBtn.addEventListener("click", () => {
  x = x - 45;
  rotate();
});

function rotate() {
  imageContainer.style.transform = `perspective(600px) rotateY(${x}deg)`;
}

const refreshBtn = document.getElementById("refresh");

refreshBtn.addEventListener("click", () => {
  location.reload();
});
