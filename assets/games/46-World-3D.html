let audioCtx = null;
        
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playgood() {
    initAudio();
    const notas = [523.25, 587.33, 659.25, 783.99];
    const tiempos = [0, 0.15, 0.3, 0.45];
    
    notas.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime + tiempos[i]);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + tiempos[i] + 0.15);
        
        osc.start(audioCtx.currentTime + tiempos[i]);
        osc.stop(audioCtx.currentTime + tiempos[i] + 0.15);
    });
}

function playfail() {
    initAudio();
    const now = audioCtx.currentTime;
    [440, 392, 349.23, 293.66].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, now + i * 0.15);
        gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.4);
        osc.start(now + i * 0.15);
        osc.stop(now + i * 0.15 + 0.45);
    });
}

function playlose() {
    initAudio();
    const now = audioCtx.currentTime;

    const notasDescendentes = [392, 349.23, 311.13, 293.66, 261.63];
    notasDescendentes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + i * 0.2);
        gainNode.gain.setValueAtTime(0.15, now + i * 0.2);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + i * 0.2 + 0.25);
        
        osc.start(now + i * 0.2);
        osc.stop(now + i * 0.2 + 0.25);
    });

    const oscFinal = audioCtx.createOscillator();
    const gainFinal = audioCtx.createGain();
    
    oscFinal.connect(gainFinal);
    gainFinal.connect(audioCtx.destination);
    
    oscFinal.type = 'sawtooth';
    oscFinal.frequency.setValueAtTime(130.81, now + 1.2);
    gainFinal.gain.setValueAtTime(0.2, now + 1.2);
    gainFinal.gain.exponentialRampToValueAtTime(0.01, now + 1.2 + 0.6);
    
    oscFinal.start(now + 1.2);
    oscFinal.stop(now + 1.2 + 0.6);
}

function playwin() {
    initAudio();
    const now = audioCtx.currentTime;

    const notasIniciales = [523.25, 587.33, 659.25, 783.99];
    notasIniciales.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc.frequency.setValueAtTime(freq, now + i * 0.15);
        gainNode.gain.setValueAtTime(0.2, now + i * 0.15);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.15);
        
        osc.start(now + i * 0.15);
        osc.stop(now + i * 0.15 + 0.15);
    });

    const notasFinales = [880, 1046.5];
    notasFinales.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        const startTime = now + 0.75 + i * 0.15;
        osc.frequency.setValueAtTime(freq, startTime);
        gainNode.gain.setValueAtTime(0.25, startTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + 0.2);
        
        osc.start(startTime);
        osc.stop(startTime + 0.2);
    });
}

    const listaPaises60 = Object.values(paisesJuego);
    let paisesYaJugados = [];
    let ObjetivoActual = "";
    let intentosActuales = 0;
    let aciertos = 0;
    let fallos = 0;
    let tiempoRestante = 99;
    let temporizador = null;
    let paisesDeshabilitados = [];
    let polygonSeries;
    let juegoTerminado = false;
    let colorOriginalPaises = am5.color(0xc6a664);

    function pintarPais(polygon, color) {
        polygon._colorForzado = color;
        polygon.states.create("default", { fill: color });
        polygon.states.create("hover", { fill: color });
        polygon.set("fill", color);
    }

    function limpiarColor(polygon) {
        polygon._colorForzado = null;
        polygon.states.create("default", { fill: colorOriginalPaises });
        polygon.states.create("hover", { fill: am5.color(0xcccccc) });
        polygon.set("fill", colorOriginalPaises);
    }

    var root = am5.Root.new("chartdiv");
    root.setThemes([am5themes_Animated.new(root)]);

    var chart = root.container.children.push(am5map.MapChart.new(root, {
        panX: "rotateX",
        panY: "rotateY",
        projection: am5map.geoOrthographic(),
        paddingBottom: 20,
        paddingTop: 20,
        paddingLeft: 20,
        paddingRight: 20
    }));

    var backgroundSeries = chart.series.push(am5map.MapPolygonSeries.new(root, {}));
    backgroundSeries.mapPolygons.template.setAll({
        fill: am5.color(0xc6f2f4),
        fillOpacity: 1,
        strokeOpacity: 0
    });
    backgroundSeries.data.push({
        geometry: am5map.getGeoRectangle(90, 180, -90, -180)
    });

    polygonSeries = chart.series.push(am5map.MapPolygonSeries.new(root, {
        geoJSON: am5geodata_worldLow
    }));

    polygonSeries.mapPolygons.template.setAll({
        fill: am5.color(0xc6a664),
        tooltipText: "{name}",
        interactive: true,
        visible: true,
        forceHidden: false
    });

    polygonSeries.mapPolygons.template.states.create("hover", {
        fill: am5.color(0xcccccc)
    });



    polygonSeries.events.on("datavalidated", function() {
        polygonSeries.mapPolygons.each(function(polygon) {
            var nombreOriginal = polygon.dataItem.dataContext.name;
            if (paisesJuego[nombreOriginal]) {
                polygon.dataItem.dataContext.name = paisesJuego[nombreOriginal];
            } else if (traduccionesAdicionales[nombreOriginal]) {
                polygon.dataItem.dataContext.name = traduccionesAdicionales[nombreOriginal];
            }
        });
        iniciarJuego();
    });

    polygonSeries.mapPolygons.template.events.on("click", function(ev) {
        if (juegoTerminado) return;

        const target = ev.target;
        const nombrePais = target.dataItem.dataContext.name;

        if (paisesDeshabilitados.includes(nombrePais)) return;

        if (nombrePais === ObjetivoActual) {
            playgood();
            aciertos++;
            pintarPais(target, am5.color(0x00ff00));
            setTimeout(() => {
                limpiarColor(target);
                limpiarPaisesDeshabilitados();
                siguientePais();
            }, 2500);
        } else {
            playfail();
            paisesDeshabilitados.push(nombrePais);
            intentosActuales++;
            pintarPais(target, am5.color(0xffff00));

            if (intentosActuales >= 3) {
                fallos++;
                pintarPais(target, am5.color(0xff0000));

                let poligonoObjetivo = null;
                polygonSeries.mapPolygons.each(function(polygon) {
                    if (polygon.dataItem.dataContext.name === ObjetivoActual) {
                        poligonoObjetivo = polygon;
                    }
                });
                if (poligonoObjetivo && poligonoObjetivo !== target) {
                    pintarPais(poligonoObjetivo, am5.color(0x000000));
                }

                setTimeout(() => {
                    if (poligonoObjetivo && poligonoObjetivo !== target) {
                        limpiarColor(poligonoObjetivo);
                    }
                    limpiarPaisesDeshabilitados();
                    siguientePais();
                }, 2500);
            }
        }

        actualizarStats();
    });

    function limpiarPaisesDeshabilitados() {
        polygonSeries.mapPolygons.each(function(polygon) {
            const nombre = polygon.dataItem.dataContext.name;
            if (paisesDeshabilitados.includes(nombre)) {
                limpiarColor(polygon);
            }
        });
        paisesDeshabilitados = [];
    }

    function iniciarJuego() {
        elegirPaisAleatorio();
        iniciarTemporizador();
    }

    function elegirPaisAleatorio() {
        const disponibles = listaPaises60.filter(p => !paisesYaJugados.includes(p));
        if (disponibles.length === 0) {
            finalizarJuego();
            return;
        }
        const indice = Math.floor(Math.random() * disponibles.length);
        ObjetivoActual = disponibles[indice];
        paisesYaJugados.push(ObjetivoActual);
        document.getElementById('Objetivo').textContent = `🎯 ${ObjetivoActual}`;
        intentosActuales = 0;
        tiempoRestante = 99;
        actualizarStats();
    }

    function siguientePais() {
        clearInterval(temporizador);
        elegirPaisAleatorio();
        iniciarTemporizador();
    }

    function iniciarTemporizador() {
        clearInterval(temporizador);
        temporizador = setInterval(() => {
            tiempoRestante--;
            document.getElementById('timer').textContent = tiempoRestante;
            if (tiempoRestante <= 0) {
                clearInterval(temporizador);
                juegoTerminado = true;
                playlose();
                setTimeout(() => {
                    alert("Perdiste, se te acabó el tiempo");
                    resetearJuego();
                }, 1000);
            }
        }, 1000);
    }

    function actualizarStats() {
        document.getElementById('aciertos').textContent = aciertos;
        document.getElementById('fallos').textContent = fallos;
        document.getElementById('intentos').textContent = intentosActuales;
    }

    function finalizarJuego() {
        clearInterval(temporizador);
        juegoTerminado = true;
        const mitad = Math.ceil(listaPaises60.length / 2);
        if (aciertos >= mitad) {
            playwin();
            setTimeout(() => {
                alert(`¡Ganaste 🏆! ${aciertos} aciertos - ${fallos} fallos`);
                resetearJuego();
            }, 1000);
        } else {
            playlose();
            setTimeout(() => {
                alert(`¡Perdiste! ${aciertos} aciertos - ${fallos} fallos`);
                resetearJuego();
            }, 1000);
        }
    }

    function resetearJuego() {
        paisesYaJugados = [];
        ObjetivoActual = "";
        intentosActuales = 0;
        aciertos = 0;
        fallos = 0;
        tiempoRestante = 99;
        juegoTerminado = false;
        limpiarPaisesDeshabilitados();
        actualizarStats();
        document.getElementById('timer').textContent = 99;
        iniciarJuego();
    }

    chart.appear(1000, 100);
