<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PuzzleX - Snake</title>
    <style>
        body {
            background-color: black;
            color: lime;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 8px;
        }
        #game-board {
            display: grid;
            grid-template-columns: repeat(20, clamp(14px, 4.5vw, 20px));
            grid-template-rows: repeat(20, clamp(14px, 4.5vw, 20px));
            gap: 1px;
            background-color: black;
            width: min(400px, 96vw);
            margin: 0;
        }
        .cell {
            background-color: #111;
            border: 1px solid #222;
        }
        .snake-head {
            background-color: #008000;
        }
        .snake-body {
            background-color: #00A000;
        }
        .apple {
            background-color: #FF0000;
        }
        .obstacle {
            background-color: blue;
        }
    @font-face {
      font-family: 'font';
      src: url('font.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
        #score {
            text-align: left;
            font-size: 20px;
            margin-top: 10px;
            font-family: 'font', Arial, sans-serif;
        }
        button {
            background-color: lime;
            color: blue;
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            margin: 4px;
            font-size: 16px;
            cursor: pointer;
            touch-action: manipulation;
        }
        button:hover {
            border: solid cyan 1px;
            background-color: darkgreen;
        }
        #dpad {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
        }
        #dpad .dpad-row {
            display: flex;
            flex-direction: row;
        }
        #dpad button {
            width: 60px;
            height: 60px;
            font-size: 22px;
            margin: 3px;
            padding: 0;
        }
        @media (max-width: 768px) {
            #dpad {
                display: flex;
            }
        }
    </style>
</head>

<body>

<h2>PuzzleX by Carlos Sivila</h2>

    <div id="game-board"></div>
    <div id="score">Puntaje: 0 <span> de 60 </span></div>

<!-- D-pad para celular -->
<div id="dpad">
  <div class="dpad-row">
    <button id="btn-up">▲</button>
  </div>
  <div class="dpad-row">
    <button id="btn-left">◀</button>
    <button id="btn-down">▼</button>
    <button id="btn-right">▶</button>
  </div>
</div>

<script>
class SnakeGame {
    constructor() {
        this.boardWidth = 20;
        this.boardHeight = 20;
        this.board = [];
        this.snake = [];
        this.apple = null;
        this.obstacles = [];
        this.obstaclesActivated = false;
        this.obstaclesActivated2 = false;
        this.score = 0;
        this.direction = 'right';
        this.initBoard();
        this.createSnake();
        this.createApple();
        this.setupControls();
    }

    initBoard() {
        const gameBoard = document.getElementById('game-board');
        for (let y = 0; y < this.boardHeight; y++) {
            this.board[y] = [];
            for (let x = 0; x < this.boardWidth; x++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.dataset.x = x;
                cell.dataset.y = y;
                gameBoard.appendChild(cell);
                this.board[y][x] = cell;
            }
        }
    }

    createSnake() {
        this.snake = [
            {x: 2, y: 0},
            {x: 1, y: 0},
            {x: 0, y: 0}
        ];
        this.updateSnakeDisplay();
    }

    updateSnakeDisplay() {
        document.querySelectorAll('.snake-head, .snake-body').forEach(cell => {
            cell.classList.remove('snake-head', 'snake-body');
        });
        this.snake.forEach((segment, index) => {
            const cell = this.board[segment.y][segment.x];
            cell.classList.add(index === 0 ? 'snake-head' : 'snake-body');
        });
    }

    activateObstacles() {
        const coords = [
            {x:0,y:0},{x:1,y:0},{x:18,y:0},{x:19,y:0},
            {x:0,y:1},{x:19,y:1},
            {x:0,y:18},{x:19,y:18},
            {x:0,y:19},{x:1,y:19},{x:18,y:19},{x:19,y:19}
        ];
        coords.forEach(({x, y}) => {
            this.board[y][x].classList.add('obstacle');
            this.obstacles.push({x, y});
        });
        this.obstaclesActivated = true;
    }

    activateObstacles2() {
        const coords = [
            {x:9,y:8},{x:10,y:8},
            {x:9,y:9},{x:10,y:9}
        ];
        coords.forEach(({x, y}) => {
            this.board[y][x].classList.add('obstacle');
            this.obstacles.push({x, y});
        });
        this.obstaclesActivated2 = true;
    }

    createApple() {
        let x, y;
        do {
            x = Math.floor(Math.random() * this.boardWidth);
            y = Math.floor(Math.random() * this.boardHeight);
        } while (
            this.snake.some(seg => seg.x === x && seg.y === y) ||
            this.obstacles.some(obs => obs.x === x && obs.y === y)
        );
        this.apple = {x, y};
        this.board[y][x].classList.add('apple');
    }

    setupControls() {
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp':
                    if (this.direction !== 'down') this.direction = 'up';
                    break;
                case 'ArrowDown':
                    if (this.direction !== 'up') this.direction = 'down';
                    break;
                case 'ArrowLeft':
                    if (this.direction !== 'right') this.direction = 'left';
                    break;
                case 'ArrowRight':
                    if (this.direction !== 'left') this.direction = 'right';
                    break;
            }
        });
        this.gameLoop = setInterval(() => this.moveSnake(), 400);
    }

    moveSnake() {
        const head = {...this.snake[0]};
        switch(this.direction) {
            case 'up': head.y--; break;
            case 'down': head.y++; break;
            case 'left': head.x--; break;
            case 'right': head.x++; break;
        }

        if (head.x < 0 || head.x >= this.boardWidth ||
            head.y < 0 || head.y >= this.boardHeight) {
            alert('Perdiste');
            this.resetGame();
            return;
        }

        if (this.obstacles.some(obs => obs.x === head.x && obs.y === head.y)) {
            alert('Perdiste');
            this.resetGame();
            return;
        }

        if (this.snake.some(seg => seg.x === head.x && seg.y === head.y)) {
            alert('Perdiste');
            this.resetGame();
            return;
        }

        if (head.x === this.apple.x && head.y === this.apple.y) {
            this.score++;
            document.getElementById('score').textContent = `Puntaje: ${this.score} de 60`;
            this.board[this.apple.y][this.apple.x].classList.remove('apple');

            if (this.score === 20 && !this.obstaclesActivated) {
                this.activateObstacles();
            }
            if (this.score === 40 && !this.obstaclesActivated2) {
                this.activateObstacles2();
            }
            if (this.score === 60) {
                alert('¡Ganaste!');
                this.resetGame();
                return;
            }
            this.createApple();
        } else {
            this.snake.pop();
        }

        this.snake.unshift(head);
        this.updateSnakeDisplay();
    }

    resetGame() {
        clearInterval(this.gameLoop);
        this.score = 0;
        document.getElementById('score').textContent = 'Puntaje: 0 de 60';
        this.snake = [];
        this.apple = null;
        this.obstacles = [];
        this.obstaclesActivated = false;
        this.obstaclesActivated2 = false;
        document.querySelectorAll('.cell').forEach(cell => {
            cell.classList.remove('snake-head', 'snake-body', 'apple', 'obstacle');
        });
        this.createSnake();
        this.createApple();
        this.direction = 'right';
        this.setupControls();
    }
}

const game = new SnakeGame();

// D-pad controls para celular (click + touchstart)
function addDpadListener(id, dirName, opposite) {
    ['click', 'touchstart'].forEach(evt => {
        document.getElementById(id).addEventListener(evt, (e) => {
            e.preventDefault();
            if (game.direction !== opposite) game.direction = dirName;
        });
    });
}
addDpadListener('btn-up',    'up',    'down');
addDpadListener('btn-down',  'down',  'up');
addDpadListener('btn-left',  'left',  'right');
addDpadListener('btn-right', 'right', 'left');
</script>

</body>
</html>
