    <title>PuzzleX - Anagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #fff;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }

       h3 {
       color: lime; 
       text-align: left; 
       padding: 2px; 
       margin: 22px 8px;
       }

        .container {
            text-align: left;
            padding: 8px;
            max-width: 675px;
            width: 100%;
        }

        .word-container {
            display: flex;
            justify-content: flex-start;
            flex-wrap: wrap;
            gap: 2px;
            margin-bottom: 12px;
            min-height: 60px;
        }

        .letter-cell {
            width: 25px;
            height: 25px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #00ffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 10px #00ffff;
            color: #00ffff;
        }

        .letter-cell:hover {
            background: rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 20px #00ffff, 0 0 30px #00ffff;
            transform: scale(1.1);
        }

        .letter-cell.selected {
            background: rgba(255, 0, 255, 0.4);
            border-color: #ff00ff;
            box-shadow: 0 0 20px #ff00ff, 0 0 30px #ff00ff;
            color: #ff00ff;
        }

        .letter-cell.vowel {
            background: rgba(255, 255, 0, 0.12);
            border-color: #ffff00;
            box-shadow: 0 0 10px #ffff00;
            color: #ffff00;
            cursor: default;
        }

        .letter-cell.vowel:hover {
            background: rgba(255, 255, 0, 0.12);
            box-shadow: 0 0 10px #ffff00;
            transform: none;
        }

        .letter-cell.correct {
            background: rgba(0, 255, 0, 0.3);
            border-color: #00ff00;
            box-shadow: 0 0 20px #00ff00;
            color: #00ff00;
            animation: correctPulse 0.5s;
        }

        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .counter {
            font-size: 1.5em;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00;
            margin-bottom: 12px;
        }
</style>

<script>
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playgood() {
    initAudio();
    const notas = [523.25, 587.33, 659.25, 783.99];
    const tiempos = [0, 0.15, 0.3, 0.45];
    
    notas.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime + tiempos[i]);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + tiempos[i] + 0.15);
        
        osc.start(audioCtx.currentTime + tiempos[i]);
        osc.stop(audioCtx.currentTime + tiempos[i] + 0.15);
    });
}

function playwin() {
    initAudio();
    const now = audioCtx.currentTime;
    const notasIniciales = [523.25, 587.33, 659.25, 783.99];
    notasIniciales.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc.frequency.setValueAtTime(freq, now + i * 0.15);
        gainNode.gain.setValueAtTime(0.2, now + i * 0.15);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.15);
        
        osc.start(now + i * 0.15);
        osc.stop(now + i * 0.15 + 0.15);
    });
    const notasFinales = [880, 1046.5];
    notasFinales.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        const startTime = now + 0.75 + i * 0.15;
        osc.frequency.setValueAtTime(freq, startTime);
        gainNode.gain.setValueAtTime(0.25, startTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + 0.2);
        
        osc.start(startTime);
        osc.stop(startTime + 0.2);
    });
}

'VINTAGE','VIOLACIÓN','VIRGEN','VÉRTIGO','VITAMINA','VIUDO','VIVAZ','VODKA','VOLCÁN','VOLANTE','VOLTAJE','VOLTIO','VOLUMEN','VÓMITO','VIRUS','VISIÓN','VUDÚ','WHISKY',
'XILÓFONO','YAKUZA','YATE','YERNO','YOGA','ZARIGÜEYA','ZAMBA','ZÓCALO','ZOMBIE'
];

let currentWord = '';
let scrambledWord = [];
let selectedIndex = null;
let correctCount = 0;
let usedWords = [];
let gameWords = [];

function selectRandomWords() {
    const shuffled = [...words];
    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    gameWords = shuffled.slice(0, Math.min(99, words.length));
}

const VOWELS = 'AEIOUÁÉÍÓÚaeiouáéíóú';

function isVowel(char) {
    return VOWELS.includes(char);
}

function shuffle(word) {
    const arr = word.split('');
    const consonantIndices = arr.map((c, i) => i).filter(i => !isVowel(arr[i]));
    const consonantLetters = consonantIndices.map(i => arr[i]);
    let shuffledConsonants;
    do {
        shuffledConsonants = consonantLetters.slice();
        for (let i = shuffledConsonants.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffledConsonants[i], shuffledConsonants[j]] = [shuffledConsonants[j], shuffledConsonants[i]];
        }
    } while (shuffledConsonants.join('') === consonantLetters.join('') && consonantLetters.length > 1);

    const result = arr.slice();
    consonantIndices.forEach((pos, i) => {
        result[pos] = shuffledConsonants[i];
    });
    return result;
}

function loadWord() {
    if (usedWords.length === gameWords.length) {
        usedWords = [];
        correctCount = 0;
    }

    let availableWords = gameWords.filter(w => !usedWords.includes(w));
    currentWord = availableWords[Math.floor(Math.random() * availableWords.length)];
    scrambledWord = shuffle(currentWord);
    selectedIndex = null;
    
    renderWord();
    document.getElementById('counter').textContent = correctCount + ' de ' + gameWords.length;
    document.getElementById('message').textContent = '';
}

function renderWord() {
    const container = document.getElementById('wordContainer');
    container.innerHTML = '';
    
    scrambledWord.forEach((letter, index) => {
        const cell = document.createElement('div');
        cell.textContent = letter;

        if (isVowel(letter)) {
            cell.className = 'letter-cell vowel';
        } else {
            cell.className = 'letter-cell';
            cell.onclick = () => selectLetter(index);
        }

        container.appendChild(cell);
    });
}

function selectLetter(index) {
    if (isVowel(scrambledWord[index])) return;

    const cells = document.querySelectorAll('.letter-cell');
    
    if (selectedIndex === null) {
        selectedIndex = index;
        cells[index].classList.add('selected');
    } else {
        if (selectedIndex === index) {
            cells[index].classList.remove('selected');
            selectedIndex = null;
        } else {
            [scrambledWord[selectedIndex], scrambledWord[index]] = [scrambledWord[index], scrambledWord[selectedIndex]];
            
            cells[selectedIndex].classList.remove('selected');
            selectedIndex = null;
            
            renderWord();
            checkSolution();
        }
    }
}

function checkSolution() {
    if (scrambledWord.join('') === currentWord) {
        const cells = document.querySelectorAll('.letter-cell');
        cells.forEach(cell => {
            cell.classList.add('correct');
            cell.style.pointerEvents = 'none';
        });
        
        correctCount++;
        usedWords.push(currentWord);
        

        if (correctCount === gameWords.length) {
            playwin();
            alert("Ganaste");
        } else {
            playgood();
        }
        
        document.getElementById('counter').textContent = correctCount + ' de ' + gameWords.length;
        
        setTimeout(() => {
            loadWord();
        }, 1000);
    }
}

selectRandomWords();
loadWord();
</script>
