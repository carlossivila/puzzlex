<!DOCTYPE html>
<html lang="es">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PuzzleX - Torres de Hanoi</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #111;
    color: lime;
    font-family: Verdana, sans-serif;
    overflow-x: hidden;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
    -webkit-user-select: none;
  }

  header {
    margin: 18px 0 8px;
    font-size: clamp(13px, 3.5vw, 18px);
    font-weight: bold;
    color: lime;
    letter-spacing: 1px;
    text-align: center;
  }

  #controls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    font-size: clamp(11px, 3vw, 14px);
  }

  #controls label { color: lime; }

  #diskno {
    background: #222;
    color: lime;
    border: 1px solid lime;
    border-radius: 4px;
    padding: 4px 6px;
    font-size: clamp(12px, 3vw, 14px);
    cursor: pointer;
  }

  #arena {
    position: relative;
    width: 100%;
    max-width: 660px;
    /* height set by JS */
    touch-action: none;
  }

  /* Towers */
  .tower-group {
    position: absolute;
    bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
  }

  .tower-label {
    position: absolute;
    bottom: -22px;
    font-size: clamp(9px, 2.5vw, 12px);
    color: yellow;
    white-space: nowrap;
  }

  .tower-vert {
    width: 4px;
    background: gray;
    border: 1px solid lime;
  }

  .tower-base {
    height: 3px;
    background: gray;
    border: 1px solid lime;
  }

  /* Disks */
  .disk {
    position: absolute;
    border: 1px solid #555;
    border-radius: 3px;
    cursor: grab;
    touch-action: none;
  }

  .disk.dragging {
    cursor: grabbing;
    opacity: 0.85;
    z-index: 9999 !important;
    box-shadow: 0 4px 16px rgba(0,0,0,0.6);
  }


</style>
</head>
<body>

<header>PuzzleX by Carlos Sivila</header>

<div id="controls">
  <label for="diskno">Cantidad de discos:</label>
  <select id="diskno">
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
  </select>
</div>

<div id="arena"></div>

<p>UN DISCO GRANDE NO PUEDE IR<br>
ENCIMA DE UN DISCO PEQUEÑO</p>

<script>
(function () {

  // ── Config ────────────────────────────────────────────────────────────
  const DISK_COLORS = ['red','orange','yellow','green','deepskyblue','indigo','violet','pink'];
  const TOWER_BASE_H = 4;
  const DISK_H       = 20;   // disk height px (visual unit, scaled later)
  const DISK_GAP     = 1;    // gap between stacked disks
  const POLE_W       = 4;
  const POLE_PADDING = 14;   // extra pole height above tallest disk stack

  // ── State ─────────────────────────────────────────────────────────────
  let diskCount = 3;
  let towers    = [[], [], []];   // tower[i] = array of disk-numbers (1=smallest), bottom-first
  let diskEls   = {};             // diskEls[n] = DOM element
  let gameOver  = false;

  // Drag state
  let dragging  = null;   // { diskNum, startTower, origX, origY, offsetX, offsetY }

  // ── DOM refs ──────────────────────────────────────────────────────────
  const arena  = document.getElementById('arena');
  const select = document.getElementById('diskno');


  // ── Layout helpers ────────────────────────────────────────────────────
  // Returns dynamic measurements based on current arena width
  function layout() {
    const W = arena.clientWidth || 360;
    const cols = 3;
    const colW = W / cols;
    const baseW = Math.min(colW * 0.9, 200);
    const diskMaxW = baseW * 0.92;
    const diskMinW = diskMaxW * 0.28;
    const diskH   = Math.max(14, Math.min(24, Math.floor(colW * 0.09)));
    const poleH   = diskH * 8 + POLE_PADDING + diskH; // fits up to 8 disks + padding
    const arenaH  = poleH + TOWER_BASE_H + 30;        // 30 for labels

    // tower center X positions
    const cx = [colW * 0.5, colW * 1.5, colW * 2.5];

    // disk widths per disk number (1=smallest)
    function diskWidth(n) {
      return diskMinW + (diskMaxW - diskMinW) * (n - 1) / (Math.max(diskCount, 2) - 1 || 1);
    }

    // Y of the base line (bottom of disks rest here)
    const baseY = poleH; // relative to arena top

    // Y position (top) for disk at stack position idx (0=bottom)
    function diskTop(idx) {
      return baseY - (idx + 1) * (diskH + DISK_GAP);
    }

    return { W, colW, cx, diskWidth, diskH, poleH, arenaH, baseY, diskTop, diskMaxW };
  }

  // ── Build DOM ─────────────────────────────────────────────────────────
  function buildArena() {
    arena.innerHTML = '';
    diskEls = {};
    const m = layout();
    arena.style.height = m.arenaH + 'px';

    // Towers
    for (let t = 0; t < 3; t++) {
      const g = document.createElement('div');
      g.className = 'tower-group';
      g.style.left   = (m.cx[t] - m.diskMaxW / 2) + 'px';
      g.style.width  = m.diskMaxW + 'px';
      g.style.height = (m.poleH + TOWER_BASE_H) + 'px';
      g.style.bottom = '30px';

      // vertical pole
      const vp = document.createElement('div');
      vp.className = 'tower-vert';
      vp.style.cssText = `position:absolute;left:${(m.diskMaxW - POLE_W) / 2}px;top:0;width:${POLE_W}px;height:${m.poleH}px;`;
      g.appendChild(vp);

      // base
      const base = document.createElement('div');
      base.className = 'tower-base';
      base.style.cssText = `position:absolute;bottom:0;left:0;width:100%;height:${TOWER_BASE_H}px;`;
      g.appendChild(base);

      // label
      const lbl = document.createElement('div');
      lbl.className = 'tower-label';
      lbl.textContent = 'Torre ' + (t + 1);
      g.appendChild(lbl);

      arena.appendChild(g);
    }

    // Disks (create all, position later)
    for (let n = 1; n <= diskCount; n++) {
      const el = document.createElement('div');
      el.className = 'disk';
      el.dataset.disk = n;
      el.style.width  = Math.round(m.diskWidth(n)) + 'px';
      el.style.height = m.diskH + 'px';
      el.style.background = DISK_COLORS[(n - 1) % DISK_COLORS.length];
      el.style.position = 'absolute';
      el.style.zIndex   = n;
      diskEls[n] = el;
      arena.appendChild(el);
    }
  }

  // ── Position all disks to match tower state ───────────────────────────
  function renderDisks() {
    const m = layout();
    for (let t = 0; t < 3; t++) {
      for (let i = 0; i < towers[t].length; i++) {
        const n  = towers[t][i];
        const el = diskEls[n];
        const w  = Math.round(m.diskWidth(n));
        const topPx = m.diskTop(i);
        el.style.left = Math.round(m.cx[t] - w / 2) + 'px';
        el.style.top  = topPx + 'px';
        el.style.zIndex = n;
      }
    }
  }

  // ── Start game ────────────────────────────────────────────────────────
  function startGame(n) {
    diskCount = n;
    gameOver  = false;
    towers    = [[], [], []];
    for (let i = n; i >= 1; i--) towers[0].push(i); // bottom-first: biggest at idx 0
    buildArena();
    renderDisks();
    attachPointerEvents();
  }

  // ── Pointer-unified drag (mouse + touch + stylus) ─────────────────────
  function attachPointerEvents() {
    arena.addEventListener('pointerdown', onDown, { passive: false });
  }

  function onDown(e) {
    if (gameOver) return;
    if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
    const el = e.target.closest('.disk');
    if (!el) return;

    const diskNum = parseInt(el.dataset.disk);
    const towerIdx = towerOfDisk(diskNum);
    if (towerIdx === -1) return;

    // Only allow moving the TOP disk (index 0 is bottom, last is top)
    const stack = towers[towerIdx];
    if (stack[stack.length - 1] !== diskNum) return;

    e.preventDefault();
    arena.setPointerCapture(e.pointerId);

    const rect = arena.getBoundingClientRect();
    const px   = e.clientX - rect.left;
    const py   = e.clientY - rect.top;
    const dRect = el.getBoundingClientRect();
    const dx    = dRect.left - rect.left;
    const dy    = dRect.top  - rect.top;

    dragging = {
      diskNum,
      towerIdx,
      el,
      offsetX: px - dx,
      offsetY: py - dy,
      pointerId: e.pointerId
    };

    el.classList.add('dragging');
    el.style.zIndex = 9999;

    arena.addEventListener('pointermove', onMove, { passive: false });
    arena.addEventListener('pointerup',   onUp,   { passive: false });
    arena.addEventListener('pointercancel', onCancel, { passive: false });
  }

  function onMove(e) {
    if (!dragging || e.pointerId !== dragging.pointerId) return;
    e.preventDefault();
    const rect = arena.getBoundingClientRect();
    const px   = e.clientX - rect.left;
    const py   = e.clientY - rect.top;
    dragging.el.style.left = (px - dragging.offsetX) + 'px';
    dragging.el.style.top  = (py - dragging.offsetY)  + 'px';
  }

  function onUp(e) {
    if (!dragging || e.pointerId !== dragging.pointerId) return;
    e.preventDefault();
    drop(e);
    cleanup();
  }

  function onCancel(e) {
    if (!dragging || e.pointerId !== dragging.pointerId) return;
    // Return disk to original tower
    returnDisk();
    cleanup();
  }

  function drop(e) {
    const m    = layout();
    const rect = arena.getBoundingClientRect();
    const px   = e.clientX - rect.left;

    // Determine which tower zone the center of the disk is over
    const diskCenterX = px - dragging.offsetX + parseFloat(dragging.el.style.width) / 2;
    let targetTower = -1;
    for (let t = 0; t < 3; t++) {
      const left  = m.cx[t] - m.diskMaxW / 2;
      const right = m.cx[t] + m.diskMaxW / 2;
      if (diskCenterX >= left && diskCenterX <= right) { targetTower = t; break; }
    }

    if (targetTower === -1 || targetTower === dragging.towerIdx) {
      returnDisk(); return;
    }

    // Validate move: target must be empty or top disk is larger
    const targetStack = towers[targetTower];
    const topOfTarget = targetStack.length > 0 ? targetStack[targetStack.length - 1] : Infinity;

    if (dragging.diskNum < topOfTarget) {
      // Valid move
      towers[dragging.towerIdx].pop();
      towers[targetTower].push(dragging.diskNum);
      renderDisks();
      dragging.el.classList.remove('dragging');

      // Check win
      if (towers[2].length === diskCount) {
        gameOver = true;
        setTimeout(() => alert('Ganaste'), 1000);
      }
    } else {
      returnDisk();
    }
  }

  function returnDisk() {
    renderDisks(); // just re-render to snap back
    if (dragging) dragging.el.classList.remove('dragging');
  }

  function cleanup() {
    arena.removeEventListener('pointermove', onMove);
    arena.removeEventListener('pointerup',   onUp);
    arena.removeEventListener('pointercancel', onCancel);
    dragging = null;
  }

  // ── Helpers ───────────────────────────────────────────────────────────
  function towerOfDisk(diskNum) {
    for (let t = 0; t < 3; t++) {
      if (towers[t].includes(diskNum)) return t;
    }
    return -1;
  }



  // ── Resize ────────────────────────────────────────────────────────────
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      buildArena();
      renderDisks();
      attachPointerEvents();
    }, 120);
  });

  // ── Select handler ────────────────────────────────────────────────────
  select.addEventListener('change', () => {
    startGame(parseInt(select.value));
  });

  // ── Init ──────────────────────────────────────────────────────────────
  startGame(parseInt(select.value));

})();
</script>
</body>
</html>
