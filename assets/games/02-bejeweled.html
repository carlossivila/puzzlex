<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PuzzleX - joyas</title>
<style>
html, body {
background-color: #111;
margin: 0;
padding: 0;
overflow-x: hidden;
}

#viewport {
    touch-action: none;
    display: block;
}

#controls {
    display: flex;
    align-items: center;
    gap: 15px;
    margin: 10px 0 0 20px;
}

#hint {
    font-size: 20px;
    background-color: black;
    color: lime;
    border: 1px solid cyan;
    border-radius: 5px;
    padding: 10px 20px;
    cursor: pointer;
    transition: background-color 0.3s, color 0.3s, border-color 0.3s;
}

#score {
    font-size: 20px;
    font-weight: bold;
    color: red;
}

#hint:hover {
    background-color: #050505;
    color: red;
    border: 1px solid gray;
}

#hint:active {
    background-color: #33F033;
    color: red;
    border: 1px solid black;
}

#hint:disabled {
    background-color: #222;
    color: #666;
    border-color: #666;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
}

.btn {
  display: inline-block;
  font-size: 18px;
  background-color: #009900;
  border: 1px solid gray;
  border-radius: 5px;
  transition: box-shadow 0.3s ease;
}

.btn:hover {
  border: 1px solid cyan;
  box-shadow: 0 0 15px cyan, 0 0 30px aqua;
}

a:link,a:visited {
text-decoration: none;
color: lime;
}
a:hover {
text-decoration: none;
color: red;
}

@media (max-width: 600px) {
  body {
    font-size: 20px;
    transform: scale(1.0);
    transform-origin: top left;
  }
}

</style>
</head>

<body>
<h3 style="color: lime; margin: 20px 0 5px 40px;">PuzzleX by Carlos Sivila</h3>
<canvas id="viewport" width="360" height="350"></canvas>
<div id="controls">
    <button id="hint">Pista</button>
    <span id="score">0 aciertos de 49</span>
       <audio id="audio" src="track.mp3" preload="auto" loop></audio>
       <button class="btn" id="sound">🔊</button>
<script>
    const audio = document.getElementById("audio");
    const sound = document.getElementById("sound");
    sound.addEventListener("click", function() {
        if (audio.paused) {
            audio.play();
            sound.textContent = "🔊";
        } else {
            audio.pause();
            sound.textContent = "🔇";
        }
    });
</script>
</div>

<script>
function playSound(frequencies, duration = 150) {
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioContext.currentTime;
    
    frequencies.forEach((freq, index) => {
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        
        oscillator.frequency.value = freq;
        oscillator.type = 'sine';
        
        const startTime = now + (index * duration / 1000);
        gainNode.gain.setValueAtTime(0.3, startTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + duration / 1000);
        
        oscillator.start(startTime);
        oscillator.stop(startTime + duration / 1000);
    });
}

window.onload = function() {
    var canvas = document.getElementById("viewport");
    var context = canvas.getContext("2d");
    var lastframe = 0;
    var drag = false;
    
    var level = {
        x: 20,
        y: 15,
        columns: 8,
        rows: 8,
        tilewidth: 40,
        tileheight: 40,
        tiles: [],
        selectedtile: { selected: false, column: 0, row: 0 }
    };
    
    var tilecolors = [[255, 128, 128],
                      [128, 255, 128],
                      [128, 128, 255],
                      [255, 255, 128],
                      [255, 128, 255],
                      [128, 255, 255],
                      [255, 255, 255]];
    
    var clusters = [];
    var moves = [];
    var currentmove = { column1: 0, row1: 0, column2: 0, row2: 0 };
    var gamestates = { init: 0, ready: 1, resolve: 2 };
    var gamestate = gamestates.init;
    var animationstate = 0;
    var animationtime = 0;
    var animationtimetotal = 0.3;
    var hintActive = false;
    var hintStartTime = 0;
    var hintDuration = 3000;
    var gameover = false;
    var successfulMoves = 0;
    var totalMovesNeeded = 49;
    var hintButtonElement;
    var scoreElement;
    var isFirstLoad = true; // Bandera para controlar la primera carga

    function init() {
        hintButtonElement = document.getElementById("hint");
        scoreElement = document.getElementById("score");
        hintButtonElement.addEventListener("click", onHintButtonClick);
        canvas.addEventListener("mousemove", onMouseMove);
        canvas.addEventListener("mousedown", onMouseDown);
        canvas.addEventListener("mouseup", onMouseUp);
        canvas.addEventListener("mouseout", onMouseOut);
        
        for (var i=0; i<level.columns; i++) {
            level.tiles[i] = [];
            for (var j=0; j<level.rows; j++) {
                level.tiles[i][j] = { type: 0, shift:0 }
            }
        }
        
        newGame();
        main(0);
    }
    
    function main(tframe) {
        window.requestAnimationFrame(main);
        update(tframe);
        render();
    }
    
    function update(tframe) {
        var dt = (tframe - lastframe) / 1000;
        lastframe = tframe;
        
        if (hintActive) {
            if (Date.now() - hintStartTime >= hintDuration) {
                hintActive = false;
                hintButtonElement.disabled = false;
                hintButtonElement.textContent = "Pista";
            }
        }
        
        if (gamestate == gamestates.ready) {
            if (moves.length <= 0) {
                gameover = true;
            }
        } else if (gamestate == gamestates.resolve) {
            animationtime += dt;
            
            if (animationstate == 0) {
                if (animationtime > animationtimetotal) {
                    findClusters();
                    
                    if (clusters.length > 0) {
                        // Solo sumar puntos cuando no es la primera carga
                        if (!isFirstLoad) {
                            successfulMoves += clusters.length;
                            updateScore();
                            playSound([523.25]);
                            
                            // Verificar victoria
                            if (successfulMoves >= totalMovesNeeded) {
                                setTimeout(function() {
                                    playSound([523.25, 587.33, 659.25, 783.99, 880.00], 200);
                                    setTimeout(function() {
                                        alert("Ganaste");
                                    }, 1200);
                                }, 500);
                            }
                        }
                        removeClusters();
                        animationstate = 1;
                    } else {
                        gamestate = gamestates.ready;
                        // Después de la primera carga, permitir sumar puntos
                        isFirstLoad = false;
                    }
                    animationtime = 0;
                }
            } else if (animationstate == 1) {
                if (animationtime > animationtimetotal) {
                    shiftTiles();
                    animationstate = 0;
                    animationtime = 0;
                    
                    findClusters();
                    if (clusters.length <= 0) {
                        gamestate = gamestates.ready;
                        // Después de la primera carga, permitir sumar puntos
                        isFirstLoad = false;
                    }
                }
            } else if (animationstate == 2) {
                if (animationtime > animationtimetotal) {
                    swap(currentmove.column1, currentmove.row1, currentmove.column2, currentmove.row2);
                    
                    findClusters();
                    if (clusters.length > 0) {
                        animationstate = 0;
                        animationtime = 0;
                        gamestate = gamestates.resolve;
                        // Marcar que ya no es la primera carga
                        isFirstLoad = false;
                    } else {
                        animationstate = 3;
                        animationtime = 0;
                    }
                    
                    findMoves();
                    findClusters();
                }
            } else if (animationstate == 3) {
                if (animationtime > animationtimetotal) {
                    swap(currentmove.column1, currentmove.row1, currentmove.column2, currentmove.row2);
                    gamestate = gamestates.ready;
                    // Marcar que ya no es la primera carga
                    isFirstLoad = false;
                }
            }
            
            findMoves();
            findClusters();
        }
    }
    
    function render() {
        context.fillStyle = "#111111";
        context.fillRect(0, 0, canvas.width, canvas.height);
        
        var levelwidth = level.columns * level.tilewidth;
        var levelheight = level.rows * level.tileheight;
        context.fillStyle = "#000000";
        context.fillRect(level.x - 4, level.y - 4, levelwidth + 8, levelheight + 8);
        
        renderTiles();
        renderClusters();
        
        if (hintActive && clusters.length <= 0 && gamestate == gamestates.ready) {
            renderMoves();
        }
        
        if (gameover) {
            context.fillStyle = "rgba(0, 0, 0, 0.8)";
            context.fillRect(level.x, level.y, levelwidth, levelheight);
            
            context.fillStyle = "#ffffff";
            context.font = "24px Verdana";
            var textdim = context.measureText("Game Over!");
            context.fillText("Game Over!", level.x + (levelwidth-textdim.width)/2, level.y + levelheight / 2 + 10);
        }
    }
    
    function onHintButtonClick() {
        if (!hintButtonElement.disabled && !gameover && gamestate == gamestates.ready) {
            findMoves();
            if (moves.length > 0) {
                hintActive = true;
                hintStartTime = Date.now();
                hintButtonElement.disabled = true;
                hintButtonElement.textContent = "Pista";
            }
        }
    }
    
    function renderTiles() {
        for (var i=0; i<level.columns; i++) {
            for (var j=0; j<level.rows; j++) {
                var shift = level.tiles[i][j].shift;
                var coord = getTileCoordinate(i, j, 0, (animationtime / animationtimetotal) * shift);
                
                if (level.tiles[i][j].type >= 0) {
                    var col = tilecolors[level.tiles[i][j].type];
                    drawTile(coord.tilex, coord.tiley, col[0], col[1], col[2]);
                }
                
                if (level.selectedtile.selected) {
                    if (level.selectedtile.column == i && level.selectedtile.row == j) {
                        drawTile(coord.tilex, coord.tiley, 255, 0, 0);
                    }
                }
            }
        }
        
        if (gamestate == gamestates.resolve && (animationstate == 2 || animationstate == 3)) {
            var shiftx = currentmove.column2 - currentmove.column1;
            var shifty = currentmove.row2 - currentmove.row1;

            var coord1 = getTileCoordinate(currentmove.column1, currentmove.row1, 0, 0);
            var coord1shift = getTileCoordinate(currentmove.column1, currentmove.row1, (animationtime / animationtimetotal) * shiftx, (animationtime / animationtimetotal) * shifty);
            var col1 = tilecolors[level.tiles[currentmove.column1][currentmove.row1].type];
            
            var coord2 = getTileCoordinate(currentmove.column2, currentmove.row2, 0, 0);
            var coord2shift = getTileCoordinate(currentmove.column2, currentmove.row2, (animationtime / animationtimetotal) * -shiftx, (animationtime / animationtimetotal) * -shifty);
            var col2 = tilecolors[level.tiles[currentmove.column2][currentmove.row2].type];
            
            drawTile(coord1.tilex, coord1.tiley, 0, 0, 0);
            drawTile(coord2.tilex, coord2.tiley, 0, 0, 0);
            
            if (animationstate == 2) {
                drawTile(coord1shift.tilex, coord1shift.tiley, col1[0], col1[1], col1[2]);
                drawTile(coord2shift.tilex, coord2shift.tiley, col2[0], col2[1], col2[2]);
            } else {
                drawTile(coord2shift.tilex, coord2shift.tiley, col2[0], col2[1], col2[2]);
                drawTile(coord1shift.tilex, coord1shift.tiley, col1[0], col1[1], col1[2]);
            }
        }
    }
    
    function getTileCoordinate(column, row, columnoffset, rowoffset) {
        var tilex = level.x + (column + columnoffset) * level.tilewidth;
        var tiley = level.y + (row + rowoffset) * level.tileheight;
        return { tilex: tilex, tiley: tiley};
    }
    
    function drawTile(x, y, r, g, b) {
        context.fillStyle = "rgb(" + r + "," + g + "," + b + ")";
        context.fillRect(x + 2, y + 2, level.tilewidth - 4, level.tileheight - 4);
    }
    
    function renderClusters() {
        for (var i=0; i<clusters.length; i++) {
            var coord = getTileCoordinate(clusters[i].column, clusters[i].row, 0, 0);
            
            if (clusters[i].horizontal) {
                context.fillStyle = "#00ff00";
                context.fillRect(coord.tilex + level.tilewidth/2, coord.tiley + level.tileheight/2 - 4, (clusters[i].length - 1) * level.tilewidth, 8);
            } else {
                context.fillStyle = "#0000ff";
                context.fillRect(coord.tilex + level.tilewidth/2 - 4, coord.tiley + level.tileheight/2, 8, (clusters[i].length - 1) * level.tileheight);
            }
        }
    }
    
    function renderMoves() {
        for (var i=0; i<moves.length; i++) {
            var coord1 = getTileCoordinate(moves[i].column1, moves[i].row1, 0, 0);
            var coord2 = getTileCoordinate(moves[i].column2, moves[i].row2, 0, 0);
            
            context.strokeStyle = "#ff0000";
            context.lineWidth = 3;
            context.beginPath();
            context.moveTo(coord1.tilex + level.tilewidth/2, coord1.tiley + level.tileheight/2);
            context.lineTo(coord2.tilex + level.tilewidth/2, coord2.tiley + level.tileheight/2);
            context.stroke();
        }
    }
    
    function updateScore() {
        scoreElement.textContent = successfulMoves + " aciertos de " + totalMovesNeeded;
    }
    
    function newGame() {
        gamestate = gamestates.ready;
        gameover = false;
        successfulMoves = 0;
        isFirstLoad = true; // Resetear bandera
        updateScore();
        hintActive = false;
        hintButtonElement.disabled = false;
        hintButtonElement.textContent = "Pista";
        createLevel();
        findMoves();
        findClusters(); 
    }
    
    function createLevel() {
        var done = false;
        
        while (!done) {
            for (var i=0; i<level.columns; i++) {
                for (var j=0; j<level.rows; j++) {
                    level.tiles[i][j].type = getRandomTile();
                }
            }
            
            resolveClusters();
            findMoves();
            
            if (moves.length > 0) {
                done = true;
            }
        }
    }
    
    function getRandomTile() {
        return Math.floor(Math.random() * tilecolors.length);
    }
    
    function resolveClusters() {
        findClusters();
        
        while (clusters.length > 0) {
            // NO sumar puntos aquí (esto solo es para la creación inicial)
            removeClusters();
            shiftTiles();
            findClusters();
        }
    }
    
    function findClusters() {
        clusters = []
        
        for (var j=0; j<level.rows; j++) {
            var matchlength = 1;
            for (var i=0; i<level.columns; i++) {
                var checkcluster = false;
                
                if (i == level.columns-1) {
                    checkcluster = true;
                } else {
                    if (level.tiles[i][j].type == level.tiles[i+1][j].type &&
                        level.tiles[i][j].type != -1) {
                        matchlength += 1;
                    } else {
                        checkcluster = true;
                    }
                }
                
                if (checkcluster) {
                    if (matchlength >= 3) {
                        clusters.push({ column: i+1-matchlength, row:j,
                                        length: matchlength, horizontal: true });
                    }
                    
                    matchlength = 1;
                }
            }
        }

        for (var i=0; i<level.columns; i++) {
            var matchlength = 1;
            for (var j=0; j<level.rows; j++) {
                var checkcluster = false;
                
                if (j == level.rows-1) {
                    checkcluster = true;
                } else {
                    if (level.tiles[i][j].type == level.tiles[i][j+1].type &&
                        level.tiles[i][j].type != -1) {
                        matchlength += 1;
                    } else {
                        checkcluster = true;
                    }
                }
                
                if (checkcluster) {
                    if (matchlength >= 3) {
                        clusters.push({ column: i, row:j+1-matchlength,
                                        length: matchlength, horizontal: false });
                    }
                    
                    matchlength = 1;
                }
            }
        }
    }
    
    function findMoves() {
        moves = []
        
        for (var j=0; j<level.rows; j++) {
            for (var i=0; i<level.columns-1; i++) {
                swap(i, j, i+1, j);
                findClusters();
                swap(i, j, i+1, j);
                
                if (clusters.length > 0) {
                    moves.push({column1: i, row1: j, column2: i+1, row2: j});
                }
            }
        }
        
        for (var i=0; i<level.columns; i++) {
            for (var j=0; j<level.rows-1; j++) {
                swap(i, j, i, j+1);
                findClusters();
                swap(i, j, i, j+1);
                
                if (clusters.length > 0) {
                    moves.push({column1: i, row1: j, column2: i, row2: j+1});
                }
            }
        }
        
        clusters = []
    }
    
    function loopClusters(func) {
        for (var i=0; i<clusters.length; i++) {
            var cluster = clusters[i];
            var coffset = 0;
            var roffset = 0;
            for (var j=0; j<cluster.length; j++) {
                func(i, cluster.column+coffset, cluster.row+roffset, cluster);
                
                if (cluster.horizontal) {
                    coffset++;
                } else {
                    roffset++;
                }
            }
        }
    }
    
    function removeClusters() {
        loopClusters(function(index, column, row, cluster) { level.tiles[column][row].type = -1; });

        for (var i=0; i<level.columns; i++) {
            var shift = 0;
            for (var j=level.rows-1; j>=0; j--) {
                if (level.tiles[i][j].type == -1) {
                    shift++;
                    level.tiles[i][j].shift = 0;
                } else {
                    level.tiles[i][j].shift = shift;
                }
            }
        }
    }
    
    function shiftTiles() {
        for (var i=0; i<level.columns; i++) {
            for (var j=level.rows-1; j>=0; j--) {
                if (level.tiles[i][j].type == -1) {
                    level.tiles[i][j].type = getRandomTile();
                } else {
                    var shift = level.tiles[i][j].shift;
                    if (shift > 0) {
                        swap(i, j, i, j+shift)
                    }
                }
                
                level.tiles[i][j].shift = 0;
            }
        }
    }
    
    function getMouseTile(pos) {
        var tx = Math.floor((pos.x - level.x) / level.tilewidth);
        var ty = Math.floor((pos.y - level.y) / level.tileheight);
        
        if (tx >= 0 && tx < level.columns && ty >= 0 && ty < level.rows) {
            return {
                valid: true,
                x: tx,
                y: ty
            };
        }
        
        return {
            valid: false,
            x: 0,
            y: 0
        };
    }
    
    function canSwap(x1, y1, x2, y2) {
        if ((Math.abs(x1 - x2) == 1 && y1 == y2) ||
            (Math.abs(y1 - y2) == 1 && x1 == x2)) {
            return true;
        }
        
        return false;
    }
    
    function swap(x1, y1, x2, y2) {
        var typeswap = level.tiles[x1][y1].type;
        level.tiles[x1][y1].type = level.tiles[x2][y2].type;
        level.tiles[x2][y2].type = typeswap;
    }
    
    function mouseSwap(c1, r1, c2, r2) {
        currentmove = {column1: c1, row1: r1, column2: c2, row2: r2};
        level.selectedtile.selected = false;
        animationstate = 2;
        animationtime = 0;
        gamestate = gamestates.resolve;
        // Asegurar que al hacer un movimiento manual se pueda sumar puntos
        isFirstLoad = false;
    }
    
    function onMouseMove(e) {
        var pos = getMousePos(canvas, e);
        
        if (drag && level.selectedtile.selected) {
            mt = getMouseTile(pos);
            if (mt.valid) {
                if (canSwap(mt.x, mt.y, level.selectedtile.column, level.selectedtile.row)){
                    mouseSwap(mt.x, mt.y, level.selectedtile.column, level.selectedtile.row);
                }
            }
        }
    }
    
    function onMouseDown(e) {
        var pos = getMousePos(canvas, e);
        
        if (!drag) {
            mt = getMouseTile(pos);
            
            if (mt.valid) {
                var swapped = false;
                if (level.selectedtile.selected) {
                    if (mt.x == level.selectedtile.column && mt.y == level.selectedtile.row) {
                        level.selectedtile.selected = false;
                        drag = true;
                        return;
                    } else if (canSwap(mt.x, mt.y, level.selectedtile.column, level.selectedtile.row)){
                        mouseSwap(mt.x, mt.y, level.selectedtile.column, level.selectedtile.row);
                        swapped = true;
                    }
                }
                
                if (!swapped) {
                    level.selectedtile.column = mt.x;
                    level.selectedtile.row = mt.y;
                    level.selectedtile.selected = true;
                }
            } else {
                level.selectedtile.selected = false;
            }

            drag = true;
        }
    }
    
    function onMouseUp(e) {
        drag = false;
    }
    
    function onMouseOut(e) {
        drag = false;
    }
    
    function getMousePos(canvas, e) {
        var rect = canvas.getBoundingClientRect();
        return {
            x: Math.round((e.clientX - rect.left)/(rect.right - rect.left)*canvas.width),
            y: Math.round((e.clientY - rect.top)/(rect.bottom - rect.top)*canvas.height)
        };
    }
    
    init();
};

document.addEventListener('contextmenu', function(e) {
e.preventDefault();
});
</script>

</body>
