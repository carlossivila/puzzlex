<title>PuzzleX - Ahorcado-v3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #333;
  font-family: 'Share Tech Mono', monospace;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: flex-start;
  padding: 16px;
}

#board {
  --gap: 2px;
  --cell: calc((min(100vw, 900px) - 32px - 14 * var(--gap)) / 15 * 0.5);
  display: grid;
  grid-template-columns: repeat(15, var(--cell));
  grid-template-rows:    repeat(10, var(--cell));
  gap: var(--gap);
}

.cell {
  width: var(--cell);
  height: var(--cell);
  border: 1px solid lime;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: calc(var(--cell) * 0.7);
  font-weight: bold;
  color: cyan;
  background: #2a2a2a;
  text-transform: uppercase;
  overflow: hidden;
}

.cell.blank {
  border: 1px solid #555;
  background: #2a2a2a;
}

.cell.revealed {
  animation: pop 0.25s ease;
}

@keyframes pop {
  0%   { transform: scale(1.3); background: rgba(0,255,255,0.2); }
  100% { transform: scale(1);   background: #2a2a2a; }
}

#stats {
  margin-top: 14px;
  font-family: 'Orbitron', monospace;
  font-size: 16px;
  color: lime;
  letter-spacing: 2px;
  display: flex;
  gap: 6px;
  align-items: center;
}

#hits, #tries { color: cyan; text-shadow: 0 0 8px cyan; }
#tries.warn   { color: orange;  text-shadow: 0 0 8px orange; }
#tries.danger { color: #ff4444; text-shadow: 0 0 8px #ff4444; }

#flash {
  margin-top: 10px;
  font-size: 12px;
  letter-spacing: 3px;
  color: lime;
  min-height: 18px;
  text-transform: uppercase;
  text-align: center;
}

#letter-input {
  position: fixed;
  left: -9999px;
  opacity: 0;
  width: 1px;
  height: 1px;
}



@media (max-width: 600px) {
  #board {
    grid-template-columns: repeat(15, calc((100vw - 32px - 14 * 3px) / 15));
    grid-template-rows:    repeat(10, calc((100vw - 32px - 14 * 3px) / 15));
  }
  .cell {
    width:  calc((100vw - 32px - 14 * 3px) / 15);
    height: calc((100vw - 32px - 14 * 3px) / 15);
    font-size: calc((100vw - 32px - 14 * 3px) / 15 * 0.7);
  }
}
</style>
</head>

const COLS = 15;
const ROWS = 10;

let grid = [];
let revealedLetters = new Set();
let usedLetters    = new Set();
let hits     = 0;
let tries    = 6;
let gameOver = false;
let totalLetters = 0;

function pickWords() {
  return [...WORDS].sort(() => Math.random() - 0.5).slice(0, 10);
}

function placeWords(words) {
  // Grilla vacía: ROWS filas x COLS columnas
  grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  // Una palabra por fila, siempre alineada a la izquierda (columna 0)
  const sorted = [...words].sort((a, b) => b.length - a.length);
  for (let row = 0; row < ROWS; row++) {
    const word = sorted[row];
    if (!word) continue;
    const len = word.length > COLS ? COLS : word.length;
    for (let j = 0; j < len; j++) {
      grid[row][j] = word[j];
    }
  }
}

function countTotal() {
  let n = 0;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (grid[r][c]) n++;
  return n;
}

function countRevealed() {
  let n = 0;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (grid[r][c] && revealedLetters.has(grid[r][c])) n++;
  return n;
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  // Siempre renderizar las 150 celdas (10 filas x 15 columnas)
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      const letter = grid[r][c];
      if (!letter) {
        cell.className = 'cell blank';
      } else {
        const revealed = revealedLetters.has(letter);
        cell.className = 'cell' + (revealed ? ' revealed' : '');
        cell.id = `c${r}_${c}`;
        cell.textContent = revealed ? letter : '_';
      }
      board.appendChild(cell);
    }
  }
}

function updateStats() {
  document.getElementById('hits').textContent = hits;
  const el = document.getElementById('tries');
  el.textContent = tries;
  el.className = tries <= 3 ? 'danger' : tries <= 5 ? 'warn' : '';
}

function flash(msg, color) {
  const el = document.getElementById('flash');
  el.textContent = msg;
  el.style.color = color || 'lime';
  setTimeout(() => { el.innerHTML = '&nbsp;'; }, 1800);
}

let audioCtx = null;
        
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playgood() {
    initAudio();
    const notas = [523.25, 587.33, 659.25, 783.99];
    const tiempos = [0, 0.15, 0.3, 0.45];
    
    notas.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime + tiempos[i]);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + tiempos[i] + 0.15);
        
        osc.start(audioCtx.currentTime + tiempos[i]);
        osc.stop(audioCtx.currentTime + tiempos[i] + 0.15);
    });
}
function playfail() {
    initAudio();
    const now = audioCtx.currentTime;
    [440, 392, 349.23, 293.66].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, now + i * 0.15);
        gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.4);
        osc.start(now + i * 0.15);
        osc.stop(now + i * 0.15 + 0.45);
    });
}
function playlose() {
    initAudio();
    const now = audioCtx.currentTime;
    const notasDescendentes = [392, 349.23, 311.13, 293.66, 261.63];
    notasDescendentes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + i * 0.2);
        gainNode.gain.setValueAtTime(0.15, now + i * 0.2);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + i * 0.2 + 0.25);
        
        osc.start(now + i * 0.2);
        osc.stop(now + i * 0.2 + 0.25);
    });
    const oscFinal = audioCtx.createOscillator();
    const gainFinal = audioCtx.createGain();
    
    oscFinal.connect(gainFinal);
    gainFinal.connect(audioCtx.destination);
    
    oscFinal.type = 'sawtooth';
    oscFinal.frequency.setValueAtTime(130.81, now + 1.2);
    gainFinal.gain.setValueAtTime(0.2, now + 1.2);
    gainFinal.gain.exponentialRampToValueAtTime(0.01, now + 1.2 + 0.6);
    
    oscFinal.start(now + 1.2);
    oscFinal.stop(now + 1.2 + 0.6);
}
function playwin() {
    initAudio();
    const now = audioCtx.currentTime;
    const notasIniciales = [523.25, 587.33, 659.25, 783.99];
    notasIniciales.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc.frequency.setValueAtTime(freq, now + i * 0.15);
        gainNode.gain.setValueAtTime(0.2, now + i * 0.15);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.15);
        
        osc.start(now + i * 0.15);
        osc.stop(now + i * 0.15 + 0.15);
    });
    const notasFinales = [880, 1046.5];
    notasFinales.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        const startTime = now + 0.75 + i * 0.15;
        osc.frequency.setValueAtTime(freq, startTime);
        gainNode.gain.setValueAtTime(0.25, startTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + 0.2);
        
        osc.start(startTime);
        osc.stop(startTime + 0.2);
    });
}

let handleGuess;

function startRound() {
  revealedLetters = new Set();
  usedLetters     = new Set();
  tries = 6;
  placeWords(pickWords());
  totalLetters = countTotal();
  renderBoard();
  updateStats();
  document.getElementById('letter-input').focus();
}

const hiddenInput = document.getElementById('letter-input');
const ACCENT_MAP = { 'Á':'A','É':'E','Í':'I','Ó':'O','Ú':'U','Ü':'U' };
// Conjunto de letras válidas del español (A-Z + Ñ + tildes)
const VALID_LETTER = /^[A-ZÁÉÍÓÚÜÑ]$/;

function resolveGuess(raw) {
  const up = raw.toUpperCase();
  if (!VALID_LETTER.test(up)) return null;
  return up;
}

// handleGuess con soporte de acentos y ñ
handleGuess = function(rawLetter) {
  const letter = resolveGuess(rawLetter);
  if (!letter) return;
  if (gameOver) return;

  // Construir el set de letras equivalentes (con y sin acento)
  const base = ACCENT_MAP[letter] || letter;
  const equivalents = new Set();
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      const gl = grid[r][c];
      if (!gl) continue;
      const gb = ACCENT_MAP[gl] || gl;
      if (gb === base || gl === letter) equivalents.add(gl);
    }

  let anyUsed = false;
  for (const eq of equivalents) { if (usedLetters.has(eq)) anyUsed = true; }
  if (anyUsed || usedLetters.has(letter)) return;
  usedLetters.add(letter);
  for (const eq of equivalents) usedLetters.add(eq);
  let found = false;
  for (const eq of equivalents) {
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        if (grid[r][c] === eq) found = true;
  }

  if (found) {
    for (const eq of equivalents) revealedLetters.add(eq);
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (equivalents.has(grid[r][c])) {
          const cell = document.getElementById(`c${r}_${c}`);
          if (cell) { cell.textContent = grid[r][c]; cell.classList.add('revealed'); }
        }
      }
    }
    if (countRevealed() >= totalLetters) {
      hits++;
      updateStats();
      if (hits >= 99) {
        gameOver = true;
        playwin();
        setTimeout(() => { alert('🎉 ¡GANASTE! 99 aciertos.'); location.reload(); }, 500);
        return;
      }
      setTimeout(playgood, 1000);
      setTimeout(startRound, 2500);
      return;
    }
  } else {
    playfail();
    tries--;
    if (tries <= 0) {
      gameOver = true;
      updateStats();
      playlose();
      setTimeout(() => { alert('💀 ¡PERDISTE!'); location.reload(); }, 500);
      return;
    }
  }
  updateStats();
};

hiddenInput.addEventListener('input', () => {
  const raw = hiddenInput.value;
  hiddenInput.value = '';
  const up = raw.toUpperCase();
  for (let i = up.length - 1; i >= 0; i--) {
    if (VALID_LETTER.test(up[i])) { handleGuess(up[i]); break; }
  }
});

document.addEventListener('keydown', (e) => {
  const l = e.key.toUpperCase();
  if (VALID_LETTER.test(l) && l.length === 1) { e.preventDefault(); handleGuess(l); }
});

document.addEventListener('click', () => {
  hiddenInput.focus();
});

document.addEventListener('touchstart', () => {
  hiddenInput.value = '';
  hiddenInput.focus();
}, { passive: true });

startRound();
</script>
