<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PuzzleX - StarMatch</title>
<style>
    body {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        background-color: #111;
        font-size: 18px;
        color: white;
        padding: 10px;
        margin: 0;
        font-family: Arial, sans-serif;
    }

    h4 { color: lime; margin: 0 0 10px 0; }

    .game-container {
        position: relative;
        margin-bottom: 10px;
    }

    .arrows-top, .arrows-bottom {
        display: flex;
        margin-left: 31px;
    }

    .arrows-top { margin-bottom: 2px; }
    .arrows-bottom { margin-top: 2px; }

    .main-grid { display: flex; }

    .arrows-left, .arrows-right {
        display: flex;
        flex-direction: column;
    }

    .arrows-left { margin-right: 2px; }
    .arrows-right { margin-left: 2px; }

    #grid {
        position: relative;
        overflow: hidden;
    }

    .star {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: black;
        border: 1px solid #333;
        font-size: 26px;
        box-sizing: border-box;
        user-select: none;
    }

    .star.matched {
        animation: pop 0.35s ease forwards;
    }

    @keyframes pop {
        0% { transform: scale(1); opacity: 1; }
        100% { transform: scale(0.2); opacity: 0; }
    }

    .arrow-btn {
        background-color: black;
        color: lime;
        border: 1px solid cyan;
        cursor: pointer;
        font-size: 16px;
        box-shadow: 0 0 8px cyan;
        transition: color 0.3s, box-shadow 0.3s;
    }

    .arrow-btn:hover { color: red; box-shadow: 0 0 15px red; }
    .arrow-btn:active { color: red; box-shadow: 0 0 15px red; }
    .arrow-btn:disabled { color: #555; box-shadow: none; cursor: not-allowed; }

    .arrow-top, .arrow-bottom { width: 46px; height: 26px; margin: 0 1px; }
    .arrow-left, .arrow-right { width: 26px; height: 46px; margin: 1px 0; }

    #info { margin-bottom: 10px; text-align: left; }
    .highlight { color: red; font-weight: bold; }

    @media (max-width: 600px) {
        body { font-size: 16px; }
        .star { font-size: 20px; }
        .arrow-top, .arrow-bottom { width: 38px; height: 22px; }
        .arrow-left, .arrow-right { width: 22px; height: 38px; }
    }
</style>
</head>
<body>

<h4>PuzzleX by Carlos Sivila</h4>

<div class="game-container">
    <div class="arrows-top" id="arrowsTop"></div>
    <div class="main-grid">
        <div class="arrows-left" id="arrowsLeft"></div>
        <div id="grid"></div>
        <div class="arrows-right" id="arrowsRight"></div>
    </div>
    <div class="arrows-bottom" id="arrowsBottom"></div>
</div>
<br>
<div id="info">
    <div id="scoreInfo">
        Puntaje: <span class="highlight">0</span>
    </div>
</div>

<script>
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playgood() {
        initAudio();
        const notas = [523.25, 587.33, 659.25, 783.99];
        const tiempos = [0, 0.15, 0.3, 0.45];

        notas.forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime + tiempos[i]);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + tiempos[i] + 0.15);

            osc.start(audioCtx.currentTime + tiempos[i]);
            osc.stop(audioCtx.currentTime + tiempos[i] + 0.15);
        });
    }

    function playwin() {
        initAudio();
        const now = audioCtx.currentTime;
        const notasIniciales = [523.25, 587.33, 659.25, 783.99];
        notasIniciales.forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.frequency.setValueAtTime(freq, now + i * 0.15);
            gainNode.gain.setValueAtTime(0.2, now + i * 0.15);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.15);

            osc.start(now + i * 0.15);
            osc.stop(now + i * 0.15 + 0.15);
        });
        const notasFinales = [880, 1046.5];
        notasFinales.forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const startTime = now + 0.75 + i * 0.15;
            osc.frequency.setValueAtTime(freq, startTime);
            gainNode.gain.setValueAtTime(0.25, startTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + 0.2);

            osc.start(startTime);
            osc.stop(startTime + 0.2);
        });
    }

    const COLS = 6, ROWS = 6;
    const TILE = 46, GAP = 2;
    const ANIM_MS = 220;
    const COLORS = [
        { css: 'rgb(255,99,99)',  glow: 'rgba(255,99,99,0.8)' },
        { css: 'rgb(99,255,99)',  glow: 'rgba(99,255,99,0.8)' },
        { css: 'rgb(99,140,255)', glow: 'rgba(99,140,255,0.8)' },
        { css: 'rgb(255,255,99)', glow: 'rgba(255,255,99,0.8)' },
        { css: 'rgb(255,99,255)', glow: 'rgba(255,99,255,0.8)' },
        { css: 'rgb(99,255,255)', glow: 'rgba(99,255,255,0.8)' },
        { css: 'rgb(255,255,255)',glow: 'rgba(255,255,255,0.8)' },
        { css: 'rgb(255,170,60)', glow: 'rgba(255,170,60,0.8)' }
    ];

    const gridEl = document.getElementById('grid');
    const arrowsTop = document.getElementById('arrowsTop');
    const arrowsBottom = document.getElementById('arrowsBottom');
    const arrowsLeft = document.getElementById('arrowsLeft');
    const arrowsRight = document.getElementById('arrowsRight');
    const scoreInfo = document.getElementById('scoreInfo');

    let tiles = [];        // objetos {id, color}
    let elements = new Map(); // id -> elemento DOM
    let score = 0;
    let busy = false;
    let nextId = 1;
    let gameWon = false;

    function randomColor() { return Math.floor(Math.random() * COLORS.length); }
    function idx(col, row) { return row * COLS + col; }
    function stepSize() { return TILE + GAP; }

    function createTile() { return { id: nextId++, color: randomColor() }; }

    function setPos(el, col, row, animate) {
        el.style.transition = animate ? `left ${ANIM_MS}ms ease, top ${ANIM_MS}ms ease` : 'none';
        el.style.left = (col * stepSize()) + 'px';
        el.style.top = (row * stepSize()) + 'px';
    }

    function makeStarElement(t) {
        const el = document.createElement('div');
        el.className = 'star';
        el.style.width = TILE + 'px';
        el.style.height = TILE + 'px';
        const color = COLORS[t.color];
        el.textContent = '★';
        el.style.color = color.css;
        el.style.textShadow = `0 0 8px ${color.glow}`;
        return el;
    }

    function createArrows() {
        arrowsTop.innerHTML = '';
        arrowsBottom.innerHTML = '';
        arrowsLeft.innerHTML = '';
        arrowsRight.innerHTML = '';

        for (let c = 0; c < COLS; c++) {
            const up = document.createElement('button');
            up.className = 'arrow-btn arrow-top';
            up.textContent = '▲';
            up.onclick = () => slideColumn(c, -1);
            arrowsTop.appendChild(up);

            const down = document.createElement('button');
            down.className = 'arrow-btn arrow-bottom';
            down.textContent = '▼';
            down.onclick = () => slideColumn(c, 1);
            arrowsBottom.appendChild(down);
        }

        for (let r = 0; r < ROWS; r++) {
            const left = document.createElement('button');
            left.className = 'arrow-btn arrow-left';
            left.textContent = '◀';
            left.onclick = () => slideRow(r, -1);
            arrowsLeft.appendChild(left);

            const right = document.createElement('button');
            right.className = 'arrow-btn arrow-right';
            right.textContent = '▶';
            right.onclick = () => slideRow(r, 1);
            arrowsRight.appendChild(right);
        }
    }

    function setArrowsEnabled(enabled) {
        document.querySelectorAll('.arrow-btn').forEach(btn => btn.disabled = !enabled);
    }

    function initTiles() {
        tiles = new Array(COLS * ROWS).fill(0).map(() => createTile());
        let clusters = findClusters();
        while (clusters.length > 0) {
            clusters.forEach(cluster => {
                for (let k = 0; k < cluster.length; k++) {
                    const c = cluster.horizontal ? cluster.col + k : cluster.col;
                    const r = cluster.horizontal ? cluster.row : cluster.row + k;
                    tiles[idx(c, r)] = createTile();
                }
            });
            clusters = findClusters();
        }
    }

    function buildElements() {
        gridEl.innerHTML = '';
        gridEl.style.width = (COLS * TILE + (COLS - 1) * GAP) + 'px';
        gridEl.style.height = (ROWS * TILE + (ROWS - 1) * GAP) + 'px';
        elements.clear();

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const t = tiles[idx(c, r)];
                const el = makeStarElement(t);
                setPos(el, c, r, false);
                gridEl.appendChild(el);
                elements.set(t.id, el);
            }
        }
    }

    function animateWrapHorizontal(el, fromCol, row, toCol, toRow, direction) {
        const exitCol = fromCol + direction;
        setPos(el, exitCol, row, true);
        setTimeout(() => {
            const enterCol = toCol - direction;
            setPos(el, enterCol, toRow, false);
            void el.offsetWidth;
            setPos(el, toCol, toRow, true);
        }, ANIM_MS);
    }

    function animateWrapVertical(el, col, fromRow, toCol, toRow, direction) {
        const exitRow = fromRow + direction;
        setPos(el, col, exitRow, true);
        setTimeout(() => {
            const enterRow = toRow - direction;
            setPos(el, toCol, enterRow, false);
            void el.offsetWidth;
            setPos(el, toCol, toRow, true);
        }, ANIM_MS);
    }

    function slideRow(rowIndex, direction) {
        if (busy) return;

        const oldRow = [];
        for (let c = 0; c < COLS; c++) oldRow.push(tiles[idx(c, rowIndex)]);

        const newRow = oldRow.slice();
        let wrapped;
        if (direction > 0) {
            wrapped = newRow.pop();
            newRow.unshift(wrapped);
        } else {
            wrapped = newRow.shift();
            newRow.push(wrapped);
        }

        for (let c = 0; c < COLS; c++) tiles[idx(c, rowIndex)] = newRow[c];

        busy = true;
        setArrowsEnabled(false);

        for (let oldC = 0; oldC < COLS; oldC++) {
            const t = oldRow[oldC];
            const newC = newRow.indexOf(t);
            const el = elements.get(t.id);
            if (t === wrapped) {
                animateWrapHorizontal(el, oldC, rowIndex, newC, rowIndex, direction);
            } else {
                setPos(el, newC, rowIndex, true);
            }
        }

        setTimeout(() => resolveCascades(0), ANIM_MS * 2 + 20);
    }

    function slideColumn(colIndex, direction) {
        if (busy) return;

        const oldCol = [];
        for (let r = 0; r < ROWS; r++) oldCol.push(tiles[idx(colIndex, r)]);

        const newCol = oldCol.slice();
        let wrapped;
        if (direction > 0) {
            wrapped = newCol.pop();
            newCol.unshift(wrapped);
        } else {
            wrapped = newCol.shift();
            newCol.push(wrapped);
        }

        for (let r = 0; r < ROWS; r++) tiles[idx(colIndex, r)] = newCol[r];

        busy = true;
        setArrowsEnabled(false);

        for (let oldR = 0; oldR < ROWS; oldR++) {
            const t = oldCol[oldR];
            const newR = newCol.indexOf(t);
            const el = elements.get(t.id);
            if (t === wrapped) {
                animateWrapVertical(el, colIndex, oldR, colIndex, newR, direction);
            } else {
                setPos(el, colIndex, newR, true);
            }
        }

        setTimeout(() => resolveCascades(0), ANIM_MS * 2 + 20);
    }

    function findClusters() {
        const clusters = [];

        for (let r = 0; r < ROWS; r++) {
            let matchLength = 1;
            for (let c = 0; c < COLS; c++) {
                let checkCluster = false;
                if (c === COLS - 1) {
                    checkCluster = true;
                } else if (tiles[idx(c, r)].color === tiles[idx(c + 1, r)].color) {
                    matchLength++;
                } else {
                    checkCluster = true;
                }
                if (checkCluster) {
                    if (matchLength >= 3) clusters.push({ col: c + 1 - matchLength, row: r, length: matchLength, horizontal: true });
                    matchLength = 1;
                }
            }
        }

        for (let c = 0; c < COLS; c++) {
            let matchLength = 1;
            for (let r = 0; r < ROWS; r++) {
                let checkCluster = false;
                if (r === ROWS - 1) {
                    checkCluster = true;
                } else if (tiles[idx(c, r)].color === tiles[idx(c, r + 1)].color) {
                    matchLength++;
                } else {
                    checkCluster = true;
                }
                if (checkCluster) {
                    if (matchLength >= 3) clusters.push({ col: c, row: r + 1 - matchLength, length: matchLength, horizontal: false });
                    matchLength = 1;
                }
            }
        }

        return clusters;
    }

    function resolveCascades(comboLevel) {
        const clusters = findClusters();

        if (clusters.length === 0) {
            busy = false;
            setArrowsEnabled(true);
            return;
        }

        busy = true;
        comboLevel++;
        score += clusters.length;
        updateInfo();
        playgood();

        if (score >= 99 && !gameWon) {
            gameWon = true;
            setTimeout(() => {
                playwin();
                setTimeout(() => {
                    alert("Ganaste 🏆");
                }, 2000);
            }, 2000);
        }

        const toRemove = [];
        clusters.forEach(cluster => {
            for (let k = 0; k < cluster.length; k++) {
                const c = cluster.horizontal ? cluster.col + k : cluster.col;
                const r = cluster.horizontal ? cluster.row : cluster.row + k;
                const t = tiles[idx(c, r)];
                const el = elements.get(t.id);
                if (el) el.classList.add('matched');
                toRemove.push(t.id);
            }
        });

        setTimeout(() => {
            toRemove.forEach(id => {
                const el = elements.get(id);
                if (el && el.parentNode) el.parentNode.removeChild(el);
                elements.delete(id);
            });

            clusters.forEach(cluster => {
                for (let k = 0; k < cluster.length; k++) {
                    const c = cluster.horizontal ? cluster.col + k : cluster.col;
                    const r = cluster.horizontal ? cluster.row : cluster.row + k;
                    tiles[idx(c, r)] = null;
                }
            });

            applyGravityAnimated();

            setTimeout(() => resolveCascades(comboLevel), ANIM_MS + 60);
        }, 350);
    }

    function applyGravityAnimated() {
        for (let c = 0; c < COLS; c++) {
            const survivors = [];
            for (let r = 0; r < ROWS; r++) {
                const t = tiles[idx(c, r)];
                if (t) survivors.push(t);
            }
            const missing = ROWS - survivors.length;
            const newTiles = [];
            for (let k = 0; k < missing; k++) newTiles.push(createTile());

            const merged = newTiles.concat(survivors);
            for (let r = 0; r < ROWS; r++) tiles[idx(c, r)] = merged[r];

            merged.forEach((t, r) => {
                let el = elements.get(t.id);
                if (!el) {
                    el = makeStarElement(t);
                    setPos(el, c, r - missing, false);
                    gridEl.appendChild(el);
                    elements.set(t.id, el);
                    void el.offsetWidth;
                }
                setPos(el, c, r, true);
            });
        }
    }

    function updateInfo() {
        scoreInfo.innerHTML = `Puntaje: <span class="highlight">${score}</span>`;
    }

    createArrows();
    initTiles();
    buildElements();
    updateInfo();
</script>

<script>
document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
});
</script>

</body>
</html>
