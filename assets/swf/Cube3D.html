<!DOCTYPE html>
<html>
<head>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<style>
        .dpad-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px 25px 25px 25px;
            border-radius: 30px;
            backdrop-filter: blur(2px);
        }

        @media (max-width: 768px) {
            .dpad-container {
                display: block;
            }
        }

        .dpad-grid {
            display: grid;
            grid-template-columns: 90px 90px 90px;
            grid-template-rows: 90px 90px 90px;
            gap: 8px;
            justify-items: center;
            align-items: center;
        }

        .dpad-btn {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 5px;
            font-size: 42px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            touch-action: none;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
            background-color: #a8e6a3;
            color: #1e5e1e;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .dpad-btn:active {
            transform: scale(0.94);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.2);
        }

        .btn-up {
            grid-column: 2;
            grid-row: 1;
        }
        .btn-left {
            grid-column: 1;
            grid-row: 2;
        }
        .btn-space {
            grid-column: 2;
            grid-row: 2;
            background-color: #b5eab0;
            font-size: 38px;
        }
        .btn-right {
            grid-column: 3;
            grid-row: 2;
        }
        .btn-down {
            grid-column: 2;
            grid-row: 3;
        }

        .btn-space .space-symbol {
            font-size: 44px;
            line-height: 1;
            transform: scale(1.1);
            display: inline-block;
        }

        .dpad-btn .arrow {
            display: inline-block;
            line-height: 1;
            transform: scale(1.2);
        }

        .dpad-btn {
            font-family: 'Segoe UI', 'Arial Unicode MS', sans-serif;
        }

        @media (max-width: 600px) {
            .dpad-grid {
                grid-template-columns: 75px 75px 75px;
                grid-template-rows: 75px 75px 75px;
                gap: 6px;
            }
            .dpad-btn {
                font-size: 34px;
            }
            .btn-space .space-symbol {
                font-size: 36px;
            }
            .dpad-container {
                padding: 12px 12px 16px 12px;
                bottom: 15px;
            }
        }
</style>
</head>
<body>
<embed src="Cube3D.swf" width="950" height="750" id="ruffle-embed">

<div class="dpad-container" id="dpadContainer">
<div class="dpad-grid">
    <button class="dpad-btn btn-up" data-key="ArrowUp" data-code="ArrowUp" data-keycode="38">
         <span class="arrow">▲</span>
    </button>
    <button class="dpad-btn btn-left" data-key="ArrowLeft" data-code="ArrowLeft" data-keycode="37">
         <span class="arrow">◀</span>
    </button>
    <button class="dpad-btn btn-space" data-key=" " data-code="Space" data-keycode="32">
         <span class="space-symbol">␣</span>
    </button>
    <button class="dpad-btn btn-right" data-key="ArrowRight" data-code="ArrowRight" data-keycode="39">
        <span class="arrow">▶</span>
   </button>
   <button class="dpad-btn btn-down" data-key="ArrowDown" data-code="ArrowDown" data-keycode="40">
       <span class="arrow">▼</span>
   </button>
</div>
</div>

<script>
        (function() {
            'use strict';
            function getRuffleEmbed() {
                let ruffle = document.querySelector('ruffle-embed');
                if (ruffle) return ruffle;
                return document.querySelector('embed');
            }

            function sendKeyEvent(key, code, keyCode, type) {
                const ruffleEmbed = getRuffleEmbed();
                if (!ruffleEmbed) {
                    console.warn('No se encontró el embed de Ruffle');
                    return;
                }

                try {
                    ruffleEmbed.focus();
                } catch (_) { /* ignore */ }

                const event = new KeyboardEvent(type, {
                    key: key,
                    code: code,
                    keyCode: keyCode,
                    which: keyCode,
                    bubbles: true,
                    cancelable: true,
                    composed: true
                });

                ruffleEmbed.dispatchEvent(event);
            }

            const buttons = document.querySelectorAll('.dpad-btn');

            buttons.forEach(btn => {
                const key = btn.getAttribute('data-key');
                const code = btn.getAttribute('data-code');
                const keyCode = parseInt(btn.getAttribute('data-keycode'), 10);

                if (!key || !code || isNaN(keyCode)) {
                    console.warn('Botón sin datos válidos:', btn);
                    return;
                }

                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    sendKeyEvent(key, code, keyCode, 'keydown');
                });

                btn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    sendKeyEvent(key, code, keyCode, 'keyup');
                });

                btn.addEventListener('touchcancel', (e) => {
                    e.preventDefault();
                    sendKeyEvent(key, code, keyCode, 'keyup');
                });

                btn.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    sendKeyEvent(key, code, keyCode, 'keydown');
                });

                btn.addEventListener('mouseup', (e) => {
                    e.preventDefault();
                    sendKeyEvent(key, code, keyCode, 'keyup');
                });

                btn.addEventListener('focus', (e) => e.preventDefault());
            });

            console.log('✅ D-pad cargado con botones en cruz y espacio central (visible solo en móviles)');
        })();
</script>

</body>
</html>
