<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>PuzzleX by Carlos Sivila</title>

<style>
/* ===== RESET Y BASE ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #000000;
  font-family: Arial, sans-serif;
  color: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 0;
  overflow-y: auto;
  overflow-x: hidden;
}

@font-face {
  font-family: 'font';
  src: url('font.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}

:root {
  --neon-lime:   #00ff00;
  --neon-cyan:   #00fff7;
  --neon-yellow: #ffff00;
  --neon-green:  #39ff14;
  --bg:          #000000;
}

/* ===== EFECTO SCANLINE ===== */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 3px,
    rgba(0,0,0,0.18) 3px,
    rgba(0,0,0,0.18) 4px
  );
  pointer-events: none;
  z-index: 999;
}

/* ===== MENÚ ===== */
#menu-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 5px 16px 24px;
  overflow: auto;
  width: 100%;
  max-width: 1200px;
}

.header-block {
  text-align: center;
  margin-bottom: 5px;
}

h1 {
  font-family: Arial, sans-serif;
  font-size: clamp(2rem, 10vw, 3.8rem);
  letter-spacing: 0.1em;
  color: var(--neon-lime);
  text-shadow: 0 0 8px var(--neon-lime), 0 0 28px var(--neon-lime), 0 0 70px var(--neon-lime);
  animation: flicker 5s infinite;
  line-height: 1.1;
}

.subtitle {
  font-family: Arial, sans-serif;
  font-size: clamp(1.15rem, 2.5vw, 1.35rem);
  letter-spacing: 0.35em;
  color: var(--neon-cyan);
  text-shadow: 0 0 6px var(--neon-cyan), 0 0 16px var(--neon-cyan);
  margin-top: 4px;
}

.clock-wrap {
  margin-top: 6px;
  display: flex;
  justify-content: center;
  gap: 16px;
}

.clock-wrap .main_time,
.clock-wrap .main_date {
  font-family: 'font', Arial, monospace;
  font-size: clamp(1.125rem, 2.5vw, 1.26rem);
  color: red;
  letter-spacing: 0.15em;
}

.symbols-row {
  margin-top: 8px;
  display: flex;
  gap: 24px;
  justify-content: center;
}

.symbols-row span {
  font-size: 2rem;
  color: yellow;
  opacity: 0.75;
  display: inline-block;
  animation: spin3d 10s linear infinite;
}

hr {
  border: none;
  height: 1px;
  background: linear-gradient(90deg, transparent, #ff5c00, transparent);
  width: 100%;
  flex-shrink: 0;
  margin: 10px 0;
}

.menu {
  font-size: 24px;
  letter-spacing: 2px;
  font-family: 'font', Arial, monospace;
}

a:link, a:visited {
  text-decoration: none;
  color: orange;
}
a:hover {
  text-decoration: none;
  color: red;
}

/* ===== GRID DE VIDEOS (tal cual lo tienes) ===== */
.video-grid {
  width: 100%;
  max-width: 700px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin: 18px auto;
}

.video-cell {
  position: relative;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: #0a0a0a;
  border: 1px solid #1a1a1a;
  cursor: pointer;
  transition: border 0.3s, box-shadow 0.3s;
}

.video-cell iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
  pointer-events: none;
}

.video-cell:hover {
  border-color: var(--neon-cyan);
  box-shadow: 0 0 14px rgba(0,255,247,0.15);
}

/* ======================================== */
/* CARRUSEL 3D (tal cual lo tienes) */
/* ======================================== */
.image-container {
  position: relative;
  width: 100px;
  height: 100px;
  transform-style: preserve-3d;
  transform: perspective(600px) rotateY(0deg);
  transition: transform 0.7s;
  margin-bottom: 30px;
}

.image-container span {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  transform: rotateY(calc(var(--i) * 45deg)) translateZ(120px);
  cursor: pointer;
}

.image-container span img {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  border-radius: 5px;
}

.video-label {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0, 0, 0, 0.8);
  color: white;
  padding: 5px 10px;
  border-radius: 5px;
  font-size: 12px;
  font-weight: bold;
  pointer-events: none;
  z-index: 10;
}

.btn-container {
  position: relative;
  width: 80%;
  max-width: 500px;
  display: flex;
  justify-content: space-between;
  padding: 0 20px;
  box-sizing: border-box;
  gap: 10px;
}

.btn {
  background: green;
  color: lime;
  border: 1px solid green;
  padding: 10px 20px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
}

.btn:hover {
  background: lime;
  color: red;
  border: 1px solid cyan;
  filter: brightness(1.5);
}

.btn:active {
  background: lime;
  color: blue;
  border: 1px solid yellow;
  filter: brightness(1.5);
}

/* ======================================== */
/* OVERLAY - VENTANA COMPLETA (LA MISMA LÓGICA QUE FUNCIONÓ) */
/* ======================================== */
.video-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: #000;
  z-index: 10000;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

.video-overlay.active {
  display: flex;
}

.video-overlay .video-wrapper {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
}

.video-overlay iframe {
  width: 100vw;
  height: 100vh;
  border: none;
  background: #000;
  display: block;
}

/* Botón de cerrar - siempre visible en la esquina superior derecha */
.video-overlay .close-btn {
  position: fixed;
  top: 20px;
  right: 20px;
  width: 50px;
  height: 50px;
  background: rgba(0,0,0,0.85);
  color: #ff4444;
  border: 2px solid #ff4444;
  border-radius: 50%;
  font-size: 32px;
  font-weight: bold;
  cursor: pointer;
  z-index: 10001;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
  pointer-events: auto;
  line-height: 1;
  text-shadow: 0 0 10px rgba(255,68,68,0.5);
}

.video-overlay .close-btn:hover {
  background: #ff4444;
  color: #000;
  transform: scale(1.1);
  box-shadow: 0 0 30px rgba(255,68,68,0.4);
}

.video-overlay .close-btn:active {
  transform: scale(0.9);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .video-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }
  
  .video-overlay .close-btn {
    top: 10px;
    right: 10px;
    width: 44px;
    height: 44px;
    font-size: 28px;
  }
  
  .video-overlay iframe {
    width: 100vw;
    height: 100vh;
  }

  .image-container {
    width: 80px;
    height: 80px;
  }
  
  .image-container span {
    transform: rotateY(calc(var(--i) * 45deg)) translateZ(80px);
  }
  
  .btn {
    padding: 12px 20px;
    font-size: 16px;
  }
}

@media (max-width: 480px) {
  .video-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
  }
}

@media (max-width: 768px) and (orientation: landscape) {
  .video-overlay .close-btn {
    top: 8px;
    right: 8px;
    width: 40px;
    height: 40px;
    font-size: 24px;
  }

  .image-container {
    width: 200px;
    height: 200px;
  }
  
  .image-container span {
    transform: rotateY(calc(var(--i) * 45deg)) translateZ(200px);
  }
  
  .btn-container {
    max-width: 600px;
  }
  
  .btn {
    padding: 15px 30px;
    font-size: 18px;
  }
}

/* ===== ANIMACIONES ===== */
@keyframes spin3d {
  0%   { transform: rotateY(0deg); }
  100% { transform: rotateY(360deg); }
}

@keyframes flicker {
  0%, 95%, 100% { opacity: 1; }
  96%           { opacity: 0.85; }
  97%           { opacity: 1; }
  98%           { opacity: 0.7; }
  99%           { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>

  // ======================================== */
  // FUNCIONES UTILITARIAS
  // ======================================== */

  function getYouTubeID(url) {
    const match = url.match(/[?&]v=([^&]+)/);
    if (match && match[1]) return match[1];
    const embedMatch = url.match(/\/embed\/([^?&]+)/);
    if (embedMatch && embedMatch[1]) return embedMatch[1];
    return null;
  }

  function toEmbedUrl(url) {
    const id = getYouTubeID(url);
    if (id) {
      return `https://www.youtube.com/embed/${id}?autoplay=1&controls=1&fs=1&rel=0&modestbranding=1`;
    }
    if (url.includes('/embed/')) {
      return url + (url.includes('?') ? '&' : '?') + 'autoplay=1';
    }
    return url;
  }

  function extractVideoInfo(iframeSrc) {
    const ytMatch = iframeSrc.match(/\/embed\/([^?&]+)/);
    if (ytMatch) {
      return {
        type: 'youtube',
        id: ytMatch[1],
        url: `https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1&controls=1&fs=1&rel=0&modestbranding=1`
      };
    }
    const okMatch = iframeSrc.match(/\/videoembed\/(\d+)/);
    if (okMatch) {
      return {
        type: 'okru',
        id: okMatch[1],
        url: `https://ok.ru/videoembed/${okMatch[1]}?autoplay=1`
      };
    }
    return null;
  }

  // ======================================== */
  // FORZAR ORIENTACIÓN HORIZONTAL
  // ======================================== */
  function forceLandscape() {
    try {
      if (window.screen && window.screen.orientation) {
        window.screen.orientation.lock('landscape').catch(function(error) {
          console.log('No se pudo bloquear orientación:', error);
        });
      }
    } catch(e) {
      console.log('Error al forzar landscape:', e);
    }
  }

  function unlockOrientation() {
    try {
      if (window.screen && window.screen.orientation) {
        window.screen.orientation.unlock().catch(function(error) {
          console.log('No se pudo desbloquear orientación:', error);
        });
      }
    } catch(e) {}
  }

  // ======================================== */
  // OVERLAY - VENTANA COMPLETA
  // ======================================== */
  const videoOverlay = document.getElementById('videoOverlay');
  const overlayIframe = document.getElementById('overlayIframe');
  const closeOverlayBtn = document.getElementById('closeOverlay');

  function openVideoOverlay(url) {
    if (videoOverlay.classList.contains('active')) {
      closeVideoOverlay();
      setTimeout(function() {
        openVideoOverlay(url);
      }, 300);
      return;
    }

    let finalUrl = url;
    const ytId = getYouTubeID(url);
    if (ytId) {
      finalUrl = `https://www.youtube.com/embed/${ytId}?autoplay=1&controls=1&fs=1&rel=0&modestbranding=1`;
    } else if (url.includes('/embed/') && !url.includes('autoplay')) {
      finalUrl = url + (url.includes('?') ? '&' : '?') + 'autoplay=1';
    }

    overlayIframe.src = finalUrl;
    videoOverlay.classList.add('active');
    forceLandscape();

    try {
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
      } else if (document.documentElement.webkitRequestFullscreen) {
        document.documentElement.webkitRequestFullscreen();
      } else if (document.documentElement.msRequestFullscreen) {
        document.documentElement.msRequestFullscreen();
      }
    } catch(e) {}
  }

  function closeVideoOverlay() {
    overlayIframe.src = '';
    videoOverlay.classList.remove('active');
    unlockOrientation();

    try {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (document.msExitFullscreen) {
        document.msExitFullscreen();
      }
    } catch(e) {}
  }

  closeOverlayBtn.addEventListener('click', closeVideoOverlay);

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && videoOverlay.classList.contains('active')) {
      closeVideoOverlay();
    }
  });

  videoOverlay.addEventListener('click', function(e) {
    if (e.target === this) {
      closeVideoOverlay();
    }
  });

  // ======================================== */
  // CLIC EN EL GRID DE VIDEOS
  // ======================================== */
  document.querySelectorAll('.video-cell').forEach(function(cell) {
    cell.addEventListener('click', function() {
      const iframe = this.querySelector('iframe');
      if (iframe && iframe.src) {
        const info = extractVideoInfo(iframe.src);
        if (info) {
          openVideoOverlay(info.url);
        }
      }
    });
  });

  // ======================================== */
  // CARRUSEL 3D - INICIALIZAR CON VIDEOS ALEATORIOS
  // ======================================== */
  function initCarousel() {
    const shuffled = [...videos];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    const selected = shuffled.slice(0, 8);

    const spans = document.querySelectorAll('.image-container span');
    spans.forEach(function(span, index) {
      const videoUrl = selected[index % selected.length];
      const videoId = getYouTubeID(videoUrl);
      const img = span.querySelector('img');
      const label = span.querySelector('.video-label');

      if (videoId) {
        img.src = `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`;
        label.textContent = `Video ${index + 1}`;
        span.dataset.videoSrc = videoUrl;
      }
    });
  }

  // ======================================== */
  // CLIC EN CARRUSEL
  // ======================================== */
  document.querySelectorAll('.image-container span').forEach(function(span) {
    span.addEventListener('click', function() {
      const url = this.dataset.videoSrc;
      if (url) {
        openVideoOverlay(url);
      }
    });
  });

  // ======================================== */
  // BOTONES DEL CARRUSEL
  // ======================================== */
  const imageContainer = document.getElementById('carouselContainer');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  const refreshBtn = document.getElementById('refresh');

  let x = 0;

  prevBtn.addEventListener('click', function() {
    x += 45;
    imageContainer.style.transform = `perspective(600px) rotateY(${x}deg)`;
  });

  nextBtn.addEventListener('click', function() {
    x -= 45;
    imageContainer.style.transform = `perspective(600px) rotateY(${x}deg)`;
  });

  refreshBtn.addEventListener('click', function() {
    location.reload();
  });

  // ======================================== */
  // RELOJ
  // ======================================== */
  const dayNames = ['Domingo','Lunes','Martes','Miercoles','Jueves','Viernes','Sabado'];
  function pad(n) { return String(n).padStart(2,'0'); }

  function updateClock() {
    const now = new Date();
    document.getElementById('time').textContent =
      `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    document.getElementById('date').textContent =
      `${dayNames[now.getDay()]}, ${pad(now.getDate())} / ${pad(now.getMonth()+1)} / ${now.getFullYear()}`;
  }

  updateClock();
  setInterval(updateClock, 1000);

  // ======================================== */
  // ALINEAR SUBTÍTULO
  // ======================================== */
  (function alignSubtitle() {
    const h1 = document.querySelector('h1');
    const subtitle = document.querySelector('.subtitle');
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const style = window.getComputedStyle(h1);
    ctx.font = style.fontSize + ' ' + style.fontFamily;
    const emojiWidth = ctx.measureText('🧩 ').width;
    if (subtitle) {
      subtitle.style.paddingLeft = emojiWidth + 'px';
    }
  })();

  // ======================================== */
  // INICIALIZAR CARRUSEL
  // ======================================== */
  window.addEventListener('load', function() {
    setTimeout(initCarousel, 500);
  });

})();
