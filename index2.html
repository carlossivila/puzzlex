<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Reproductor Overlay</title>
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1e1e2f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ===== CONTENEDOR DE LINKS ===== */
        .links-container {
            background: #2a2a40;
            padding: 2.5rem 2rem;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }

        .links-container h1 {
            color: #fff;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .links-container p {
            color: #aaa;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .link-item {
            display: block;
            background: #3a3a55;
            color: #fff;
            padding: 1rem 1.2rem;
            margin-bottom: 1rem;
            border-radius: 12px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: background 0.25s, transform 0.15s;
            cursor: pointer;
            border: 1px solid #555577;
            word-break: break-all;
        }

        .link-item:hover {
            background: #4f4f70;
            transform: scale(1.02);
        }

        .link-item:active {
            transform: scale(0.97);
        }

        .link-item .badge {
            display: inline-block;
            font-size: 0.7rem;
            background: #6c6c9a;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            margin-left: 0.5rem;
            color: #fff;
            font-weight: 400;
        }

        /* ===== OVERLAY ===== */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            display: none; /* oculto por defecto */
            justify-content: center;
            align-items: center;
            flex-direction: column;
            /* Forzamos landscape en celular vía JS, pero también con CSS */
        }

        /* Contenedor del iframe: ocupa TODO el overlay */
        #video-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        #video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ===== BOTÓN CERRAR "X" ===== */
        #close-btn {
            position: fixed;
            top: 20px;
            right: 25px;
            z-index: 10000;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 28px;
            font-weight: 700;
            line-height: 48px;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            user-select: none;
            font-family: Arial, sans-serif;
            display: none; /* se muestra solo cuando overlay está activo */
        }

        #close-btn:hover {
            background: rgba(200, 30, 30, 0.9);
            transform: scale(1.1);
        }

        #close-btn:active {
            transform: scale(0.9);
        }

        /* ===== RESPONSIVE: Ajustes menores ===== */
        @media (max-width: 600px) {
            .links-container {
                padding: 1.8rem 1.2rem;
            }
            .links-container h1 {
                font-size: 1.4rem;
            }
            .link-item {
                font-size: 0.85rem;
                padding: 0.9rem 1rem;
            }
            #close-btn {
                width: 44px;
                height: 44px;
                font-size: 24px;
                line-height: 44px;
                top: 15px;
                right: 18px;
            }
        }

        /* ===== ORIENTACIÓN: forzamos landscape en móvil ===== */
        /* Esto es un respaldo CSS, pero la fuerza real la hará JS con screen.orientation.lock() */
        @media (max-width: 768px) and (orientation: portrait) {
            /* Solo un aviso visual si no se pudiera bloquear por algún motivo */
            #overlay.active-portrait-warning::after {
                content: "📱 Gira tu celular a horizontal";
                position: absolute;
                bottom: 40px;
                left: 0;
                width: 100%;
                text-align: center;
                color: #fff;
                background: rgba(0,0,0,0.6);
                padding: 12px 0;
                font-size: 1rem;
                z-index: 10001;
                pointer-events: none;
            }
        }
    </style>
</head>
<body>

    <!-- ========================================================= -->
    <!-- CONTENEDOR DE LINKS                                        -->
    <!-- ========================================================= -->
    <div class="links-container">
        <h1>🎬 Mis Videos</h1>
        <p>Haz clic en cualquier enlace para reproducir en pantalla completa</p>

        <!-- Link 1: OK.ru -->
        <div class="link-item" data-url="https://ok.ru/videoembed/4055745694421">
            ▶️ The Classic Project - Megamix Vol.12 (OK.ru)
            <span class="badge">OK.ru</span>
        </div>

        <!-- Link 2: YouTube embed -->
        <div class="link-item" data-url="https://www.youtube.com/embed/wyXftCua16k?si=ssTY7kzhHuEhpXmB">
            ▶️ Video YouTube (embed)
            <span class="badge">YouTube</span>
        </div>

        <!-- Link 3: YouTube normal -->
        <div class="link-item" data-url="https://www.youtube.com/watch?v=FMEsoC2SAFc">
            ▶️ Otro video YouTube
            <span class="badge">YouTube</span>
        </div>
    </div>

    <!-- ========================================================= -->
    <!-- OVERLAY (pantalla completa)                                -->
    <!-- ========================================================= -->
    <div id="overlay">
        <div id="video-wrapper">
            <iframe id="player-iframe" src="" allowfullscreen></iframe>
        </div>
    </div>

    <!-- Botón Cerrar "X" (fuera del overlay para que esté siempre visible) -->
    <div id="close-btn">✕</div>

    <!-- ========================================================= -->
    <!-- JAVASCRIPT                                                -->
    <!-- ========================================================= -->
    <script>
        (function() {
            'use strict';

            // ----- ELEMENTOS -----
            const overlay = document.getElementById('overlay');
            const closeBtn = document.getElementById('close-btn');
            const iframe = document.getElementById('player-iframe');
            const linkItems = document.querySelectorAll('.link-item');

            // Variable para controlar si estamos en overlay
            let isOpen = false;

            // ----- FUNCIÓN PARA CERRAR -----
            function closeOverlay() {
                if (!isOpen) return;

                // 1. Salir de pantalla completa si estamos en fullscreen
                if (document.fullscreenElement) {
                    document.exitFullscreen().catch(function(err) {
                        // Si falla, ignoramos (puede ser por políticas del navegador)
                        console.warn('Error al salir de fullscreen:', err);
                    });
                }

                // 2. Liberar bloqueo de orientación (si existe)
                if (screen.orientation && screen.orientation.unlock) {
                    try {
                        screen.orientation.unlock();
                    } catch (e) {
                        // algunos navegadores no soportan unlock
                    }
                }

                // 3. Ocultar overlay y botón
                overlay.style.display = 'none';
                closeBtn.style.display = 'none';
                iframe.src = ''; // limpiamos el src para que el video se detenga
                isOpen = false;

                // Remover clase de advertencia de orientación si existe
                overlay.classList.remove('active-portrait-warning');
            }

            // ----- FUNCIÓN PARA ABRIR -----
            function openOverlay(url) {
                // Si ya está abierto, cerramos primero (para limpiar)
                if (isOpen) {
                    closeOverlay();
                    // Pequeño delay para que se cierre bien antes de abrir de nuevo
                    setTimeout(function() {
                        openOverlay(url);
                    }, 300);
                    return;
                }

                // 1. Asignar URL al iframe
                iframe.src = url;

                // 2. Mostrar overlay y botón cerrar
                overlay.style.display = 'flex';
                closeBtn.style.display = 'block';
                isOpen = true;

                // 3. Solicitar pantalla completa (fullscreen)
                //    Esperamos un poco para que el DOM se actualice
                setTimeout(function() {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen()
                            .then(function() {
                                // Fullscreen activado correctamente
                            })
                            .catch(function(err) {
                                // Puede fallar si el usuario no hizo clic directo,
                                // pero como venimos de un clic en el link, debería funcionar.
                                console.warn('No se pudo activar fullscreen:', err);
                            });
                    }
                }, 100);

                // 4. Forzar orientación horizontal en celular (landscape)
                //    Usamos screen.orientation.lock() si está disponible
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape')
                        .then(function() {
                            // Landscape bloqueado correctamente
                            overlay.classList.remove('active-portrait-warning');
                        })
                        .catch(function(err) {
                            console.warn('No se pudo bloquear orientación landscape:', err);
                            // Mostrar un aviso visual al usuario (opcional)
                            overlay.classList.add('active-portrait-warning');
                            // Intentamos de nuevo con un pequeño retraso (a veces funciona al segundo intento)
                            setTimeout(function() {
                                if (screen.orientation && screen.orientation.lock) {
                                    screen.orientation.lock('landscape').catch(function() {});
                                }
                            }, 500);
                        });
                } else {
                    // Si no soporta screen.orientation, mostramos aviso (pero no podemos forzar)
                    overlay.classList.add('active-portrait-warning');
                }
            }

            // ----- EVENTOS: clic en cada link -----
            linkItems.forEach(function(item) {
                item.addEventListener('click', function(e) {
                    const url = this.getAttribute('data-url');
                    if (url) {
                        openOverlay(url);
                    } else {
                        console.warn('El link no tiene data-url');
                    }
                });
            });

            // ----- EVENTO: botón cerrar -----
            closeBtn.addEventListener('click', function(e) {
                e.stopPropagation(); // Evita que se propague al overlay
                closeOverlay();
            });

            // ----- EVENTO: tecla ESC para cerrar -----
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && isOpen) {
                    closeOverlay();
                }
            });

            // ----- EVENTO: cambio de orientación (por si acaso) -----
            // Si el usuario gira el celular y estamos en overlay, forzamos landscape nuevamente
            window.addEventListener('orientationchange', function() {
                if (isOpen && screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(function() {});
                }
            });

            // ----- EVENTO: cuando se sale de fullscreen manualmente (Ej: F11 en PC) -----
            document.addEventListener('fullscreenchange', function() {
                // Si se salió de fullscreen pero el overlay sigue abierto, lo cerramos
                if (!document.fullscreenElement && isOpen) {
                    // Pero solo si el overlay está visible
                    if (overlay.style.display === 'flex') {
                        closeOverlay();
                    }
                }
            });

            // ----- También al salir de fullscreen con ESC (complemento) -----
            document.addEventListener('webkitfullscreenchange', function() {
                if (!document.webkitFullscreenElement && isOpen) {
                    if (overlay.style.display === 'flex') {
                        closeOverlay();
                    }
                }
            });

            // ----- Prevenir que el overlay se cierre accidentalmente haciendo clic en él -----
            overlay.addEventListener('click', function(e) {
                // Si el clic fue directamente en el overlay (no en el iframe ni en el wrapper)
                // no hacemos nada, solo cerramos si el usuario quiere con la X o ESC.
                // Pero no cerramos al hacer clic en el overlay para evitar cierres accidentales.
                // (Opcional: podríamos cerrar si se hace clic en el fondo, pero mejor no)
                // Lo dejamos así: solo se cierra con X, ESC o fullscreenchange.
            });

            // ========================================================
            // INICIO: aseguramos que overlay y botón empiecen ocultos
            // ========================================================
            overlay.style.display = 'none';
            closeBtn.style.display = 'none';
            iframe.src = '';

            console.log('✅ Reproductor Overlay listo. Haz clic en cualquier link.');
        })();
    </script>

</body>
</html>
