<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mis Videos - Grid y Carrusel</title>
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1e1e2f;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        /* ===== CONTENEDOR PRINCIPAL ===== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-title {
            color: #fff;
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 0.3rem;
        }

        .page-subtitle {
            color: #aaa;
            text-align: center;
            font-size: 1rem;
            margin-bottom: 2.5rem;
        }

        /* ===== SECCIÓN ===== */
        .section {
            background: #2a2a40;
            border-radius: 16px;
            padding: 1.5rem 1.2rem;
            margin-bottom: 2.5rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        .section-title {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-title .badge {
            font-size: 0.7rem;
            background: #6c6c9a;
            padding: 0.15rem 0.8rem;
            border-radius: 30px;
            color: #fff;
            font-weight: 400;
        }

        .section-subtitle {
            color: #999;
            font-size: 0.85rem;
            margin-bottom: 1.2rem;
        }

        /* ===== GRID DE VIDEOS ===== */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }

        /* ===== TARJETA DE VIDEO ===== */
        .video-card {
            background: #3a3a55;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .video-card:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            border-color: #6c6c9a;
        }

        .video-card:active {
            transform: scale(0.97);
        }

        .video-card iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none;
            /* Evita que el iframe capture clics */;
        }

        .video-card .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            transition: background 0.3s;
            pointer-events: none;
        }

        .video-card:hover .play-overlay {
            background: rgba(0, 0, 0, 0.1);
        }

        .video-card .play-overlay .play-icon {
            font-size: 3.5rem;
            color: #fff;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
            opacity: 0.8;
            transition: opacity 0.3s, transform 0.3s;
        }

        .video-card:hover .play-overlay .play-icon {
            opacity: 1;
            transform: scale(1.1);
        }

        /* ===== OVERLAY ===== */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #video-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        #video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ===== BOTÓN CERRAR "X" ===== */
        #close-btn {
            position: fixed;
            top: 20px;
            right: 25px;
            z-index: 10000;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 28px;
            font-weight: 700;
            line-height: 48px;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            user-select: none;
            font-family: Arial, sans-serif;
            display: none;
        }

        #close-btn:hover {
            background: rgba(200, 30, 30, 0.9);
            transform: scale(1.1);
        }

        #close-btn:active {
            transform: scale(0.9);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .page-title {
                font-size: 1.6rem;
            }
            .section {
                padding: 1rem 0.8rem;
            }
            .video-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 0.7rem;
            }
            .video-card .play-overlay .play-icon {
                font-size: 2.5rem;
            }
            #close-btn {
                width: 44px;
                height: 44px;
                font-size: 24px;
                line-height: 44px;
                top: 15px;
                right: 18px;
            }
        }

        @media (max-width: 400px) {
            .video-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 0.5rem;
            }
            .section-title {
                font-size: 1.2rem;
            }
        }

        /* ===== AVISO DE ORIENTACIÓN (respaldo CSS) ===== */
        @media (max-width: 768px) and (orientation: portrait) {
            #overlay.active-portrait-warning::after {
                content: "📱 Gira tu celular a horizontal";
                position: absolute;
                bottom: 40px;
                left: 0;
                width: 100%;
                text-align: center;
                color: #fff;
                background: rgba(0, 0, 0, 0.6);
                padding: 12px 0;
                font-size: 1rem;
                z-index: 10001;
                pointer-events: none;
            }
        }
    </style>
</head>
<body>

    <!-- ========================================================= -->
    <!-- CONTENEDOR PRINCIPAL                                       -->
    <!-- ========================================================= -->
    <div class="container">
        <h1 class="page-title">🎬 Mis Videos</h1>
        <p class="page-subtitle">Haz clic en cualquier video para reproducir en pantalla completa</p>

        <!-- ========================================================= -->
        <!-- SECCIÓN: GRID (5 videos de OK.ru)                          -->
        <!-- ========================================================= -->
        <div class="section">
            <div class="section-title">
                📂 GRID
                <span class="badge">5 videos • OK.ru</span>
            </div>
            <p class="section-subtitle">Megamixes de los 70s y 80s</p>
            <div class="video-grid" id="gridContainer">
                <!-- Los 5 videos del Grid se generarán con JS -->
            </div>
        </div>

        <!-- ========================================================= -->
        <!-- SECCIÓN: CARRUSEL (5 videos de YouTube)                    -->
        <!-- ========================================================= -->
        <div class="section">
            <div class="section-title">
                📂 CARRUSEL
                <span class="badge">5 videos • YouTube</span>
            </div>
            <p class="page-subtitle" style="text-align:left; margin-bottom:1.2rem; font-size:0.9rem;">Éxitos de los 80s y 90s</p>
            <div class="video-grid" id="carruselContainer">
                <!-- Los 5 videos del Carrusel se generarán con JS -->
            </div>
        </div>
    </div>

    <!-- ========================================================= -->
    <!-- OVERLAY (pantalla completa)                                -->
    <!-- ========================================================= -->
    <div id="overlay">
        <div id="video-wrapper">
            <iframe id="player-iframe" src="" allowfullscreen></iframe>
        </div>
    </div>

    <!-- Botón Cerrar "X" -->
    <div id="close-btn">✕</div>

    <!-- ========================================================= -->
    <!-- JAVASCRIPT                                                -->
    <!-- ========================================================= -->
    <script>
        (function() {
            'use strict';

            // ======================================================
            // LISTAS DE VIDEOS
            // ======================================================

            // GRID: 5 videos de OK.ru
            const gridVideos = [
                'https://ok.ru/videoembed/4055745694421',
                'https://ok.ru/videoembed/4055729834709',
                'https://ok.ru/videoembed/4055670459093',
                'https://ok.ru/videoembed/2101613693653',
                'https://ok.ru/videoembed/2101603863253'
            ];

            // CARRUSEL: 5 videos de YouTube (formato watch)
            const carruselVideos = [
                'https://www.youtube.com/watch?v=FMEsoC2SAFc',
                'https://www.youtube.com/watch?v=CIJgAlNwweI',
                'https://www.youtube.com/watch?v=Sx3xFYU9cZ0',
                'https://www.youtube.com/watch?v=qw0D_KN2KN8',
                'https://www.youtube.com/watch?v=Qy4bgf4kG-I'
            ];

            // ======================================================
            // FUNCIÓN: convertir URL de YouTube a embed
            // ======================================================
            function convertirAEmbed(url) {
                // Si ya es embed, devolverla tal cual
                if (url.includes('/embed/')) return url;

                // Si es watch, extraer el ID
                const match = url.match(/[?&]v=([^&]+)/);
                if (match && match[1]) {
                    return 'https://www.youtube.com/embed/' + match[1];
                }

                // Si no se pudo convertir, devolver la original
                return url;
            }

            // ======================================================
            // FUNCIÓN: generar tarjetas de video
            // ======================================================
            function generarTarjetas(videos, contenedorId, esYouTube) {
                const container = document.getElementById(contenedorId);
                if (!container) return;

                container.innerHTML = '';

                videos.forEach(function(url) {
                    const card = document.createElement('div');
                    card.className = 'video-card';

                    // Determinar la URL a mostrar en el iframe (miniatura)
                    let embedUrl = url;
                    if (esYouTube) {
                        embedUrl = convertirAEmbed(url);
                        // Añadir autoplay=0 para que no se reproduzca automáticamente en el grid
                        embedUrl += (embedUrl.includes('?') ? '&' : '?') + 'autoplay=0';
                    }

                    // Crear iframe para la miniatura (con pointer-events: none)
                    const iframe = document.createElement('iframe');
                    iframe.src = embedUrl;
                    iframe.allow = 'accelerometer; encrypted-media; gyroscope; picture-in-picture';
                    iframe.allowFullscreen = true;
                    iframe.loading = 'lazy';

                    // Overlay con icono de play
                    const overlayIcon = document.createElement('div');
                    overlayIcon.className = 'play-overlay';
                    overlayIcon.innerHTML = '<span class="play-icon">▶</span>';

                    card.appendChild(iframe);
                    card.appendChild(overlayIcon);

                    // Al hacer clic en la tarjeta → abrir overlay
                    card.addEventListener('click', function(e) {
                        e.stopPropagation();
                        let urlParaReproducir = url;
                        if (esYouTube) {
                            urlParaReproducir = convertirAEmbed(url);
                        }
                        openOverlay(urlParaReproducir);
                    });

                    container.appendChild(card);
                });
            }

            // ======================================================
            // FUNCIONES DEL OVERLAY
            // ======================================================

            const overlay = document.getElementById('overlay');
            const closeBtn = document.getElementById('close-btn');
            const iframe = document.getElementById('player-iframe');
            let isOpen = false;

            function closeOverlay() {
                if (!isOpen) return;

                if (document.fullscreenElement) {
                    document.exitFullscreen().catch(function() {});
                }

                if (screen.orientation && screen.orientation.unlock) {
                    try {
                        screen.orientation.unlock();
                    } catch (e) {}
                }

                overlay.style.display = 'none';
                closeBtn.style.display = 'none';
                iframe.src = '';
                isOpen = false;
                overlay.classList.remove('active-portrait-warning');
            }

            function openOverlay(url) {
                if (isOpen) {
                    closeOverlay();
                    setTimeout(function() {
                        openOverlay(url);
                    }, 300);
                    return;
                }

                iframe.src = url;

                overlay.style.display = 'flex';
                closeBtn.style.display = 'block';
                isOpen = true;

                setTimeout(function() {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen()
                            .catch(function(err) {
                                console.warn('No se pudo activar fullscreen:', err);
                            });
                    }
                }, 100);

                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape')
                        .then(function() {
                            overlay.classList.remove('active-portrait-warning');
                        })
                        .catch(function(err) {
                            console.warn('No se pudo bloquear orientación landscape:', err);
                            overlay.classList.add('active-portrait-warning');
                            setTimeout(function() {
                                if (screen.orientation && screen.orientation.lock) {
                                    screen.orientation.lock('landscape').catch(function() {});
                                }
                            }, 500);
                        });
                } else {
                    overlay.classList.add('active-portrait-warning');
                }
            }

            // ======================================================
            // EVENTOS
            // ======================================================

            closeBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                closeOverlay();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && isOpen) {
                    closeOverlay();
                }
            });

            document.addEventListener('fullscreenchange', function() {
                if (!document.fullscreenElement && isOpen) {
                    if (overlay.style.display === 'flex') {
                        closeOverlay();
                    }
                }
            });

            // ======================================================
            // INICIALIZAR: generar las tarjetas
            // ======================================================

            generarTarjetas(gridVideos, 'gridContainer', false);
            generarTarjetas(carruselVideos, 'carruselContainer', true);

            // Ocultar overlay al inicio
            overlay.style.display = 'none';
            closeBtn.style.display = 'none';
            iframe.src = '';

            console.log('✅ Reproductor con Grid y Carrusel listo.');
            console.log(`📂 Grid: ${gridVideos.length} videos`);
            console.log(`📂 Carrusel: ${carruselVideos.length} videos`);

        })();
    </script>

</body>
</html>
