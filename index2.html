<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #000000;
  font-family: Arial, sans-serif;
  color: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 0;
  overflow-y: auto;
  overflow-x: hidden;
}

@font-face {
  font-family: 'font';
  src: url('font.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}

:root {
  --neon-lime:   #00ff00;
  --neon-cyan:   #00fff7;
  --neon-yellow: #ffff00;
  --neon-green:  #39ff14;
  --bg:          #000000;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 3px,
    rgba(0,0,0,0.18) 3px,
    rgba(0,0,0,0.18) 4px
  );
  pointer-events: none;
  z-index: 999;
}

#menu-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 5px 16px 24px;
  overflow: auto;
  width: 100%;
  max-width: 1200px;
}

.header-block {
  text-align: center;
  margin-bottom: 5px;
}

h1 {
  font-family: Arial, sans-serif;
  font-size: clamp(2rem, 10vw, 3.8rem);
  letter-spacing: 0.1em;
  color: var(--neon-lime);
  text-shadow: 0 0 8px var(--neon-lime), 0 0 28px var(--neon-lime), 0 0 70px var(--neon-lime);
  animation: flicker 5s infinite;
  line-height: 1.1;
}

.subtitle {
  font-family: Arial, sans-serif;
  font-size: clamp(1.15rem, 2.5vw, 1.35rem);
  letter-spacing: 0.35em;
  color: var(--neon-cyan);
  text-shadow: 0 0 6px var(--neon-cyan), 0 0 16px var(--neon-cyan);
  margin-top: 4px;
}

.clock-wrap {
  margin-top: 6px;
  display: flex;
  justify-content: center;
  gap: 16px;
}

.clock-wrap .main_time,
.clock-wrap .main_date {
  font-family: 'font', Arial, monospace;
  font-size: clamp(1.125rem, 2.5vw, 1.26rem);
  color: red;
  letter-spacing: 0.15em;
}

.symbols-row {
  margin-top: 8px;
  display: flex;
  gap: 24px;
  justify-content: center;
}

.symbols-row span {
  font-size: 2rem;
  color: yellow;
  opacity: 0.75;
  display: inline-block;
  animation: spin3d 10s linear infinite;
}

hr {
     border: none;
     height: 1px;
     background: linear-gradient(90deg, transparent, #ff5c00, transparent);
     width: 100%;
     flex-shrink: 0;
}

.menu {
  font-size: 24px;
  letter-spacing: 2px;
  font-family: 'font', Arial, monospace;
}

a:link, a:visited {
  text-decoration: none;
  color: orange;
}
a:hover {
  text-decoration: none;
  color: red;
}

.video-grid {
  width: 100%;
  max-width: 700px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin: 18px auto;
}

.video-cell {
  position: relative;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: #0a0a0a;
  border: 1px solid #1a1a1a;
  cursor: pointer;
  transition: border 0.3s, box-shadow 0.3s;
}

.video-cell iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
  pointer-events: none;
}

.video-cell:hover {
  border-color: var(--neon-cyan);
  box-shadow: 0 0 14px rgba(0,255,247,0.15);
}

.btn-container {
  display: flex;
  justify-content: center;
  gap: 1.8rem;
  margin-top: 2.2rem;
  flex-wrap: wrap;
}

.btn {
  background: rgba(0, 255, 0, 0.08);
  color: #00ff00;
  border: 2px solid #00ff00;
  padding: 0.8rem 2rem;
  border-radius: 60px;
  cursor: pointer;
  font-size: 1.4rem;
  font-weight: bold;
  transition: all 0.25s ease;
  min-width: 70px;
  min-height: 60px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-shadow: 0 0 12px rgba(0, 255, 0, 0.3);
  box-shadow: 0 0 18px rgba(0, 255, 0, 0.08);
  letter-spacing: 1px;
  background: #0c0c0c;
  user-select: none;
}

.btn:hover {
  background: #00ff00;
  color: #000;
  border-color: #00ffff;
  box-shadow: 0 0 35px rgba(0, 255, 0, 0.3);
  transform: scale(1.06);
}

.btn:active {
  transform: scale(0.94);
}

#refresh {
  background: rgba(255, 165, 0, 0.08);
  border-color: #ff8c00;
  color: #ff8c00;
}

#refresh:hover {
  background: #ff8c00;
  color: #000;
  border-color: #ffff00;
}

#play-btn {
  background: rgba(0, 150, 255, 0.08);
  border-color: #0099ff;
  color: #0099ff;
  min-width: 90px;
}

#play-btn:hover {
  background: #0099ff;
  color: #000;
  border-color: #00ffff;
}

#overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: #000;
  z-index: 9999;
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

#video-wrapper {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000;
}

#video-wrapper iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

#close-btn {
  position: fixed;
  top: 20px;
  right: 25px;
  z-index: 10000;
  background: rgba(0, 0, 0, 0.7);
  color: #fff;
  border: 2px solid rgba(255, 255, 255, 0.6);
  border-radius: 50%;
  width: 48px;
  height: 48px;
  font-size: 28px;
  font-weight: 700;
  line-height: 48px;
  text-align: center;
  cursor: pointer;
  transition: background 0.2s, transform 0.15s;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
  user-select: none;
  font-family: Arial, sans-serif;
  display: none;
}

#close-btn:hover {
  background: rgba(200, 30, 30, 0.9);
  transform: scale(1.1);
}

#close-btn:active {
  transform: scale(0.9);
}

@media (max-width: 500px) {
  .btn {
    padding: 0.6rem 1.2rem;
    font-size: 1.1rem;
    min-width: 60px;
    min-height: 50px;
  }
  #close-btn {
    width: 40px;
    height: 40px;
    font-size: 22px;
    line-height: 40px;
    top: 12px;
    right: 14px;
  }
  #play-btn {
    min-width: 70px;
  }
  .video-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }
}

@media (max-width: 380px) {
  .btn-container {
    gap: 1rem;
  }
}

@keyframes spin3d {
  0%   { transform: rotateY(0deg); }
  100% { transform: rotateY(360deg); }
}

@keyframes flicker {
  0%, 95%, 100% { opacity: 1; }
  96%           { opacity: 0.85; }
  97%           { opacity: 1; }
  98%           { opacity: 0.7; }
  99%           { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>
</head>

<script>
(function() {
  'use strict';
  const dayNames = ['Domingo','Lunes','Martes','Miercoles','Jueves','Viernes','Sabado'];
  function pad(n) { return String(n).padStart(2,'0'); }
  function updateClock() {
    const now = new Date();
    document.getElementById('time').textContent =
      `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    document.getElementById('date').textContent =
      `${dayNames[now.getDay()]}, ${pad(now.getDate())} / ${pad(now.getMonth()+1)} / ${now.getFullYear()}`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  document.querySelectorAll('.video-cell').forEach(function(cell) {
    cell.addEventListener('click', function() {
      const iframeEl = this.querySelector('iframe');
      if (iframeEl && iframeEl.src) {
        openOverlay(iframeEl.src);
      }
    });
  });

  function convertirAEmbed(url) {
    const match = url.match(/[?&]v=([^&]+)/);
    if (match && match[1]) {
      return 'https://www.youtube.com/embed/' + match[1];
    }
    return url;
  }

  const overlay = document.getElementById('overlay');
  const closeBtn = document.getElementById('close-btn');
  const iframe = document.getElementById('player-iframe');
  let isOpen = false;

  function closeOverlay() {
    if (!isOpen) return;
    overlay.style.display = 'none';
    closeBtn.style.display = 'none';
    iframe.src = '';
    isOpen = false;
  }

  function openOverlay(url) {
    if (isOpen) {
      closeOverlay();
      setTimeout(() => openOverlay(url), 300);
      return;
    }

    let finalUrl = url;
    if (url.includes('youtube.com/watch')) {
      finalUrl = convertirAEmbed(url);
      if (!finalUrl.includes('autoplay')) {
        finalUrl += (finalUrl.includes('?') ? '&' : '?') + 'autoplay=1';
      }
    } else if (url.includes('/embed/') && url.includes('youtube')) {
      if (!url.includes('autoplay')) {
        finalUrl = url + (url.includes('?') ? '&' : '?') + 'autoplay=1';
      }
    }

    iframe.src = finalUrl;
    overlay.style.display = 'flex';
    closeBtn.style.display = 'block';
    isOpen = true;
  }

  closeBtn.addEventListener('click', closeOverlay);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && isOpen) closeOverlay();
  });

})();
</script>
