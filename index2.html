<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="screen-orientation" content="landscape">
<title>PuzzleX by Carlos Sivila</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #000000;
  font-family: Arial, sans-serif;
  color: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 0;
  overflow-y: auto;
  overflow-x: hidden;
}

@font-face {
  font-family: 'font';
  src: url('font.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}

:root {
  --neon-lime:   #00ff00;
  --neon-cyan:   #00fff7;
  --neon-yellow: #ffff00;
  --neon-green:  #39ff14;
  --bg:          #000000;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 3px,
    rgba(0,0,0,0.18) 3px,
    rgba(0,0,0,0.18) 4px
  );
  pointer-events: none;
  z-index: 999;
}

#menu-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 5px 16px 24px;
  overflow: auto;
  width: 100%;
  max-width: 1200px;
}

.header-block {
  text-align: center;
  margin-bottom: 5px;
}

h1 {
  font-family: Arial, sans-serif;
  font-size: clamp(2rem, 10vw, 3.8rem);
  letter-spacing: 0.1em;
  color: var(--neon-lime);
  text-shadow: 0 0 8px var(--neon-lime), 0 0 28px var(--neon-lime), 0 0 70px var(--neon-lime);
  animation: flicker 5s infinite;
  line-height: 1.1;
}

.subtitle {
  font-family: Arial, sans-serif;
  font-size: clamp(1.15rem, 2.5vw, 1.35rem);
  letter-spacing: 0.35em;
  color: var(--neon-cyan);
  text-shadow: 0 0 6px var(--neon-cyan), 0 0 16px var(--neon-cyan);
  margin-top: 4px;
}

.clock-wrap {
  margin-top: 6px;
  display: flex;
  justify-content: center;
  gap: 16px;
}

.clock-wrap .main_time,
.clock-wrap .main_date {
  font-family: 'font', Arial, monospace;
  font-size: clamp(1.125rem, 2.5vw, 1.26rem);
  color: red;
  letter-spacing: 0.15em;
}

.symbols-row {
  margin-top: 8px;
  display: flex;
  gap: 24px;
  justify-content: center;
}

.symbols-row span {
  font-size: 2rem;
  color: yellow;
  opacity: 0.75;
  display: inline-block;
  animation: spin3d 10s linear infinite;
}

hr {
     border: none;
     height: 1px;
     background: linear-gradient(90deg, transparent, #ff5c00, transparent);
     width: 100%;
     flex-shrink: 0;
}

.menu {
  font-size: 24px;
  letter-spacing: 2px;
  font-family: 'font', Arial, monospace;
}

a:link, a:visited {
  text-decoration: none;
  color: orange;
}
a:hover {
  text-decoration: none;
  color: red;
}

.video-grid {
  width: 100%;
  max-width: 700px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin: 18px auto;
}

.video-cell {
  position: relative;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: #0a0a0a;
  border: 1px solid #1a1a1a;
  cursor: pointer;
  transition: border 0.3s, box-shadow 0.3s;
}

.video-cell iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
  pointer-events: none;
}

.video-cell:hover {
  border-color: var(--neon-cyan);
  box-shadow: 0 0 14px rgba(0,255,247,0.15);
}

.image-container {
  position: relative;
  width: min(120px, 30vw);
  height: min(120px, 30vw);
  transform-style: preserve-3d;
  transform: perspective(600px) rotateY(0deg);
  transition: transform 0.7s;
  margin: 20px auto;
}

.image-container span {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  transform: rotateY(calc(var(--i) * 45deg)) translateZ(calc(120px * 1.1));
  cursor: pointer;
  border-radius: 10px;
  overflow: hidden;
  border: 2px solid rgba(0, 255, 255, 0.2);
  transition: border 0.3s, box-shadow 0.3s;
  background: #0a0a0a;
}

.image-container span img {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 8px;
}

.image-container span:hover {
  border-color: rgba(0, 255, 255, 0.6) !important;
  box-shadow: 0 0 20px rgba(0, 255, 255, 0.2) !important;
}

@media (min-width: 769px) {
  .image-container {
    width: 140px;
    height: 140px;
  }
  
  .image-container span {
    transform: rotateY(calc(var(--i) * 45deg)) translateZ(calc(140px * 1.2));
  }
}

@media (min-width: 401px) and (max-width: 768px) {
  .image-container {
    width: min(140px, 30vw);
    height: min(140px, 30vw);
  }
  
  .image-container span {
    transform: rotateY(calc(var(--i) * 45deg)) translateZ(calc(min(140px, 30vw) * 1.34));
  }
}

@media (max-width: 400px) {
  .image-container {
    width: min(110px, 28vw);
    height: min(110px, 28vw);
  }
  
  .image-container span {
    transform: rotateY(calc(var(--i) * 45deg)) translateZ(calc(min(110px, 28vw) * 1.34));
    border-radius: 6px;
  }
}

.btn-container {
  display: flex;
  justify-content: center;
  gap: 30px;
  max-width: 600px;
  width: 100%;
  margin: 20px auto;
  flex-wrap: wrap;
}

.btn {
  background: rgba(0, 255, 0, 0.15);
  color: #00ff00;
  border: 2px solid #00ff00;
  padding: 12px 28px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  font-weight: bold;
  transition: all 0.3s ease;
  min-width: 60px;
  min-height: 55px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
  box-shadow: 0 0 15px rgba(0, 255, 0, 0.1);
  z-index: 10;
}

.btn:hover {
  background: #00ff00;
  color: #000;
  border-color: #00ffff;
  box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
  transform: scale(1.05);
}

.btn:active {
  transform: scale(0.95);
}

#refresh {
  background: rgba(255, 165, 0, 0.15);
  border-color: #ff8c00;
  color: #ff8c00;
}

#refresh:hover {
  background: #ff8c00;
  color: #000;
  border-color: #ffff00;
}

@media (max-width: 768px) {
  .btn {
    padding: 12px 20px;
    font-size: 16px;
  }
}

#overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: #000;
  z-index: 9999;
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

#video-wrapper {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000;
}

#video-wrapper iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

#close-btn {
  position: fixed;
  top: 20px;
  right: 25px;
  z-index: 10000;
  background: rgba(0, 0, 0, 0.7);
  color: #fff;
  border: 2px solid rgba(255, 255, 255, 0.6);
  border-radius: 50%;
  width: 48px;
  height: 48px;
  font-size: 28px;
  font-weight: 700;
  line-height: 48px;
  text-align: center;
  cursor: pointer;
  transition: background 0.2s, transform 0.15s;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
  user-select: none;
  font-family: Arial, sans-serif;
  display: none;
}

#close-btn:hover {
  background: rgba(200, 30, 30, 0.9);
  transform: scale(1.1);
}

#close-btn:active {
  transform: scale(0.9);
}

@media (max-width: 768px) {
  .video-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }
  
  #close-btn {
    width: 44px;
    height: 44px;
    font-size: 24px;
    line-height: 44px;
    top: 15px;
    right: 18px;
  }
  
  .btn {
    padding: 12px 20px;
    font-size: 16px;
  }
}

@keyframes spin3d {
  0%   { transform: rotateY(0deg); }
  100% { transform: rotateY(360deg); }
}

@keyframes flicker {
  0%, 95%, 100% { opacity: 1; }
  96%           { opacity: 0.85; }
  97%           { opacity: 1; }
  98%           { opacity: 0.7; }
  99%           { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>
</head>

  function convertirAEmbed(url) {
    if (url.includes('/embed/')) return url;
    const match = url.match(/[?&]v=([^&]+)/);
    if (match && match[1]) {
      return 'https://www.youtube.com/embed/' + match[1];
    }
    return url;
  }

  function getYouTubeID(url) {
    const match = url.match(/[?&]v=([^&]+)/);
    if (match && match[1]) return match[1];
    const embedMatch = url.match(/\/embed\/([^?&]+)/);
    if (embedMatch && embedMatch[1]) return embedMatch[1];
    return null;
  }

  const overlay = document.getElementById('overlay');
  const closeBtn = document.getElementById('close-btn');
  const iframe = document.getElementById('player-iframe');
  let isOpen = false;

  function closeOverlay() {
    if (!isOpen) return;

    if (document.fullscreenElement) {
      document.exitFullscreen().catch(function() {});
    }

    if (screen.orientation && screen.orientation.unlock) {
      try {
        screen.orientation.unlock();
      } catch (e) {}
    }

    overlay.style.display = 'none';
    closeBtn.style.display = 'none';
    iframe.src = '';
    isOpen = false;
    overlay.classList.remove('active-portrait-warning');
  }

  function openOverlay(url) {
    if (isOpen) {
      closeOverlay();
      setTimeout(function() {
        openOverlay(url);
      }, 300);
      return;
    }

    let finalUrl = url;
    if (url.includes('youtube.com/watch')) {
      finalUrl = convertirAEmbed(url);
      // Añadir autoplay para YouTube
      if (!finalUrl.includes('autoplay')) {
        finalUrl += (finalUrl.includes('?') ? '&' : '?') + 'autoplay=1';
      }
    } else if (url.includes('/embed/') && url.includes('youtube')) {
      // Si ya es embed de YouTube, añadir autoplay si no lo tiene
      if (!url.includes('autoplay')) {
        finalUrl = url + (url.includes('?') ? '&' : '?') + 'autoplay=1';
      }
    }

    iframe.src = finalUrl;
    overlay.style.display = 'flex';
    closeBtn.style.display = 'block';
    isOpen = true;

    setTimeout(function() {
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen()
          .catch(function(err) {
            console.warn('No se pudo activar fullscreen:', err);
          });
      }
    }, 100);

    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape')
        .then(function() {
          overlay.classList.remove('active-portrait-warning');
        })
        .catch(function(err) {
          console.warn('No se pudo bloquear orientación landscape:', err);
          overlay.classList.add('active-portrait-warning');
          setTimeout(function() {
            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock('landscape').catch(function() {});
            }
          }, 500);
        });
    } else {
      overlay.classList.add('active-portrait-warning');
    }
  }

  closeBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    closeOverlay();
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && isOpen) {
      closeOverlay();
    }
  });

  document.addEventListener('fullscreenchange', function() {
    if (!document.fullscreenElement && isOpen) {
      if (overlay.style.display === 'flex') {
        closeOverlay();
      }
    }
  });

  document.querySelectorAll('.video-cell').forEach(function(cell) {
    cell.addEventListener('click', function() {
      const iframeEl = this.querySelector('iframe');
      if (iframeEl && iframeEl.src) {
        // Usar la URL del iframe directamente (OK.ru o YouTube embed)
        openOverlay(iframeEl.src);
      }
    });
  });

  function initCarousel() {
    const shuffled = [...videos];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    const selected = shuffled.slice(0, 8);

    const spans = document.querySelectorAll('.image-container span');
    spans.forEach(function(span, index) {
      const videoUrl = selected[index % selected.length];
      const videoId = getYouTubeID(videoUrl);
      const img = span.querySelector('img');
      const label = span.querySelector('.video-label');

      if (videoId) {
        img.src = `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`;
        label.textContent = ''; // SIN NÚMEROS
        span.dataset.videoSrc = videoUrl;
      }
    });
  }

  document.querySelectorAll('.image-container span').forEach(function(span) {
    span.addEventListener('click', function() {
      const url = this.dataset.videoSrc;
      if (url) {
        openOverlay(url);
      }
    });
  });

  const imageContainer = document.getElementById('carouselContainer');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  const refreshBtn = document.getElementById('refresh');

  let x = 0;

  prevBtn.addEventListener('click', function() {
    x += 45;
    imageContainer.style.transform = `perspective(600px) rotateY(${x}deg)`;
  });

  nextBtn.addEventListener('click', function() {
    x -= 45;
    imageContainer.style.transform = `perspective(600px) rotateY(${x}deg)`;
  });

  refreshBtn.addEventListener('click', function() {
    location.reload();
  });

  const dayNames = ['Domingo','Lunes','Martes','Miercoles','Jueves','Viernes','Sabado'];
  function pad(n) { return String(n).padStart(2,'0'); }

  function updateClock() {
    const now = new Date();
    document.getElementById('time').textContent =
      `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    document.getElementById('date').textContent =
      `${dayNames[now.getDay()]}, ${pad(now.getDate())} / ${pad(now.getMonth()+1)} / ${now.getFullYear()}`;
  }

  updateClock();
  setInterval(updateClock, 1000);

  (function alignSubtitle() {
    const h1 = document.querySelector('h1');
    const subtitle = document.querySelector('.subtitle');
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const style = window.getComputedStyle(h1);
    ctx.font = style.fontSize + ' ' + style.fontFamily;
    const emojiWidth = ctx.measureText('🧩 ').width;
    if (subtitle) {
      subtitle.style.paddingLeft = emojiWidth + 'px';
    }
  })();

  window.addEventListener('load', function() {
    setTimeout(initCarousel, 500);
  });

})();
