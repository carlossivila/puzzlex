<title>PuzzleX by Carlos Sivila</title>

<style>
body {
  margin: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: center;
  text-align: center;
  min-height: 100vh;
  width: 100vw;
  background: black;
  overflow-x: hidden;
}

    @font-face {
      font-family: 'font';
      src: url('font.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --neon-lime:   #00ff00;
      --neon-cyan:   #00fff7;
      --neon-yellow: #ffff00;
      --neon-green:  #39ff14;
      --bg:          #000000;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      font-family: Arial, sans-serif;
      color: #fff;
      min-height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      padding: 20px 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,0.18) 3px,
        rgba(0,0,0,0.18) 4px
      );
      pointer-events: none;
      z-index: 999;
    }

    #menu-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 5px 16px 24px;
      overflow: auto;
      width: 100%;
    }

    .header-block {
      text-align: center;
      margin-bottom: 5px;
    }

    h1 {
      font-family: Arial, sans-serif;
      font-size: clamp(2rem, 10vw, 3.8rem);
      letter-spacing: 0.1em;
      color: var(--neon-lime);
      text-shadow:
        0 0 8px  var(--neon-lime),
        0 0 28px var(--neon-lime),
        0 0 70px var(--neon-lime);
      animation: flicker 5s infinite;
      line-height: 1.1;
    }

    .title-group {
      display: inline-block;
    }

    .subtitle {
      font-family: Arial, sans-serif;
      font-size: clamp(1.15rem, 2.5vw, 1.35rem);
      letter-spacing: 0.35em;
      color: var(--neon-cyan);
      text-shadow:
        0 0 6px var(--neon-cyan),
        0 0 16px var(--neon-cyan);
      margin-top: 4px;
    }

    .clock-wrap {
      margin-top: 6px;
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .clock-wrap .main_time,
    .clock-wrap .main_date {
      font-family: 'font', Arial, monospace;
      font-size: clamp(1.125rem, 2.5vw, 1.26rem);
      color: red;
      letter-spacing: 0.15em;
    }

    .game-list {
      list-style: none;
      width: min(460px, 92vw);
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .game-list a {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 16px;
      padding: 8px 18px;
      text-decoration: none;
      color: var(--neon-green);
      font-family: Arial, sans-serif;
      font-size: clamp(1.25rem, 3.5vw, 1.5rem);
      letter-spacing: 0.18em;
      border: 1px solid #1a1a1a;
      border-left: 3px solid var(--neon-green);
      transition: all 0.18s ease;
      position: relative;
      overflow: hidden;
      touch-action: manipulation;
    }

    .game-list a::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--neon-green);
      opacity: 0;
      transition: opacity 0.18s;
    }

    .game-list a:hover::before,
    .game-list a:active::before { opacity: 0.07; }

    .game-list a:hover,
    .game-list a:active {
      color: #fff;
      border-left-color: var(--neon-cyan);
      border-color: #333;
      text-shadow:
        0 0 6px var(--neon-cyan),
        0 0 16px var(--neon-cyan);
      box-shadow: 0 0 14px rgba(0,255,247,0.15);
    }

    .game-num {
      font-family: 'font', Arial, monospace;
      color: #fff;
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      min-width: 22px;
    }

    .game-hint {
      font-family: Arial, sans-serif;
      font-size: clamp(1.3rem, 3.5vw, 1.55rem);
      text-transform: none;
      letter-spacing: 0.05em;
      width: 100%;
      text-align: left;
    }

    .symbols-row {
      margin-top: 8px;
      display: flex;
      gap: 24px;
      justify-content: center;
    }

    .symbols-row span {
      font-size: 2rem;
      color: yellow;
      opacity: 0.75;
      display: inline-block;
      animation: spin3d 10s linear infinite;
    }

    .video-grid {
      position: relative;
      width: min(460px, 92vw);
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(6, 1fr);
      gap: 6px;
    }

    .video-cell {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      min-width: 0;
    }

    .video-cell iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .video-cell.empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      font-family: Arial, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .video-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      cursor: pointer;
      background: rgba(0,0,0,0);
      transition: background 0.15s;
    }

    .video-cell:not(.empty):hover .video-overlay {
      background: rgba(0,255,247,0.08);
      box-shadow: inset 0 0 0 2px var(--neon-cyan);
    }

    .video-close {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 4;
      display: none;
      width: 34px;
      height: 34px;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.75);
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
      font-family: Arial, sans-serif;
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
      pointer-events: auto;
      text-shadow: 0 0 6px var(--neon-cyan);
    }

    .video-cell.expanded {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      aspect-ratio: auto;
      border-color: var(--neon-cyan);
    }

    .video-cell.expanded .video-overlay {
      pointer-events: none;
      background: transparent;
    }

    .video-cell.expanded .video-close {
      display: flex;
    }

   hr {
     border: none;
     height: 1px;
     background: linear-gradient(90deg, transparent, #ff5c00, transparent);
     width: 100%;
     flex-shrink: 0;
    }

.menu {
  font-size: 24px; 
  letter-spacing: 2px; 
  font-family: 'font', Arial, monospace;
}

a:link,a:visited {
text-decoration: none;
color: orange;
}
a:hover {
text-decoration: none;
color: red;
}

    @keyframes spin3d {
      0%   { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }

    @keyframes flicker {
      0%, 95%, 100% { opacity: 1; }
      96%           { opacity: 0.85; }
      97%           { opacity: 1; }
      98%           { opacity: 0.7; }
      99%           { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }

    @media (max-width: 480px) {
      #menu-screen { padding: 5px 12px 20px; }
      .header-block { margin-bottom: 12px; }
      .divider { margin-bottom: 10px; }
      .game-list { gap: 6px; }
      .game-list a { padding: 12px 14px; }
    }

.carrusel-section {
  width: 100%;
  max-width: 1200px;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px;
  margin-top: 20px;
  border-top: 1px solid rgba(0,255,0,0.3);
}

.image-container {
  position: relative;
  width: 100px;
  height: 100px;
  transform-style: preserve-3d;
  transform: perspective(600px) rotateY(0deg);
  transition: transform 0.7s;
  margin-bottom: 30px;
}

.image-container span {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  transform: rotateY(calc(var(--i) * 45deg)) translateZ(120px);
  cursor: pointer;
}

.image-container span img {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 5px;
}

.video-label {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0, 0, 0, 0.8);
  color: white;
  padding: 5px 10px;
  border-radius: 5px;
  font-size: 12px;
  font-weight: bold;
  pointer-events: none;
  z-index: 10;
}

.btn-container {
  position: relative;
  width: 80%;
  max-width: 500px;
  display: flex;
  justify-content: space-between;
  padding: 0 20px;
  box-sizing: border-box;
  gap: 10px;
}

.btn {
  background: green;
  color: lime;
  border: 1px solid green;
  padding: 10px 20px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
}

.btn:hover {
  background: lime;
  color: red;
  border: 1px solid cyan;
  filter: brightness(1.5);
}

.btn:active {
  background: lime;
  color: blue;
  border: 1px solid yellow;
  filter: brightness(1.5);
}

/* ===== ESTILOS DEL MODAL (clonados del grid) ===== */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0, 0, 0, 0.9);
  z-index: 100;
  justify-content: center;
  align-items: center;
}

.modal-overlay.active {
  display: flex;
}

.modal-content {
  position: relative;
  width: 90vw;
  max-width: 900px;
  aspect-ratio: 16 / 9;
  background: #0a0a0a;
  border: 1px solid var(--neon-cyan);
  box-shadow: 0 0 30px rgba(0, 255, 247, 0.15);
  overflow: hidden;
}

.modal-content iframe {
  width: 100%;
  height: 100%;
  border: none;
  border-radius: 0;
  display: block;
}

.modal-close {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 4;
  display: flex;
  width: 34px;
  height: 34px;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.75);
  color: var(--neon-cyan);
  border: 1px solid var(--neon-cyan);
  font-family: Arial, sans-serif;
  font-size: 1.1rem;
  line-height: 1;
  cursor: pointer;
  pointer-events: auto;
  text-shadow: 0 0 6px var(--neon-cyan);
  border-radius: 0;
  padding: 0;
}

.modal-close:hover {
  background: rgba(0, 255, 247, 0.15);
  box-shadow: inset 0 0 0 2px var(--neon-cyan);
}

/* ===== FIN ESTILOS MODAL ===== */

@media (orientation: landscape) {
  .image-container {
    width: 120px;
    height: 120px;
  }
  
  .image-container span {
    transform: rotateY(calc(var(--i) * 45deg)) translateZ(150px);
  }
}

@media (max-width: 480px) {
  .btn-container {
    width: 95%;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn {
    padding: 8px 12px;
    font-size: 12px;
  }
}
</style>
</head>

function getYouTubeID(url) {
  const match = url.match(/[?&]v=([^&]+)/);
  return match ? match[1] : null;
}

function getRandomVideos() {
  const indices = [];
  const randomVideos = [];
  
  while (indices.length < 8) {
    const randomIndex = Math.floor(Math.random() * videos.length);
    if (!indices.includes(randomIndex)) {
      indices.push(randomIndex);
      randomVideos.push({
        url: videos[randomIndex],
        number: randomIndex + 1
      });
    }
  }
  
  return randomVideos;
}

const randomVideos = getRandomVideos();
const spans = document.querySelectorAll('.image-container span');

spans.forEach((span, index) => {
  const video = randomVideos[index];
  const videoID = getYouTubeID(video.url);
  const img = span.querySelector('img');
  const label = span.querySelector('.video-label');

  if (videoID) {
    img.src = `https://img.youtube.com/vi/${videoID}/mqdefault.jpg`;
  }

  label.textContent = `Video ${video.number}`;
  
  span.addEventListener('click', () => {
    if (videoID) {
      openModal(videoID);
    }
  });
});

const modalOverlay = document.getElementById("modalOverlay");
const modalPlayer = document.getElementById("modalPlayer");
const modalClose = document.getElementById("modalClose");

function openModal(videoID) {
  modalPlayer.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoID}?autoplay=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;
  modalOverlay.classList.add("active");
}

function closeModal() {
  modalOverlay.classList.remove("active");
  modalPlayer.innerHTML = "";
}

modalClose.addEventListener("click", closeModal);
modalOverlay.addEventListener("click", (e) => {
  if (e.target === modalOverlay) {
    closeModal();
  }
});

const imageContainer = document.getElementById("carouselContainer");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");

let x = 0;

prevBtn.addEventListener("click", () => {
  x = x + 45;
  rotate();
});

nextBtn.addEventListener("click", () => {
  x = x - 45;
  rotate();
});

function rotate() {
  imageContainer.style.transform = `perspective(600px) rotateY(${x}deg)`;
}

const refreshBtn = document.getElementById("refresh");

refreshBtn.addEventListener("click", () => {
  location.reload();
});




document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
});

const audio = document.getElementById('bgAudio');
document.addEventListener('click', function(e) {
    if (e.target.closest('a')) return;
    if (e.target.closest('#videoGrid')) return;
    if (audio.paused) {
        audio.volume = 0.45;
        audio.play().catch(() => {});
    }
});

(function alignSubtitle() {
  const h1 = document.querySelector('h1');
  const subtitle = document.querySelector('.subtitle');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const style = window.getComputedStyle(h1);
  ctx.font = style.fontSize + ' ' + style.fontFamily;
  const emojiWidth = ctx.measureText('🧩 ').width;
  subtitle.style.paddingLeft = emojiWidth + 'px';
})();

const dayNames = ['Domingo','Lunes','Martes','Miercoles','Jueves','Viernes','Sabado'];
function pad(n) { return String(n).padStart(2,'0'); }
function updateClock() {
  const now = new Date();
  document.getElementById('time').textContent =
    `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  document.getElementById('date').textContent =
    `${dayNames[now.getDay()]}, ${pad(now.getDate())} / ${pad(now.getMonth()+1)} / ${now.getFullYear()}`;
}
updateClock();
setInterval(updateClock, 1000);

(function videoGridExpand() {
  const grid = document.getElementById('videoGrid');
  if (!grid) return;
  function collapseAll() {
    grid.querySelectorAll('.video-cell.expanded').forEach(c => c.classList.remove('expanded'));
  }

  grid.addEventListener('click', function(e) {
    const overlay = e.target.closest('.video-overlay');
    const closeBtn = e.target.closest('.video-close');
    const cell = e.target.closest('.video-cell');
    if (!cell || cell.classList.contains('empty')) return;

    if (closeBtn) {
      collapseAll();
      return;
    }
    if (overlay) {
      collapseAll();
      cell.classList.add('expanded');
      if (!audio.paused) audio.pause();
    }
  });
})();
